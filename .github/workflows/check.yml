# Cheap gate on every push/PR: typecheck, tests and `cargo check` per OS (compiles whisper.cpp, which is
# what broke the release builds). No bundling or signing; the full builds run only on tags (release.yml).
name: check

on:
  push:
    branches: [master, test]
  pull_request:

# Read-only token: the jobs run repo code (tests, build scripts) after checkout persists the token.
permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: windows-11-arm # only caught at release time before (#40)
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    env:
      # ponytail: mirrors bundle.macOS.minimumSystemVersion (tauri build sets it from there); keep in sync
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Stub frontend and model
        shell: bash
        # cargo check only needs these paths to exist, not their contents
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html && touch src-tauri/resources/ggml-base-q5_1.bin
      # Same as release.yml: ggml refuses MSVC on ARM, so whisper.cpp builds with clang-cl through Ninja.
      - name: Windows ARM compiler
        if: matrix.platform == 'windows-11-arm'
        shell: bash
        run: printf 'CMAKE_GENERATOR=Ninja\nCC=clang-cl\nCXX=clang-cl\nCXXFLAGS=/EHsc\n' >> "$GITHUB_ENV"
      # The cached CMakeCache.txt keeps the old MSVC path; when the runner image updates Visual Studio,
      # whisper-rs-sys fails with "CMAKE_ASM_COMPILER is not a full path". Drop it so CMake reconfigures.
      - name: Drop stale CMake cache
        if: runner.os == 'Windows'
        shell: bash
        run: find src-tauri/target -name CMakeCache.txt -path '*whisper-rs-sys*' -delete 2>/dev/null || true
      - run: cargo check --locked --target ${{ matrix.target }}
        working-directory: src-tauri
