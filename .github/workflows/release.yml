# Builds macOS (Apple silicon + Intel), Windows and Linux and uploads them with a merged latest.json
# to a draft GitHub release. Push a tag `v<version>` (matching tauri.conf.json), wait for all jobs,
# then publish the draft: the in-app updater only sees published releases.
# Manual runs (workflow_dispatch) just build, as a smoke test, without touching releases.
# A tag with a pre-release part (v1.8.0-1) makes a pre-release: only beta testers get it (channel.yml).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # One draft before the matrix starts: four jobs looking for it at once made two drafts for v1.5.0.
  release:
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        # The id comes from the create response: listing releases right after creating a draft can miss it
        # (v1.6.0 got an empty id, so every build skipped its upload). GitHub appends its PR list to the body:
        # edit it before publishing, the app shows it in "What's new" (src/releaseNotes.ts drops the download note).
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -F draft=true -F prerelease=$([[ $TAG == *-* ]] && echo true || echo false) -F generate_release_notes=true -f name="Sprigo ${TAG#v}" \
            -f body="Downloads for macOS, Windows and Linux. The macOS app is not notarized yet: see the README for the one-time \`xattr\` command." --jq .id)
          [ -n "$id" ] || { echo "no release id" >&2; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    if: ${{ !cancelled() && needs.release.result != 'failure' }} # manual runs skip `release` and still build
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: ubuntu-22.04-arm # Raspberry Pi 5, Asahi (#40)
            args: ""
          - platform: windows-latest
            args: ""
          - platform: windows-11-arm # Windows on ARM laptops (#40)
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libdbus-1-dev pkg-config
          # The AppImage copies GStreamer plugins from here (bundleMediaFramework). Without base (appsrc, autodetect),
          # good (pulse) and pipewire, WebKitGTK has no audio in or out on hosts whose own plugins can't load (#138).
          sudo apt-get install -y gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-pipewire

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      # ggml defaults to -march=native: the runner's AVX-512 ended up in the Windows build and crashed
      # CPUs without it (#120). OFF keeps AVX2/FMA/F16C, no AVX-512; on ARM Linux/Windows it builds for plain
      # armv8-a. Not on macOS: Intel is cross-built (already portable) and Apple silicon wants its native ARM flags.
      # ponytail: armv8-a baseline; GGML_CPU_ARM_ARCH=armv8.2-a+dotprod if whisper is too slow on a Pi 5.
      - name: Portable CPU build
        if: matrix.platform != 'macos-latest'
        shell: bash
        run: echo "GGML_NATIVE=OFF" >> "$GITHUB_ENV"

      # ggml refuses MSVC on ARM ("use clang"): build whisper.cpp with clang-cl through Ninja there.
      - name: Windows ARM compiler
        if: matrix.platform == 'windows-11-arm'
        shell: bash
        run: printf 'CMAKE_GENERATOR=Ninja\nCC=clang-cl\nCXX=clang-cl\nCXXFLAGS=/EHsc\n' >> "$GITHUB_ENV" # cc's flags replace CMake's defaults, /EHsc included

      # With the default Visual Studio generator, cmake-rs replaces CMAKE_<LANG>_FLAGS_RELEASE with cc's flags minus
      # every /O*, so whisper.cpp built unoptimized and was ~10x slower (#135). whisper-rs-sys passes CMAKE_* env
      # to CMake and cmake-rs keeps a value that is already defined. ARM uses Ninja, which cmake-rs leaves alone.
      - name: Windows optimization flags
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: printf 'CMAKE_C_FLAGS_RELEASE=/MD /O2 /Ob2 /DNDEBUG\nCMAKE_CXX_FLAGS_RELEASE=/MD /O2 /Ob2 /DNDEBUG /utf-8\n' >> "$GITHUB_ENV"

      # RPM refuses the '-' in pre-release versions (1.12.0-1): betas ship .deb and AppImage only on Linux.
      - name: Linux pre-release bundles
        if: startsWith(matrix.platform, 'ubuntu')
        shell: bash
        run: |
          if grep -q '"version": "[^"]*-' src-tauri/tauri.conf.json; then echo "BUNDLE_ARGS=--bundles deb,appimage" >> "$GITHUB_ENV"; fi

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          # whisper-rs-sys doesn't rerun its build script when GGML_*/CMAKE_* change: a new suffix drops the old cache.
          key: ${{ matrix.platform }}${{ matrix.args }}-portable-o2

      - run: pnpm install --frozen-lockfile
      - name: Whisper model
        shell: bash
        run: pnpm fetch-model

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.release.outputs.id }} # empty on manual runs: build only
          # ponytail: each job merges latest.json as it finishes; two finishing in the same second could drop a platform. Check it before publishing.
          args: ${{ matrix.args }} ${{ env.BUNDLE_ARGS }}

      # #138: fail the build if the AppImage lacks the GStreamer plugins WebKitGTK needs for audio.
      - name: Check AppImage audio plugins
        if: startsWith(matrix.platform, 'ubuntu')
        shell: bash
        run: |
          img=$(find src-tauri/target -name '*.AppImage' | head -1)
          [ -n "$img" ] || { echo "no AppImage" >&2; exit 1; }
          chmod +x "$img" && (cd /tmp && "$OLDPWD/$img" --appimage-extract >/dev/null)
          ls /tmp/squashfs-root/usr/lib/gstreamer-1.0/
          for p in libgstapp libgstautodetect libgstpulseaudio libgstpipewire; do
            ls /tmp/squashfs-root/usr/lib/gstreamer-1.0/$p.so >/dev/null || { echo "AppImage lacks $p (#138)" >&2; exit 1; }
          done
      - name: Upload AppImage (manual runs)
        if: github.event_name == 'workflow_dispatch' && startsWith(matrix.platform, 'ubuntu')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: appimage-${{ matrix.platform }}
          path: src-tauri/target/**/*.AppImage

      # #135 shipped silently: fail the build if whisper.cpp was configured without /O2.
      - name: Check whisper.cpp is optimized
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # find, not a fixed path: Cargo moved build-script output from build/<pkg>-<hash>/ to build/<pkg>/<hash>/.
          caches=$(find src-tauri/target -name CMakeCache.txt -path '*whisper-rs-sys*')
          echo "$caches"
          [ -n "$caches" ] || { echo "no CMakeCache.txt for whisper-rs-sys" >&2; exit 1; }
          flags=$(grep -h -E '^CMAKE_(C|CXX)_FLAGS_RELEASE:' $caches || true)
          echo "$flags"
          [ -n "$flags" ] && ! grep -v -E '[-/]O2' <<< "$flags" || { echo "whisper.cpp is not built with /O2 (#135)" >&2; exit 1; }
