name: experimental web edition

on:
  push:
    paths: ["deploy/web/**"]
  pull_request:
    paths: ["deploy/web/**"]

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check Compose configuration
        run: docker compose -f deploy/web/compose.yaml config --quiet
      - name: Build browser image
        run: docker build -f deploy/web/Dockerfile -t sprigo-web:ci .
      - name: Python security tests
        run: python -m unittest discover -s deploy/web -p 'test_*.py'
