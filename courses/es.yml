      - id: health-body
        title: Health & the Body
        description: Say what hurts, see a doctor and give advice.
        icon: 🩺
        steps:
          - id: body-parts
            title: The Body
            vocabulary: ["la cabeza", "el brazo", "la mano", "la pierna", "el pie", "la espalda", "el estómago", "la garganta"]
