              - { type: fill_blank, count: 3 }
              - { type: word_bank }
              - { type: listen_select }
          - id: futuro-irregular
            title: Future Tense (Irregular)
            description: Irregular futures like tendré, haré, podré and saldré.
            vocabulary: [tendré, haré, podré, saldré, vendré, diré, sabré, querré]
            grammar:
              - pattern: "Tendré más tiempo en agosto."
              - pattern: "¿Qué harás el fin de semana?"
              - pattern: "No podré venir mañana."
            activities:
              - { type: learn, count: 2 }
              - { type: match }
              - { type: error_correct, count: 2 }
              - { type: listen_type }
          - id: si-futuro
            title: If … Then
            description: Real conditions with si + present + future.
            vocabulary: [si, "si llueve", "si tengo tiempo", "si puedo", entonces]
            grammar:
              - pattern: "Si llueve, nos quedaremos en casa."
              - pattern: "Si tengo tiempo, te llamaré."
              - pattern: "¿Qué harás si no encuentras trabajo?"
            activities:
