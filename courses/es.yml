  B1:
    title: Intermediate
    description: >
      Deal with most everyday situations, narrate experiences and events, express wishes, opinions and plans, and briefly give reasons for them.

    units:
      - id: past-tenses
        title: Past Tenses Together
        description: Combine the past tenses to tell what happened, what had happened before and how things were.
        icon: 🕰️
        steps:
          - id: perfecto-indefinido
            title: Perfecto or Indefinido?
            description: He comido for today and this week; comí for yesterday and finished times.
            vocabulary: [hoy, "esta mañana", "este año", ayer, anoche, "el año pasado", "hace dos días", "alguna vez", "en 2019"]
            grammar:
              - pattern: "Esta mañana he desayunado en casa."
              - pattern: "Ayer desayuné en un bar."
              - pattern: "¿Has estado alguna vez en México? Sí, estuve allí en 2019."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct }
          - id: pluscuamperfecto
            title: Pluscuamperfecto
            description: Say what had already happened before another past event with había + participle.
            vocabulary: [había, habías, habíamos, habían, ya, todavía, antes, "cuando llegué", "nunca antes"]
            grammar:
              - pattern: "Cuando llegué a la estación, el tren ya había salido."
              - pattern: "Nunca había visto el mar antes de ese viaje."
              - pattern: "Ellos ya habían cenado cuando los llamamos."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: translate }
          - id: narrating-past
            title: Narrating the Past
            description: Mix indefinido for events, imperfecto for background and pluscuamperfecto for earlier events.
            vocabulary: ["de repente", "en ese momento", "al final", "mientras", "un rato después", "por suerte", "por desgracia", "resulta que"]
            grammar:
              - pattern: "Hacía sol y paseábamos por el parque cuando de repente empezó a llover."
              - pattern: "Me di cuenta de que había olvidado las llaves."
              - pattern: "Mientras yo cocinaba, mi hermano puso la mesa."
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: listen_type }
          - id: anecdote
            title: Telling an Anecdote
            description: Tell a short personal story and react to someone else's.
            vocabulary: ["¿Sabes qué me pasó?", "fíjate", "¡Qué fuerte!", "¡No me digas!", "total, que", "lo peor fue que", "lo mejor fue que", "me quedé sin palabras"]
            grammar:
              - pattern: "¿Sabes qué me pasó el otro día?"
              - pattern: "Lo peor fue que no había traído el móvil."
              - pattern: "Total, que al final llegamos tardísimo."
            activities:
              - { type: learn }
              - { type: sentence_complete, count: 2 }
              - { type: listen_select, count: 2 }
              - type: dialogue
                scenario: telling_an_anecdote
                goal: Tell a friend a funny or surprising thing that happened to you, using several past tenses.

      - id: wishes-feelings
        title: Wishes & Feelings
        description: Express wishes, hopes and feelings with the present subjunctive.
        icon: 🌠
        steps:
          - id: subjuntivo-regular
            title: Present Subjunctive
            description: "Form the regular present subjunctive: -ar verbs take -e, -er/-ir verbs take -a."
            vocabulary: [hable, hables, coma, comas, viva, vivan, trabaje, estudie, escriba, "que"]
            grammar:
              - pattern: "Quiero que hables con ella."
              - pattern: "Es necesario que comamos algo."
              - pattern: "Prefiero que vivan cerca de nosotros."
            activities:
              - { type: learn, count: 3 }
              - { type: fill_blank, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: listen_type }
          - id: subjuntivo-irregular
            title: Irregular Subjunctive
            description: Learn sea, vaya, tenga, haga, esté, sepa and verbs built on the yo form.
            vocabulary: [sea, vaya, tenga, haga, esté, sepa, venga, diga, salga, pueda]
            grammar:
              - pattern: "Espero que tengas un buen viaje."
              - pattern: "No quiero que vayas solo."
              - pattern: "Es importante que sepa la verdad."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: translate }
          - id: querer-esperar-que
            title: Querer & Esperar Que
            description: Infinitive with the same subject, que + subjunctive with a different subject.
            vocabulary: [querer, esperar, preferir, necesitar, desear, "me alegra", "me molesta", "me da miedo", "me encanta"]
            grammar:
              - pattern: "Quiero viajar. / Quiero que viajes conmigo."
              - pattern: "Me alegra que estés aquí."
              - pattern: "Me molesta que la gente hable tan alto."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: word_bank }
          - id: ojala
            title: Ojalá
            description: Express hopes and good wishes with ojalá and que + subjunctive.
            vocabulary: [ojalá, "¡Que te mejores!", "¡Que lo pases bien!", "¡Que tengas suerte!", "¡Que aproveche!", "¡Que descanses!", felicidades, "la suerte"]
            grammar:
              - pattern: "Ojalá haga buen tiempo mañana."
              - pattern: "Ojalá que apruebes el examen."
              - pattern: "¡Que tengas un buen fin de semana!"
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: listen_select, count: 2 }
              - type: dialogue
                scenario: wishing_a_friend_luck
                goal: Wish a friend luck before an important event and say what you hope will happen.

      - id: opinions
        title: Opinions
        description: Give and justify opinions, and agree or disagree politely.
        icon: 💬
        steps:
          - id: creo-que
            title: Creo Que / No Creo Que
            description: Indicative after creo que and pienso que; subjunctive after no creo que.
            vocabulary: ["creo que", "no creo que", "pienso que", "me parece que", "no me parece que", "en mi opinión", "para mí", "estoy seguro de que"]
            grammar:
              - pattern: "Creo que tienes razón."
              - pattern: "No creo que sea una buena idea."
              - pattern: "Me parece que el precio es demasiado alto."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct }
          - id: agreeing-disagreeing
            title: Agreeing & Disagreeing
            description: Agree, disagree and partly agree without sounding rude.
            vocabulary: ["estoy de acuerdo", "no estoy de acuerdo", "tienes razón", "yo también", "yo tampoco", "depende", "no es para tanto", "en parte sí, pero"]
            grammar:
              - pattern: "Estoy de acuerdo contigo."
              - pattern: "No estoy de acuerdo con lo que dices."
              - pattern: "En parte tienes razón, pero no del todo."
            activities:
              - { type: learn, count: 2 }
              - { type: match }
              - { type: listen_select, count: 2 }
              - { type: sentence_complete, count: 2 }
          - id: giving-reasons
            title: Giving Reasons
            description: Explain why with porque, ya que, como and por eso.
            vocabulary: [porque, "ya que", como, "por eso", "así que", "debido a", "es que", "por lo tanto"]
            grammar:
              - pattern: "Como no tenía dinero, me quedé en casa."
              - pattern: "No voy a la fiesta porque estoy muy cansado."
              - pattern: "Ya que estás aquí, ayúdame con esto."
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: translate }
          - id: discussing-topic
            title: Discussing a Topic
            description: Exchange opinions on an everyday issue and back them up.
            vocabulary: ["el tema", "la ventaja", "el problema", "la solución", "por ejemplo", "sin embargo", "además", "desde mi punto de vista"]
            grammar:
              - pattern: "Desde mi punto de vista, el transporte público es la mejor solución."
              - pattern: "Sin embargo, no creo que todo el mundo pueda usarlo."
              - pattern: "Además, es más barato que tener coche."
            activities:
              - { type: learn }
              - { type: sentence_complete, count: 2 }
              - { type: listen_type }
              - type: dialogue
                scenario: city_debate
                goal: Discuss whether cars should be banned from the city centre, giving reasons for your opinion.

      - id: advice-requests
        title: Advice & Requests
        description: Give instructions, warnings and advice formally and informally.
        icon: 🧭
        steps:
          - id: imperativo-usted
            title: Formal Imperative
            description: Give instructions with usted and ustedes, which take subjunctive forms.
            vocabulary: [pase, siga, gire, espere, firme, rellene, "tome asiento", "pasen ustedes", "siéntense"]
            grammar:
              - pattern: "Pase, por favor, y tome asiento."
              - pattern: "Siga recto y gire a la derecha."
              - pattern: "Rellenen este formulario, por favor."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: listen_select, count: 2 }
              - { type: multiple_choice }
          - id: imperativo-negativo
            title: Negative Imperative
            description: Tell someone not to do something with no + subjunctive.
            vocabulary: ["no hables", "no comas", "no vayas", "no digas", "no hagas", "no te preocupes", "no toques", "no llegue tarde"]
            grammar:
              - pattern: "No hables tan alto, por favor."
              - pattern: "No te preocupes, todo va a salir bien."
              - pattern: "No llegue tarde a la reunión."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: translate }
          - id: imperativo-pronombres
            title: Imperative with Pronouns
            description: Attach pronouns to positive commands, place them before negative ones.
            vocabulary: [dámelo, dímelo, explícamelo, póntelo, siéntate, cállate, "no me lo des", "no se lo digas", "no te lo pongas"]
            grammar:
              - pattern: "¿El libro? Dámelo, por favor."
              - pattern: "No se lo digas a nadie."
              - pattern: "Siéntate aquí y no te muevas."
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: sentence_complete }
          - id: recomendar-que
            title: Recommending
            description: Give advice with recomendar, aconsejar and sugerir que + subjunctive.
            vocabulary: [recomendar, aconsejar, sugerir, "te recomiendo que", "te aconsejo que", "le sugiero que", "lo mejor es que", "deberías"]
            grammar:
              - pattern: "Te recomiendo que pruebes la paella."
              - pattern: "El médico me aconseja que duerma más."
              - pattern: "Lo mejor es que lo hables con tu jefe."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: sentence_complete }
              - type: dialogue
                scenario: advising_a_visitor
                goal: Recommend places, food and tips to a friend who is visiting your city for the first time.

      - id: hypotheses
        title: Hypotheses
        description: Talk about imaginary situations, polite requests and advice with the conditional.
        icon: 💭
        steps:
          - id: condicional
            title: The Conditional
            description: Form the conditional, including the irregular stems tendr-, podr-, har-, dir-.
            vocabulary: [viajaría, compraría, viviría, tendría, podría, haría, diría, saldría, querría, vendría]
            grammar:
              - pattern: "Con más tiempo, viajaría por toda Sudamérica."
              - pattern: "Yo no diría eso."
              - pattern: "Me gustaría vivir cerca del mar."
            activities:
              - { type: learn, count: 3 }
              - { type: fill_blank, count: 2 }
              - { type: multiple_choice }
              - { type: listen_type }
          - id: peticiones-corteses
            title: Polite Requests
            description: Ask for things and favours politely with ¿podrías…? and ¿te importaría…?
            vocabulary: ["¿podrías…?", "¿podría…?", "¿te importaría…?", "me gustaría", "¿sería posible…?", "un favor", "abrir la ventana", "bajar la música"]
            grammar:
              - pattern: "¿Podrías ayudarme con la maleta?"
              - pattern: "¿Le importaría cerrar la puerta?"
              - pattern: "Me gustaría hablar con el responsable."
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: translate }
          - id: yo-que-tu
            title: If I Were You
            description: Give advice with yo que tú, yo en tu lugar and deberías.
            vocabulary: ["yo que tú", "yo en tu lugar", deberías, "tendrías que", "sería mejor", "valdría la pena", "no lo pensaría", "aceptaría"]
            grammar:
              - pattern: "Yo que tú, aceptaría el trabajo."
              - pattern: "Yo en tu lugar, hablaría con ella."
              - pattern: "Deberías descansar un poco más."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct }
          - id: si-tuviera
            title: If I Had…
            description: "Imagine unreal situations: si + imperfect subjunctive, then the conditional (intro)."
            vocabulary: [tuviera, fuera, pudiera, viviera, ganara, "si tuviera", "si fuera", "la lotería"]
            grammar:
              - pattern: "Si tuviera más dinero, viajaría por el mundo."
              - pattern: "Si fuera tú, no lo haría."
              - pattern: "¿Qué harías si ganaras la lotería?"
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: sentence_complete }
              - type: dialogue
                scenario: dream_life
                goal: Talk with a friend about what you would do if you won the lottery or could live anywhere.

      - id: reported-speech-b1
        title: Reported Speech
        description: Report what other people say, said and asked.
        icon: 🗣️
        steps:
          - id: dice-que
            title: Dice Que
            description: Report what someone says now, without changing the tense.
            vocabulary: ["dice que", "dicen que", "comenta que", "explica que", "cuenta que", "me ha dicho que", "según él", "según ella"]
            grammar:
              - pattern: "Marta dice que está cansada."
              - pattern: "Mis padres dicen que vienen el sábado."
              - pattern: "Según él, la reunión es a las diez."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: listen_type, count: 2 }
              - { type: word_bank }
          - id: dijo-que
            title: Dijo Que
            description: Shift tenses back when reporting past speech; present becomes imperfecto, indefinido becomes pluscuamperfecto.
            vocabulary: ["dijo que", "me contó que", "explicó que", "comentó que", "aquel día", "el día anterior", "al día siguiente", "allí"]
            grammar:
              - pattern: "Dijo que estaba muy ocupado."
              - pattern: "Me contó que había perdido el pasaporte."
              - pattern: "Explicó que iría al día siguiente."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: translate }
          - id: pregunto-si
            title: Preguntó Si / Qué
            description: Report questions with preguntar si and question words with accents.
            vocabulary: ["preguntó si", "me preguntó qué", "quería saber", "dónde", "cuándo", "cómo", "por qué", "cuánto"]
            grammar:
              - pattern: "Me preguntó si quería ir al cine."
              - pattern: "Quería saber dónde vivía."
              - pattern: "Le pregunté por qué no había venido."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: error_correct }
          - id: reporting-conversation
            title: Reporting a Conversation
            description: Pass on a conversation, a message or a piece of news to someone else.
            vocabulary: [avisar, recordar, prometer, pedir, "me pidió que", "me prometió que", "el recado", "de su parte"]
            grammar:
              - pattern: "Me pidió que te llamara."
              - pattern: "Me prometió que no volvería a pasar."
              - pattern: "Te llamó Luis y me dijo que lo llamaras de su parte."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: listen_select, count: 2 }
              - type: dialogue
                scenario: passing_on_news
                goal: Tell a friend what a colleague told you and asked you during a phone call.

      - id: relative-clauses
        title: Relative Clauses
        description: Join ideas and describe people, places and things with relative pronouns.
        icon: 🔗
        steps:
          - id: que-quien
            title: Que & Quien
            description: Use que for people and things, quien after prepositions and for people.
            vocabulary: [que, quien, quienes, "con quien", "para quien", "el chico que", "la película que", "la persona que"]
            grammar:
              - pattern: "El chico que vive al lado es médico."
              - pattern: "La película que vimos ayer era muy buena."
              - pattern: "Ella es la amiga con quien viajé a Perú."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: translate }
          - id: donde-lo-que
            title: Donde & Lo Que
            description: Refer to places with donde and to whole ideas with lo que.
            vocabulary: [donde, "lo que", "el pueblo donde", "la casa donde", "todo lo que", "lo que más me gusta", "lo que pasa es que", "lo que quieras"]
            grammar:
              - pattern: "Este es el pueblo donde nació mi abuela."
              - pattern: "Lo que más me gusta es viajar."
              - pattern: "No entiendo lo que dices."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: error_correct }
          - id: el-que-cuyo
            title: El Que & Cuyo
            description: Use el que / la que after prepositions and cuyo to show possession.
            vocabulary: ["el que", "la que", "los que", "las que", "en el que", "con la que", cuyo, cuya]
            grammar:
              - pattern: "Esa es la empresa en la que trabajo."
              - pattern: "Los que quieran venir, que se apunten."
              - pattern: "Tengo un amigo cuya madre es actriz."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: translate }
          - id: describing-someone
            title: Describing Someone You Know
            description: Describe someone's character and identify people with relative clauses.
            vocabulary: [simpático, generoso, tímido, cariñoso, testarudo, "de confianza", "llevarse bien con", "es de los que"]
            grammar:
              - pattern: "Es una persona en la que puedes confiar."
              - pattern: "Mi tío es de los que siempre llegan tarde."
              - pattern: "Me llevo muy bien con la gente que es sincera."
            activities:
              - { type: learn }
              - { type: sentence_complete, count: 2 }
              - { type: listen_type }
              - type: dialogue
                scenario: describing_a_friend
                goal: Describe a close friend or relative and explain why this person is important to you.

      - id: work-careers
        title: Work & Careers
        description: Apply for jobs, take part in interviews and meetings, and talk about your career.
        icon: 📈
        steps:
          - id: applying-job
            title: Applying for a Job
            description: Talk about a CV, a cover letter and the requirements of a job offer.
            vocabulary: ["el currículum", "la carta de presentación", "la oferta de empleo", "el puesto", "los requisitos", "la formación", "solicitar", "el candidato"]
            grammar:
              - pattern: "Me gustaría solicitar el puesto de recepcionista."
              - pattern: "Buscan a alguien que hable inglés."
              - pattern: "Le adjunto mi currículum."
            activities:
              - { type: learn, count: 2 }
              - { type: match }
              - { type: fill_blank, count: 2 }
              - { type: translate }
          - id: interview-advanced
            title: The Job Interview
            description: Talk about your strengths, weaknesses and achievements in an interview.
            vocabulary: ["los puntos fuertes", "los puntos débiles", "el logro", responsable, organizado, "trabajar en equipo", "bajo presión", "la incorporación"]
            grammar:
              - pattern: "Uno de mis puntos fuertes es que trabajo bien en equipo."
              - pattern: "En mi último trabajo conseguí aumentar las ventas."
              - pattern: "¿Cuándo podría incorporarse?"
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: listen_type }
              - { type: multiple_choice }
          - id: at-meeting
            title: At a Meeting
            description: Make suggestions, interrupt politely and summarise decisions in a meeting.
            vocabulary: ["la reunión", "el orden del día", "el plazo", "el proyecto", proponer, "perdona que te interrumpa", "en resumen", "quedamos en que"]
            grammar:
              - pattern: "Propongo que cambiemos la fecha de entrega."
              - pattern: "Perdona que te interrumpa, pero tengo una duda."
              - pattern: "En resumen, quedamos en que Ana preparará el informe."
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: fill_blank }
              - { type: error_correct }
          - id: career-changes
            title: Career Changes
            description: Talk about changing jobs, studying again and plans for your professional future.
            vocabulary: ["cambiar de trabajo", "dejar el trabajo", ascender, "el ascenso", despedir, "montar un negocio", "el autónomo", "la jubilación"]
            grammar:
              - pattern: "Hace un año dejé mi trabajo y monté mi propio negocio."
              - pattern: "Me gustaría trabajar en algo que me guste de verdad."
              - pattern: "Si pudiera, estudiaría otra carrera."
            activities:
              - { type: learn }
              - { type: sentence_complete, count: 2 }
              - { type: translate }
              - type: dialogue
                scenario: career_change_chat
                goal: Talk with a friend about why you want to change careers and what you plan to do next.

      - id: habits-lifestyle
        title: Habits & Lifestyle
        description: Talk about habits you have changed, kept or started again, and give lifestyle advice.
        icon: 🧘
        steps:
          - id: dejar-seguir
            title: Dejar de & Seguir
            description: Say what you stopped doing with dejar de + infinitive and what you still do with seguir + gerundio.
            vocabulary: ["dejar de", seguir, continuar, fumar, "comer carne", "ya no", "todavía", "llevar + gerundio"]
            grammar:
              - pattern: "Dejé de fumar hace cinco años."
              - pattern: "Sigo viviendo en el mismo barrio."
              - pattern: "Llevo dos años estudiando español."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: translate }
          - id: acabar-volver
            title: Acabar de & Volver a
            description: Say what just happened with acabar de and what happens again with volver a.
            vocabulary: ["acabar de", "volver a", "empezar a", "ponerse a", "otra vez", "de nuevo", "hace un momento", "recién"]
            grammar:
              - pattern: "Acabo de llegar a casa."
              - pattern: "He vuelto a hacer deporte."
              - pattern: "Cuando llegó, se puso a llorar."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: listen_type }
          - id: healthy-living
            title: Healthy Living
            description: Talk about diet, exercise, sleep and stress.
            vocabulary: ["la dieta equilibrada", "hacer ejercicio", "el estrés", "dormir bien", "la comida basura", "el sedentarismo", "estar en forma", "cuidarse"]
            grammar:
              - pattern: "Intento llevar una dieta equilibrada."
              - pattern: "Desde que hago yoga, tengo menos estrés."
              - pattern: "Cada vez como menos comida basura."
            activities:
              - { type: learn, count: 2 }
              - { type: image_select }
              - { type: word_bank, count: 2 }
              - { type: fill_blank }
          - id: es-importante-que
            title: Lifestyle Advice
            description: Give general advice with es importante que, es mejor que and es necesario que + subjunctive.
            vocabulary: ["es importante que", "es mejor que", "es necesario que", "es bueno que", "hace falta que", "es fundamental", "conviene", "el hábito"]
            grammar:
              - pattern: "Es importante que duermas al menos siete horas."
              - pattern: "Es mejor que no tomes café por la noche."
              - pattern: "Es bueno hacer ejercicio todos los días."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: error_correct }
              - type: dialogue
                scenario: healthy_habits_advice
                goal: Advise a stressed friend on how to sleep better and live a healthier life.

      - id: media-technology
        title: Media & Technology
        description: Talk about the news, social media and technology, and weigh up pros and cons.
        icon: 📱
        steps:
          - id: news-media
            title: News & Media
            description: Talk about the news and where you get information from.
            vocabulary: ["las noticias", "el periódico", "el titular", "el periodista", "la prensa", "el telediario", "estar informado", "según la prensa"]
            grammar:
              - pattern: "Suelo leer las noticias en el móvil."
              - pattern: "Según el periódico, los precios han subido."
              - pattern: "¿Te has enterado de lo que ha pasado?"
            activities:
              - { type: learn, count: 2 }
              - { type: match }
              - { type: listen_type, count: 2 }
              - { type: fill_blank }
          - id: social-media
            title: Social Media Habits
            description: Describe how you use social networks and how much time you spend online.
            vocabulary: ["las redes sociales", "el seguidor", publicar, compartir, "dar me gusta", "subir una foto", "la publicación", enganchado]
            grammar:
              - pattern: "Paso demasiado tiempo en las redes sociales."
              - pattern: "Nunca publico fotos de mis hijos."
              - pattern: "Mi hermana está enganchada al móvil."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: word_bank }
              - { type: translate }
          - id: technology
            title: Technology
            description: Talk about devices, apps and solving technical problems.
            vocabulary: ["el portátil", "la aplicación", "la contraseña", descargar, instalar, actualizar, "la batería", "no funciona"]
            grammar:
              - pattern: "Se me ha olvidado la contraseña."
              - pattern: "Se me ha acabado la batería."
              - pattern: "¿Sabes cómo se descarga esta aplicación?"
            activities:
              - { type: learn, count: 2 }
              - { type: image_select }
              - { type: fill_blank, count: 2 }
              - { type: error_correct }
          - id: pros-cons
            title: Pros & Cons
            description: Weigh up advantages and disadvantages with por un lado, por otro lado and en cambio.
            vocabulary: ["por un lado", "por otro lado", "en cambio", "la ventaja", "la desventaja", "a pesar de", "aunque", "en conclusión"]
            grammar:
              - pattern: "Por un lado, internet nos conecta; por otro lado, nos aísla."
              - pattern: "Aunque es útil, el móvil puede crear adicción."
              - pattern: "En conclusión, todo depende de cómo lo usemos."
            activities:
              - { type: learn }
              - { type: word_bank, count: 2 }
              - { type: sentence_complete }
              - type: dialogue
                scenario: technology_debate
                goal: Discuss the advantages and disadvantages of children using smartphones and reach a conclusion.

    checkpoint:
      title: B1 Checkpoint
      required_score: 80
      activities:
        - { type: word_select, count: 3 }
        - { type: fill_blank, count: 3 }
        - { type: error_correct, count: 2 }
        - { type: listen_select, count: 3 }
        - { type: translate, count: 3 }
        - { type: dialogue }

  B2:
    title: Upper Intermediate
    description: >
      Understand the main ideas of complex texts, interact with fluency and spontaneity, and argue a viewpoint on a wide range of topics, weighing advantages and disadvantages.

    units:
      - id: regrets
        title: Regrets & Hypotheticals
        description: Talk about unreal situations in the present and the past, and express regret.
        icon: 💭
        steps:
          - id: imperfecto-subjuntivo
            title: The Imperfect Subjunctive
            description: Form the imperfect subjunctive from the preterite, with -ra and -se endings.
            vocabulary: [fuera, tuviera, hiciera, dijera, pudiera, supiera, viniera, estuviera, "fuese", "tuviese"]
            grammar:
              - pattern: "Si tuviera más tiempo, aprendería a tocar el piano."
              - pattern: "Me gustaría que vinieras a la fiesta."
              - pattern: "Si yo fuese tú, no lo haría."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: sentence_complete }
              - { type: listen_type }
          - id: si-hubiera
            title: If I Had Known
            description: Use si hubiera + participle with habría + participle for unreal past conditions.
            vocabulary: ["hubiera sabido", "habría ido", "hubiera estudiado", "habría aprobado", "a tiempo", "la oportunidad", "perder el tren", "darse cuenta"]
            grammar:
              - pattern: "Si hubiera sabido la verdad, te lo habría dicho."
              - pattern: "Si hubiéramos salido antes, no habríamos perdido el tren."
              - pattern: "Si me hubieras avisado, habría ido contigo."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: error_correct }
              - { type: translate }
          - id: mixed-conditionals
            title: Mixed Conditionals
            description: Link a past condition to a present result and vice versa.
            vocabulary: ["ahora mismo", "hoy en día", "estar casado", "vivir en el extranjero", "la carrera", "elegir", "aceptar el trabajo", "ser diferente"]
            grammar:
              - pattern: "Si hubiera aceptado aquel trabajo, ahora viviría en Londres."
              - pattern: "Si no fuera tan tímido, le habría pedido su número."
              - pattern: "Si hubiera estudiado medicina, hoy sería médica."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: translate }
              - { type: listen_type }
          - id: ojala-hubiera
            title: Expressing Regret
            description: Express regret with ojalá hubiera, arrepentirse de and lamentar.
            vocabulary: ["arrepentirse de", "lamentar", "ojalá", "el error", "la culpa", "echar de menos", "pedir perdón", "hacer caso"]
            grammar:
              - pattern: "Ojalá hubiera estudiado más para el examen."
              - pattern: "Me arrepiento de no haberle hecho caso."
              - pattern: "Lamento que no hayas podido venir."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: error_correct }
              - { type: speak }
              - type: dialogue
                scenario: talking_about_regrets
                goal: Tell a friend about a decision you regret and say what you would have done differently.

      - id: deduction
        title: Deduction & Speculation
        description: Make guesses and deductions about the present and the past.
        icon: 🔍
        steps:
          - id: futuro-probabilidad
            title: Guessing About the Present
            description: Use the future tense to express probability in the present.
            vocabulary: ["estará", "tendrá", "habrá", "serán", "el atasco", "el retraso", "suponer", "seguramente"]
            grammar:
              - pattern: "No contesta; estará en el metro."
              - pattern: "¿Cuántos años tendrá su hermano?"
              - pattern: "Habrá unas cincuenta personas en la sala."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: listen_type }
          - id: condicional-probabilidad
            title: Guessing About the Past
            description: Use the conditional and the future perfect to speculate about past events.
            vocabulary: ["serían", "estaría", "habría salido", "se habrá olvidado", "aquella noche", "a esas horas", "imaginar", "probablemente"]
            grammar:
              - pattern: "Cuando llegó serían las diez de la noche."
              - pattern: "No vino a la reunión; se le habrá olvidado."
              - pattern: "Estaría muy cansado, porque se durmió enseguida."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: sentence_complete }
              - { type: error_correct }
              - { type: translate }
          - id: quizas-tal-vez
            title: Maybe and Perhaps
            description: Use quizás, tal vez and a lo mejor with the indicative or the subjunctive.
            vocabulary: [quizás, "tal vez", "a lo mejor", "puede que", "es posible que", "lo más probable es que", "igual", "no creo que"]
            grammar:
              - pattern: "Quizás llegue tarde, porque hay mucho tráfico."
              - pattern: "A lo mejor está enfermo."
              - pattern: "Puede que no haya entendido la pregunta."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: error_correct }
              - { type: word_bank }
              - { type: listen_type }
          - id: mystery
            title: Solving a Mystery
            description: Combine deduction structures to discuss what might have happened.
            vocabulary: ["la pista", "el sospechoso", "la coartada", "desaparecer", "deber de", "no cabe duda de que", "estar seguro de que", "la explicación"]
            grammar:
              - pattern: "Debe de haber salido por la ventana."
              - pattern: "No cabe duda de que alguien entró anoche."
              - pattern: "No creo que fuera el vecino."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: sentence_complete }
              - type: dialogue
                scenario: discussing_a_mystery
                goal: Speculate with a friend about what happened and agree on the most likely explanation.

      - id: passive-impersonal
        title: Passive & Impersonal
        description: Shift the focus from who does something to what is done.
        icon: 📰
        steps:
          - id: pasiva-ser
            title: The Passive with Ser
            description: Form the passive with ser + participle agreeing with the subject.
            vocabulary: ["construir", "fundar", "descubrir", "elegir", "inaugurar", "detener", "por parte de", "el ayuntamiento"]
            grammar:
              - pattern: "El puente fue construido en el siglo XIX."
              - pattern: "Los ladrones fueron detenidos por la policía."
              - pattern: "La nueva alcaldesa ha sido elegida por mayoría."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct }
              - { type: translate }
              - { type: listen_type }
          - id: pasiva-refleja
            title: The Reflexive Passive
            description: Use se with a verb agreeing with the thing done, the most common passive in Spanish.
            vocabulary: ["se vende", "se alquila", "se buscan", "se necesita", "el piso", "el anuncio", "la oferta", "el producto"]
            grammar:
              - pattern: "Se venden pisos en el centro."
              - pattern: "Se alquila habitación con vistas al mar."
              - pattern: "En esta fábrica se producen mil coches al día."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: word_bank }
          - id: se-impersonal
            title: Impersonal Se
            description: Make general statements with impersonal se and the third person plural.
            vocabulary: ["se dice que", "se cree que", "se vive bien", "se puede", "no se permite", "dicen que", "la gente", "en general"]
            grammar:
              - pattern: "En este país se vive muy bien."
              - pattern: "Se dice que el restaurante va a cerrar."
              - pattern: "No se puede fumar en el interior."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: error_correct }
              - { type: translate }
              - { type: listen_type }
          - id: news-passives
            title: Passives in the News
            description: Understand and use passive and impersonal structures in news reports.
            vocabulary: ["el titular", "la noticia", "según fuentes oficiales", "la investigación", "anunciar", "informar", "aprobar una ley", "el gobierno"]
            grammar:
              - pattern: "La ley fue aprobada ayer por el Parlamento."
              - pattern: "Se ha abierto una investigación sobre el accidente."
              - pattern: "Según fuentes oficiales, se esperan más lluvias."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: multiple_choice }
              - { type: translate, count: 2 }
              - { type: listen_type }

      - id: time-future
        title: Time Clauses & the Future
        description: Talk about future events, deadlines and long-term changes.
        icon: ⏳
        steps:
          - id: cuando-subjuntivo
            title: When You Arrive
            description: Use cuando + present subjunctive for future events, and the indicative for habits.
            vocabulary: ["cuando", "llegar", "terminar", "jubilarse", "ser mayor", "tener tiempo", "mudarse", "independizarse"]
            grammar:
              - pattern: "Cuando llegues, llámame."
              - pattern: "Cuando sea mayor, quiero vivir en el campo."
              - pattern: "Cuando llego a casa, siempre me ducho."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: multiple_choice }
              - { type: error_correct }
              - { type: listen_type }
          - id: futuro-perfecto
            title: Will Have Done
            description: Use the future perfect for actions completed before a future point.
            vocabulary: ["habré terminado", "habrán llegado", "para entonces", "para el lunes", "dentro de diez años", "el plazo", "entregar", "conseguir"]
            grammar:
              - pattern: "Para el lunes habré terminado el informe."
              - pattern: "Dentro de diez años habremos pagado la hipoteca."
              - pattern: "Cuando llegues, ya se habrán ido todos."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: sentence_complete }
              - { type: translate }
          - id: antes-de-que
            title: Before, Until, As Soon As
            description: Use antes de que, hasta que and en cuanto with the subjunctive for future time.
            vocabulary: ["antes de que", "hasta que", "en cuanto", "tan pronto como", "después de que", "mientras", "esperar", "avisar"]
            grammar:
              - pattern: "Tenemos que salir antes de que empiece a llover."
              - pattern: "No me iré hasta que me lo expliques."
              - pattern: "En cuanto sepa algo, te aviso."
            activities:
              - { type: learn, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: word_bank }
              - { type: listen_type }
          - id: long-term-predictions
            title: Predicting Long-Term Changes
            description: Make predictions about how life will have changed in the future.
            vocabulary: ["el futuro", "la tecnología", "la inteligencia artificial", "desaparecer", "sustituir", "cambiar", "es probable que", "dudo que"]
            grammar:
              - pattern: "Dentro de treinta años habrán desaparecido muchos trabajos."
              - pattern: "Es probable que los coches se conduzcan solos."
              - pattern: "Dudo que la gente deje de leer libros."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: sentence_complete }
              - type: dialogue
                scenario: predicting_the_future
                goal: Discuss how work and daily life will have changed in thirty years and justify your predictions.

      - id: linking-ideas
        title: Linking Ideas
        description: Connect ideas to express contrast, concession, cause and result.
        icon: 🔗
        steps:
          - id: aunque
            title: Although and Even If
            description: Use aunque with the indicative for facts and the subjunctive for possibilities.
            vocabulary: ["aunque", "aun así", "sin embargo", "llover", "estar cansado", "costar", "merecer la pena", "de todas formas"]
            grammar:
              - pattern: "Aunque llueve, vamos a salir."
              - pattern: "Aunque llueva mañana, iremos a la playa."
              - pattern: "Aunque me lo pidas, no lo haré."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: fill_blank }
              - { type: error_correct }
              - { type: listen_type }
          - id: a-pesar-de
            title: Despite
            description: Use a pesar de with a noun or infinitive and a pesar de que with a clause.
            vocabulary: ["a pesar de", "a pesar de que", "pese a", "las dificultades", "el esfuerzo", "la crisis", "seguir adelante", "lograr"]
            grammar:
              - pattern: "A pesar de la lluvia, el concierto se celebró."
              - pattern: "A pesar de que estaba enfermo, fue a trabajar."
              - pattern: "Pese a tener poco dinero, viajaron por toda Europa."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: word_bank }
              - { type: translate }
          - id: cause-result
            title: Cause and Result
            description: Link causes and results with debido a, ya que, por lo tanto and así que.
            vocabulary: ["debido a", "ya que", "puesto que", "como", "por lo tanto", "así que", "por eso", "de modo que"]
            grammar:
              - pattern: "El vuelo se canceló debido a la niebla."
              - pattern: "Como no tenía llaves, tuve que esperar fuera."
              - pattern: "No ha estudiado, así que no aprobará."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: multiple_choice }
              - { type: error_correct }
              - { type: listen_type }
          - id: structuring-argument
            title: Structuring an Argument
            description: Organise an argument with connectors for ordering, adding and concluding.
            vocabulary: ["en primer lugar", "por un lado", "por otro lado", "además", "es más", "en cambio", "en resumen", "en conclusión"]
            grammar:
              - pattern: "Por un lado, es barato; por otro lado, es poco práctico."
              - pattern: "Además, hay que tener en cuenta el impacto ambiental."
              - pattern: "En conclusión, creo que las ventajas superan a los inconvenientes."
            activities:
              - { type: learn }
              - { type: word_bank, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: translate }
              - { type: speak }

      - id: purpose-conditions
        title: Purpose & Conditions
        description: Express purpose and set conditions with the subjunctive.
        icon: 🤝
        steps:
          - id: para-que
            title: So That
            description: Use para + infinitive with the same subject and para que + subjunctive with a different one.
            vocabulary: ["para que", "a fin de que", "con el objetivo de", "explicar", "entender", "ayudar", "ahorrar", "enterarse"]
            grammar:
              - pattern: "Te lo explico para que lo entiendas."
              - pattern: "Ahorramos para comprar una casa."
              - pattern: "Hablé despacio para que todos me entendieran."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct }
              - { type: translate }
              - { type: listen_type }
          - id: con-tal-de-que
            title: Provided That and Unless
            description: Set conditions with con tal de que, a menos que, siempre que and a no ser que.
            vocabulary: ["con tal de que", "siempre que", "a menos que", "a no ser que", "salvo que", "prestar", "devolver", "prometer"]
            grammar:
              - pattern: "Te presto el coche con tal de que me lo devuelvas mañana."
              - pattern: "Iremos a pie a menos que llueva."
              - pattern: "Puedes quedarte siempre que no hagas ruido."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: sentence_complete }
              - { type: listen_type }
          - id: en-caso-de-que
            title: In Case
            description: Talk about precautions with en caso de que + subjunctive and por si + indicative.
            vocabulary: ["en caso de que", "por si", "por si acaso", "la emergencia", "el paraguas", "llevar", "olvidarse", "el seguro"]
            grammar:
              - pattern: "En caso de que haya un incendio, utilice la escalera."
              - pattern: "Llévate el paraguas por si llueve."
              - pattern: "Te dejo mi número por si acaso."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct }
              - { type: word_bank }
          - id: negotiating-conditions
            title: Negotiating Conditions
            description: Negotiate an agreement by setting and accepting conditions.
            vocabulary: ["el acuerdo", "la condición", "el plazo de entrega", "el descuento", "estar dispuesto a", "aceptar", "rechazar", "a cambio de"]
            grammar:
              - pattern: "Le haremos un descuento siempre que pague por adelantado."
              - pattern: "Estamos dispuestos a aceptar, con tal de que cumplan el plazo."
              - pattern: "No firmaremos a menos que cambien esta cláusula."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: sentence_complete }
              - type: dialogue
                scenario: negotiating_a_deal
                goal: Negotiate the price and delivery terms of an order, setting at least two conditions.

      - id: reported-speech-b2
        title: Advanced Reported Speech
        description: Report what others said, asked, suggested and ordered.
        icon: 🗣️
        steps:
          - id: reporting-verbs
            title: Reporting Verbs
            description: Use sugerir, pedir, recomendar and aconsejar followed by que + subjunctive.
            vocabulary: [sugerir, pedir, recomendar, aconsejar, exigir, "insistir en", prohibir, proponer]
            grammar:
              - pattern: "El médico me recomienda que haga más ejercicio."
              - pattern: "Mi jefa insiste en que lleguemos a la hora."
              - pattern: "Te sugiero que lo pienses bien."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: multiple_choice }
              - { type: listen_type }
          - id: backshift-subjuntivo
            title: Reporting in the Past
            description: Shift the present subjunctive into the imperfect subjunctive after a past reporting verb.
            vocabulary: ["me pidió que", "me dijo que", "nos aconsejó que", "le sugerí que", "viniera", "llamara", "trajera", "esperara"]
            grammar:
              - pattern: "Me pidió que viniera a las ocho."
              - pattern: "Nos aconsejaron que no saliéramos de noche."
              - pattern: "Le dije que me llamara cuando llegara."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct }
              - { type: translate }
              - { type: listen_type }
          - id: reporting-questions-orders
            title: Reporting Questions and Orders
            description: Report questions with si and question words, and orders with que + subjunctive.
            vocabulary: ["preguntar si", "preguntar dónde", "querer saber", "ordenar", "mandar", "contestar", "el día anterior", "aquel día"]
            grammar:
              - pattern: "Me preguntó si había estado alguna vez en México."
              - pattern: "Quería saber dónde había dejado las llaves."
              - pattern: "El profesor nos mandó que apagáramos los móviles."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: word_bank }
              - { type: error_correct }
          - id: retelling-conversation
            title: Retelling a Conversation
            description: Retell a conversation accurately, adjusting tenses, pronouns and time words.
            vocabulary: ["comentar", "explicar", "contar", "añadir", "advertir", "quejarse de", "al día siguiente", "esa misma tarde"]
            grammar:
              - pattern: "Me contó que se iba a mudar al día siguiente."
              - pattern: "Me advirtió que no confiara en él."
              - pattern: "Se quejó de que nadie la hubiera ayudado."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: translate }
              - type: dialogue
                scenario: retelling_a_conversation
                goal: Tell a friend what your manager said, asked and asked you to do in a meeting.

      - id: debate
        title: Debate & Persuasion
        description: Give opinions carefully, concede points and persuade others.
        icon: ⚖️
        steps:
          - id: hedging
            title: Hedging
            description: Soften opinions with expressions like me da la impresión de que and por lo visto.
            vocabulary: ["me da la impresión de que", "por lo visto", "al parecer", "tengo entendido que", "da la sensación de que", "en cierto modo", "hasta cierto punto", "no estoy del todo seguro"]
            grammar:
              - pattern: "Me da la impresión de que no le interesa el proyecto."
              - pattern: "Por lo visto, van a subir los precios."
              - pattern: "Hasta cierto punto, tienes razón."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: sentence_complete }
              - { type: listen_type }
          - id: conceding
            title: Conceding a Point
            description: Admit part of an argument before disagreeing, with es verdad que … pero and the subjunctive.
            vocabulary: ["es verdad que", "es cierto que", "no digo que", "reconozco que", "admito que", "de acuerdo, pero", "no niego que", "aun así"]
            grammar:
              - pattern: "Es verdad que es caro, pero la calidad es excelente."
              - pattern: "No digo que sea mala idea, pero es arriesgada."
              - pattern: "No niego que tenga sus ventajas."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct }
              - { type: word_bank }
          - id: persuasive-language
            title: Persuasive Language
            description: Persuade with impersonal expressions such as es fundamental que + subjunctive.
            vocabulary: ["es fundamental que", "es imprescindible que", "es necesario que", "hace falta que", "convencer", "está claro que", "sin duda", "no hay que olvidar que"]
            grammar:
              - pattern: "Es fundamental que todos participemos en la decisión."
              - pattern: "Está claro que necesitamos un cambio."
              - pattern: "No hay que olvidar que el tiempo es limitado."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: multiple_choice }
              - { type: translate }
              - { type: speak }
          - id: having-debate
            title: Having a Debate
            description: Take part in a debate, interrupt politely and defend your position.
            vocabulary: ["el debate", "el argumento", "la postura", "perdona que te interrumpa", "déjame terminar", "en mi opinión", "estar en contra de", "estar a favor de"]
            grammar:
              - pattern: "Perdona que te interrumpa, pero no estoy de acuerdo."
              - pattern: "Déjame terminar, por favor."
              - pattern: "Estoy a favor de que se reduzca la jornada laboral."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: sentence_complete }
              - type: dialogue
                scenario: debating_a_proposal
                goal: Argue for or against a four-day working week, conceding at least one point to the other side.

      - id: society-environment
        title: Society & the Environment
        description: Discuss environmental and social problems and propose solutions.
        icon: 🌍
        steps:
          - id: environmental-issues
            title: Environmental Issues
            description: Talk about climate change, pollution and the loss of natural resources.
            vocabulary: ["el cambio climático", "la contaminación", "el calentamiento global", "la sequía", "los residuos", "las energías renovables", "la deforestación", "el medio ambiente"]
            grammar:
              - pattern: "La contaminación del aire está empeorando en las ciudades."
              - pattern: "Cada vez hay más sequías en el sur del país."
              - pattern: "Me preocupa que se talen tantos bosques."
            activities:
              - { type: learn, count: 2 }
              - { type: match }
              - { type: fill_blank, count: 2 }
              - { type: listen_type }
          - id: social-issues
            title: Social Issues
            description: Discuss inequality, unemployment, housing and other social problems.
            vocabulary: ["la desigualdad", "el paro", "la pobreza", "la vivienda", "el alquiler", "la inmigración", "la discriminación", "la sanidad pública"]
            grammar:
              - pattern: "El precio de la vivienda ha subido muchísimo en los últimos años."
              - pattern: "Es injusto que tanta gente no pueda pagar el alquiler."
              - pattern: "La tasa de paro juvenil sigue siendo muy alta."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: error_correct }
              - { type: translate }
          - id: possible-solutions
            title: Possible Solutions
            description: Propose solutions with habría que, se debería and convendría + infinitive.
            vocabulary: ["habría que", "se debería", "convendría", "invertir en", "fomentar", "reducir", "reciclar", "las medidas"]
            grammar:
              - pattern: "Habría que invertir más en transporte público."
              - pattern: "Se debería fomentar el uso de la bicicleta."
              - pattern: "Convendría que el gobierno tomara medidas urgentes."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: fill_blank }
              - { type: word_bank }
              - { type: listen_type }
          - id: global-issue
            title: Discussing a Global Issue
            description: Discuss the causes, effects and solutions of a global problem.
            vocabulary: ["la causa", "la consecuencia", "a nivel mundial", "la responsabilidad", "concienciar", "la sociedad", "los recursos", "tomar conciencia"]
            grammar:
              - pattern: "Una de las principales causas es el consumo excesivo."
              - pattern: "Si no actuamos ya, las consecuencias serán graves."
              - pattern: "Es hora de que tomemos conciencia del problema."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: translate }
              - type: dialogue
                scenario: discussing_a_global_issue
                goal: Discuss the causes of a global problem and agree on two realistic solutions.

      - id: science-culture
        title: Science, Culture & the Arts
        description: Describe trends, explain causes and talk about discoveries, art and culture.
        icon: 🔬
        steps:
          - id: describing-trends
            title: Describing Trends
            description: Describe how things are changing with cada vez más, seguir + gerund and ir + gerund.
            vocabulary: ["cada vez más", "cada vez menos", "aumentar", "disminuir", "la tendencia", "el porcentaje", "seguir creciendo", "ir mejorando"]
            grammar:
              - pattern: "Cada vez más gente trabaja desde casa."
              - pattern: "El número de lectores sigue disminuyendo."
              - pattern: "La situación va mejorando poco a poco."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: multiple_choice }
              - { type: listen_type }
          - id: cause-effect
            title: Cause and Effect
            description: Explain causes and effects with provocar, dar lugar a and deberse a.
            vocabulary: ["provocar", "causar", "dar lugar a", "deberse a", "tener como consecuencia", "influir en", "el efecto", "el factor"]
            grammar:
              - pattern: "El aumento de las temperaturas se debe a la actividad humana."
              - pattern: "La nueva ley dio lugar a muchas protestas."
              - pattern: "Las redes sociales influyen en nuestra forma de pensar."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: error_correct }
              - { type: translate }
          - id: scientific-discoveries
            title: Scientific Discoveries
            description: Talk about research and discoveries, using passive and impersonal structures.
            vocabulary: ["el descubrimiento", "la investigación", "el investigador", "el experimento", "la vacuna", "demostrar", "llevar a cabo", "el avance"]
            grammar:
              - pattern: "La penicilina fue descubierta por casualidad."
              - pattern: "Se ha demostrado que dormir poco afecta a la memoria."
              - pattern: "Los investigadores llevaron a cabo un experimento con mil personas."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: word_bank }
              - { type: listen_type }
          - id: art-culture
            title: Talking About Art and Culture
            description: Give and justify opinions about films, books, exhibitions and music.
            vocabulary: ["la obra", "la exposición", "el cuadro", "el argumento", "el director", "emocionante", "conmovedor", "me dejó indiferente"]
            grammar:
              - pattern: "Lo que más me gustó fue la banda sonora."
              - pattern: "La novela está basada en hechos reales."
              - pattern: "Me sorprendió que el final fuera tan triste."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: sentence_complete }
              - type: dialogue
                scenario: discussing_art_and_culture
                goal: Recommend a film, book or exhibition to a friend and explain what you liked about it.

    checkpoint:
      title: B2 Checkpoint
      required_score: 80
      activities:
        - { type: word_select, count: 3 }
        - { type: fill_blank, count: 3 }
