        - { type: dialogue }

  C1:
    title: Advanced
    description: >
      Understand demanding, longer texts and recognise implicit meaning, express yourself fluently and spontaneously, and use Spanish flexibly and effectively for social, academic and professional purposes.

    units:
      - id: subjunctive-mastery
        title: Subjunctive Mastery
        description: Use the subjunctive with confidence in complex and nuanced sentences.
        icon: 🎯
        steps:
          - id: relative-subjunctive
            title: Relative Clauses
            description: Use the subjunctive for unknown or non-existent antecedents.
            vocabulary: ["buscar a alguien que", "no hay nadie que", "cualquiera que", "lo que sea", "dondequiera que", "quienquiera que", "el antecedente", "un sitio donde"]
            grammar:
              - pattern: "Busco a alguien que sepa programar en Python."
              - pattern: "No hay nadie que entienda este informe."
              - pattern: "Haz lo que quieras, pero hazlo bien."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: translate }
          - id: el-hecho-de-que
            title: El hecho de que
            description: Use the subjunctive after el hecho de que and similar noun clauses.
            vocabulary: ["el hecho de que", "que + subjuntivo", "me parece lógico que", "es comprensible que", "no es que", "me extraña que", "me sorprende que", "es natural que"]
            grammar:
              - pattern: "El hecho de que no haya llamado me preocupa."
              - pattern: "Que lo digas tú no significa que sea verdad."
              - pattern: "No es que no quiera, es que no puedo."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: translate }
          - id: como-si
            title: Como si
            description: Talk about unreal comparisons with como si and the imperfect or pluperfect subjunctive.
            vocabulary: ["como si", "ni que", "fingir", "hacer como que", "aparentar", "de repente", "tal cual", "a sabiendas"]
            grammar:
              - pattern: "Habla como si lo supiera todo."
              - pattern: "Me miró como si hubiera visto un fantasma."
              - pattern: "¡Ni que fuera tan difícil!"
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct }
              - { type: listen_type }
          - id: por-mucho-que
            title: Por mucho que
            description: Express concession with por mucho que, por más que and aunque.
            vocabulary: ["por mucho que", "por más que", "por muy … que", aunque, "aun cuando", "así", "ni aunque", "de todos modos"]
            grammar:
              - pattern: "Por mucho que insistas, no voy a cambiar de opinión."
              - pattern: "Por muy cansado que estés, tienes que terminarlo."
              - pattern: "No lo haría ni aunque me pagaran el doble."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: word_bank, count: 2 }
              - type: dialogue
                scenario: persuading_a_stubborn_friend
                goal: Hold your position politely while acknowledging every argument your friend puts forward.

      - id: emphasis-word-order
        title: Emphasis & Word Order
        description: Highlight information through structure, word order and lo.
        icon: 🔦
        steps:
          - id: cleft-sentences
            title: Cleft Sentences
            description: Focus on key information with ser + lo que, quien and donde.
            vocabulary: ["lo que más me molesta", "fue él quien", "es aquí donde", "fue entonces cuando", "es por eso por lo que", "lo que pasa es que", "lo único que", "así es como"]
            grammar:
              - pattern: "Lo que más me molesta es su falta de puntualidad."
              - pattern: "Fue ella quien lo descubrió."
              - pattern: "Fue entonces cuando me di cuenta del error."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: translate }
          - id: clitic-doubling
            title: Topic First
            description: Put the topic first and repeat it with an object pronoun.
            vocabulary: ["el libro", "la película", "a mi hermana", "eso", "ya lo he leído", "no la he visto", "se lo dije", "a mí"]
            grammar:
              - pattern: "El libro ya lo he leído."
              - pattern: "A mi hermana no la veo desde hace meses."
              - pattern: "Eso ya te lo había dicho yo."
            activities:
              - { type: learn, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: listen_type }
          - id: neuter-lo
            title: Neuter Lo
            description: Use lo + adjective and lo + adjective/adverb + que for emphasis.
            vocabulary: ["lo difícil", "lo bueno", "lo malo", "lo mejor", "lo bonito que es", "lo bien que", "lo mucho que", "a lo grande"]
            grammar:
              - pattern: "Lo difícil es empezar."
              - pattern: "No sabes lo bonito que es el pueblo."
              - pattern: "Me sorprendió lo bien que habla español."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: translate }
          - id: making-a-point
            title: Making a Point
            description: Stress what matters with emphatic expressions.
            vocabulary: ["sí que", "bien que", "ni siquiera", "precisamente", "justamente", "lo que es", "de verdad", "ni mucho menos"]
            grammar:
              - pattern: "Sí que lo sabía, pero no dijo nada."
              - pattern: "No es, ni mucho menos, la mejor solución."
              - pattern: "Precisamente por eso te lo cuento."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: error_correct }
              - type: dialogue
                scenario: team_meeting_priorities
                goal: Make clear which issue matters most and why the team should tackle it first.

      - id: advanced-structures
        title: Advanced Structures
        description: Use periphrases, non-finite clauses, nominalisation and ellipsis.
        icon: 🏗️
        steps:
          - id: verbal-periphrases
            title: Verbal Periphrases
            description: Express duration, progression and approximation with periphrases.
            vocabulary: ["llevar + gerundio", "ir + gerundio", "venir a + infinitivo", "andar + gerundio", "acabar + gerundio", "seguir sin", "estar por", "dejar de"]
            grammar:
              - pattern: "Llevo tres años viviendo en Sevilla."
              - pattern: "Poco a poco vamos entendiendo el problema."
              - pattern: "Viene a costar unos doscientos euros."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: translate }
          - id: participle-gerund-clauses
            title: Participle & Gerund Clauses
            description: Condense ideas with absolute participles and gerund clauses.
            vocabulary: ["una vez terminado", "habiendo dicho esto", "dicho esto", "acabada la reunión", "teniendo en cuenta", "visto lo visto", "hecho el trabajo", "considerando que"]
            grammar:
              - pattern: "Una vez terminado el informe, lo enviaremos."
              - pattern: "Habiendo dicho esto, pasemos al siguiente punto."
              - pattern: "Acabada la reunión, todos se fueron a casa."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: error_correct }
              - { type: translate }
          - id: nominalisation
            title: Nominalisation
            description: Turn verbs and adjectives into nouns for a denser, formal style.
            vocabulary: ["la llegada", "la aprobación", "el aumento", "la disminución", "la puesta en marcha", "la toma de decisiones", "el cumplimiento", "la falta de"]
            grammar:
              - pattern: "La aprobación de la ley se retrasó un mes."
              - pattern: "El aumento de los precios preocupa a los consumidores."
              - pattern: "La puesta en marcha del proyecto está prevista para enero."
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: listen_type }
          - id: ellipsis-substitution
            title: Ellipsis & Substitution
            description: Avoid repetition with lo, el de, el que and ellipsis.
            vocabulary: ["el de", "la que", "los de", "lo es", "también", "tampoco", "sí", "el mío"]
            grammar:
              - pattern: "Me gusta más el coche de Ana que el de Luis."
              - pattern: "Parece fácil, pero no lo es."
              - pattern: "Yo no he ido, pero mi hermano sí."
            activities:
              - { type: learn, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: translate }

      - id: hedging-discourse
        title: Hedging & Discourse
        description: Link ideas smoothly, soften claims and manage a discussion.
        icon: 🧭
        steps:
          - id: discourse-markers
            title: Discourse Markers
            description: Contrast, reinforce and reformulate with discourse markers.
            vocabulary: ["no obstante", "en cambio", "de hecho", "es decir", "o sea", "por consiguiente", "en cualquier caso", "dicho de otro modo", "sin embargo"]
            grammar:
              - pattern: "El plan es ambicioso; no obstante, es viable."
              - pattern: "Ella prefiere el campo; yo, en cambio, la ciudad."
              - pattern: "De hecho, los datos indican lo contrario."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: translate }
          - id: softening-claims
            title: Softening Claims
            description: Hedge statements with the conditional and impersonal phrases.
            vocabulary: ["cabría pensar", "parece ser que", "al parecer", "según parece", "podría decirse", "en cierta medida", "hasta cierto punto", "tiende a"]
            grammar:
              - pattern: "Cabría pensar que la medida ha fracasado."
              - pattern: "Parece ser que el acuerdo se firmará pronto."
              - pattern: "Hasta cierto punto, tienes razón."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: error_correct }
              - { type: listen_type }
          - id: concession
            title: Concession
            description: Admit a point while keeping your argument with si bien and aun así.
            vocabulary: ["si bien", "aun así", "por mucho que", "a pesar de que", "pese a", "con todo", "aunque", "de todas formas"]
            grammar:
              - pattern: "Si bien es cierto que hay riesgos, las ventajas son mayores."
              - pattern: "Es caro; aun así, merece la pena."
              - pattern: "Pese a las críticas, el proyecto siguió adelante."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: translate }
          - id: steering-discussion
            title: Steering a Discussion
            description: Take the floor, redirect and sum up in a discussion.
            vocabulary: ["si me permites", "volviendo a", "en resumidas cuentas", "a lo que iba", "por cierto", "en relación con", "retomando", "para concluir"]
            grammar:
              - pattern: "Si me permites, quisiera añadir algo."
              - pattern: "Volviendo a lo que decías antes, no estoy de acuerdo."
              - pattern: "En resumidas cuentas, necesitamos más tiempo."
            activities:
              - { type: learn }
              - { type: sentence_complete, count: 2 }
              - { type: multiple_choice }
              - type: dialogue
                scenario: chairing_a_panel_discussion
                goal: Keep the discussion on track, bring speakers back to the topic and summarise the main points.

      - id: professional-life
        title: Professional Life
        description: Negotiate, lead and write formally at work.
        icon: 💼
        steps:
          - id: negotiating-terms
            title: Negotiating Terms
            description: Make offers, set conditions and reach agreements.
            vocabulary: ["la propuesta", "la contraoferta", "el margen", "las condiciones", "llegar a un acuerdo", "ceder", "siempre y cuando", "a cambio de", "el plazo de entrega"]
            grammar:
              - pattern: "Aceptaríamos siempre y cuando se reduzca el plazo."
              - pattern: "Estamos dispuestos a ceder en el precio a cambio de exclusividad."
              - pattern: "En caso de que no lleguemos a un acuerdo, buscaremos otro proveedor."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: translate, count: 2 }
              - { type: listen_type }
          - id: managing-leading
            title: Managing & Leading
            description: Delegate, motivate and give feedback.
            vocabulary: ["delegar", "la plantilla", "el rendimiento", "motivar", "rendir cuentas", "asumir responsabilidades", "la retroalimentación", "el liderazgo"]
            grammar:
              - pattern: "Te pediría que te encargaras de la presentación."
              - pattern: "Convendría que revisáramos los objetivos del trimestre."
              - pattern: "Cada uno debe rendir cuentas de su trabajo."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: translate }
          - id: reports-proposals
            title: Reports & Proposals
            description: Write formal reports and proposals in an appropriate register.
            vocabulary: ["el informe", "cabe destacar", "a continuación", "se adjunta", "en lo que respecta a", "con el fin de", "se recomienda", "por la presente"]
            grammar:
              - pattern: "Cabe destacar que las ventas han aumentado un 12 %."
              - pattern: "Se recomienda revisar el presupuesto con el fin de reducir costes."
              - pattern: "En lo que respecta a la logística, no se prevén cambios."
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: fill_blank }
          - id: workplace-conflict
            title: Workplace Conflict
            description: Address tension diplomatically and find solutions.
            vocabulary: ["el malentendido", "la tensión", "plantear un problema", "ponerse en el lugar de", "limar asperezas", "echar la culpa", "dar su brazo a torcer", "llegar a un término medio"]
            grammar:
              - pattern: "Entiendo tu postura, pero me gustaría que me escucharas."
              - pattern: "No se trata de echar la culpa a nadie."
              - pattern: "Quizá podamos llegar a un término medio."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: sentence_complete }
              - type: dialogue
                scenario: resolving_a_team_conflict
                goal: Discuss a disagreement with a colleague calmly and agree on a compromise.

      - id: media-information
        title: Media & Information
        description: Read the news critically and talk about information online.
        icon: 📰
        steps:
          - id: headline-language
            title: Headline Language
            description: Understand the condensed style and typical verbs of headlines.
            vocabulary: ["el titular", "la portada", "anunciar", "desmentir", "advertir", "reclamar", "dimitir", "el comunicado"]
            grammar:
              - pattern: "El Gobierno desmiente los rumores de dimisión."
              - pattern: "Detenido un hombre por el robo de un cuadro."
              - pattern: "La ministra habría ocultado información, según fuentes cercanas."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: listen_type, count: 2 }
              - { type: translate }
          - id: bias-spin
            title: Bias & Spin
            description: Spot bias, loaded language and the rumour conditional.
            vocabulary: ["el sesgo", "tendencioso", "manipular", "sacar de contexto", "el sensacionalismo", "la línea editorial", "imparcial", "la desinformación"]
            grammar:
              - pattern: "El artículo saca de contexto las palabras del alcalde."
              - pattern: "Según el diario, el acusado habría huido al extranjero."
              - pattern: "Es un medio bastante tendencioso."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct }
              - { type: translate }
          - id: social-media-privacy
            title: Social Media & Privacy
            description: Discuss online life, data and privacy.
            vocabulary: ["las redes sociales", "la privacidad", "los datos personales", "hacerse viral", "el algoritmo", "el ciberacoso", "la huella digital", "compartir"]
            grammar:
              - pattern: "Ojalá la gente pensara más antes de compartir algo."
              - pattern: "Las plataformas deberían garantizar que nuestros datos estén protegidos."
              - pattern: "El vídeo se hizo viral en cuestión de horas."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: listen_type }
          - id: assessing-sources
            title: Assessing Sources
            description: Judge how reliable information is and express doubt.
            vocabulary: ["la fuente", "fiable", "contrastar", "verificar", "el bulo", "de primera mano", "dudo que", "no está claro que"]
            grammar:
              - pattern: "Dudo que esa noticia sea cierta."
              - pattern: "Habría que contrastar la información con otras fuentes."
              - pattern: "No está claro que los datos procedan de un estudio serio."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: error_correct }
              - type: dialogue
                scenario: debunking_a_viral_story
                goal: Question a friend's viral story and explain how to check whether it is true.

      - id: science-tech-ethics
        title: Science, Technology & Ethics
        description: Discuss research, technology and the ethical questions they raise.
        icon: 🔬
        steps:
          - id: research-methods
            title: Research & Methods
            description: Describe studies, methods and findings.
            vocabulary: ["la hipótesis", "la muestra", "el ensayo", "los resultados", "llevar a cabo", "demostrar", "el hallazgo", "la metodología"]
            grammar:
              - pattern: "El estudio se llevó a cabo con una muestra de 500 personas."
              - pattern: "Los resultados parecen confirmar la hipótesis."
              - pattern: "Se ha demostrado que el fármaco es eficaz."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: translate }
          - id: ai-automation
            title: AI & Automation
            description: Talk about artificial intelligence and its impact on work.
            vocabulary: ["la inteligencia artificial", "la automatización", "el puesto de trabajo", "sustituir", "el aprendizaje automático", "los datos", "la herramienta", "a largo plazo"]
            grammar:
              - pattern: "Es probable que la automatización sustituya muchos empleos."
              - pattern: "A no ser que nos adaptemos, nos quedaremos atrás."
              - pattern: "La inteligencia artificial está transformando la manera en que trabajamos."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: listen_type }
          - id: ethical-dilemmas
            title: Ethical Dilemmas
            description: Weigh hypotheses with mixed conditionals.
            vocabulary: ["el dilema", "la ética", "lícito", "justificar", "los límites", "la responsabilidad", "a costa de", "el bien común"]
            grammar:
              - pattern: "Si hubieran regulado antes, ahora no tendríamos este problema."
              - pattern: "¿Es lícito avanzar a costa de la privacidad?"
              - pattern: "Nada justifica que se pongan vidas en peligro."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: translate }
          - id: debating-innovation
            title: Debating Innovation
            description: Argue for and against new technologies.
            vocabulary: ["la innovación", "el avance", "los riesgos", "las ventajas", "a favor de", "en contra de", "el progreso", "poner en duda"]
            grammar:
              - pattern: "No pongo en duda el avance, sino el precio que pagamos por él."
              - pattern: "Estoy a favor siempre que haya un control adecuado."
              - pattern: "Lo preocupante es que nadie sepa cómo funciona."
            activities:
              - { type: learn }
              - { type: sentence_complete, count: 2 }
              - { type: translate }
              - type: dialogue
                scenario: tech_ethics_debate
                goal: Argue for or against a new technology and respond to your partner's objections.

      - id: society-politics
        title: Society & Politics
        description: Discuss social issues, the environment and how societies are governed.
        icon: 🏛️
        steps:
          - id: social-inequality
            title: Social Inequality
            description: Talk about poverty, opportunity and inequality.
            vocabulary: ["la desigualdad", "la brecha", "la pobreza", "la exclusión social", "la igualdad de oportunidades", "los recursos", "agravar", "paliar"]
            grammar:
              - pattern: "La brecha salarial sigue siendo un problema grave."
              - pattern: "Es imprescindible que se palien los efectos de la crisis."
              - pattern: "Cuanto mayor es la desigualdad, menor es la cohesión social."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: translate }
          - id: climate-sustainability
            title: Climate & Sustainability
            description: Discuss climate change and sustainable solutions.
            vocabulary: ["el cambio climático", "las emisiones", "la sostenibilidad", "las energías renovables", "el calentamiento global", "frenar", "la huella de carbono", "a medio plazo"]
            grammar:
              - pattern: "De no reducir las emisiones, las consecuencias serán irreversibles."
              - pattern: "Urge que se tomen medidas a medio plazo."
              - pattern: "Las energías renovables van ganando terreno."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: listen_type }
          - id: politics-governance
            title: Politics & Governance
            description: Talk about elections, parties and government decisions.
            vocabulary: ["el Gobierno", "la oposición", "las elecciones", "el escaño", "la coalición", "aprobar una ley", "el electorado", "la legislatura"]
            grammar:
              - pattern: "La ley fue aprobada por mayoría absoluta."
              - pattern: "Se espera que el Gobierno anuncie nuevas medidas."
              - pattern: "Si se hubiera formado una coalición, la legislatura habría sido más estable."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct }
              - { type: translate }
          - id: community-action
            title: Community Action
            description: Organise and argue for local initiatives.
            vocabulary: ["el vecindario", "la asociación", "el voluntariado", "movilizarse", "recoger firmas", "reivindicar", "la iniciativa", "implicarse"]
            grammar:
              - pattern: "Hace falta que más vecinos se impliquen."
              - pattern: "Hemos recogido más de mil firmas para salvar el parque."
              - pattern: "Si nos movilizamos, conseguiremos que nos escuchen."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: sentence_complete }
              - type: dialogue
                scenario: neighbourhood_meeting
                goal: Convince your neighbours to support a local initiative and agree on the next steps.

      - id: idioms-colloquial
        title: Idioms & Colloquial Spanish
        description: Sound natural with collocations, idioms and verbs of change.
        icon: 🗣️
        steps:
          - id: strong-collocations
            title: Strong Collocations
            description: Use natural word combinations native speakers rely on.
            vocabulary: ["tomar una decisión", "dar un paseo", "prestar atención", "hacer caso", "correr un riesgo", "echar de menos", "poner en marcha", "sacar provecho"]
            grammar:
              - pattern: "No le hagas caso, siempre exagera."
              - pattern: "No quiero correr ningún riesgo innecesario."
              - pattern: "Hay que sacar provecho de esta oportunidad."
            activities:
              - { type: learn, count: 2 }
              - { type: match }
              - { type: fill_blank, count: 2 }
              - { type: error_correct }
          - id: idioms
            title: Idioms
            description: Understand and use common Spanish idioms.
            vocabulary: ["meter la pata", "estar en las nubes", "costar un ojo de la cara", "tomar el pelo", "no tener pelos en la lengua", "ser pan comido", "estar hasta las narices", "irse por las ramas"]
            grammar:
              - pattern: "Metí la pata al mencionar a su ex."
              - pattern: "Ese piso cuesta un ojo de la cara."
              - pattern: "Deja de irte por las ramas y ve al grano."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: listen_type }
          - id: verbs-of-change
            title: Verbs of Change
            description: Choose between ponerse, volverse, quedarse, hacerse and convertirse en.
            vocabulary: [ponerse, volverse, quedarse, hacerse, "convertirse en", "llegar a ser", "ponerse rojo", "quedarse sin palabras"]
            grammar:
              - pattern: "Se puso nerviosa antes del examen."
              - pattern: "Con los años se ha vuelto muy desconfiado."
              - pattern: "Se hizo médico y luego se convirtió en director del hospital."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: translate }
          - id: storytelling-idioms
            title: Telling a Story
            description: Tell an anecdote lively with idioms and colloquial fillers.
            vocabulary: ["resulta que", "total, que", "y va y", "de buenas a primeras", "para colmo", "en un abrir y cerrar de ojos", "quedarse de piedra", "al final"]
            grammar:
              - pattern: "Resulta que el vuelo se había cancelado."
              - pattern: "Y para colmo, se puso a llover."
              - pattern: "Total, que me quedé de piedra."
            activities:
              - { type: learn }
              - { type: word_bank, count: 2 }
              - { type: listen_type }
              - type: dialogue
                scenario: telling_a_travel_mishap
                goal: Tell a friend about a disastrous trip in a lively way, using idioms and storytelling phrases.

      - id: argument-academic
        title: Argument & Academic Writing
        description: Build, support and present a well-structured argument.
        icon: 🎓
        steps:
          - id: structuring-essay
            title: Structuring an Essay
            description: Introduce, develop and conclude an essay with formal connectors.
            vocabulary: ["en primer lugar", "en segundo lugar", "por otra parte", "asimismo", "en definitiva", "a modo de conclusión", "el planteamiento", "abordar"]
            grammar:
              - pattern: "En este ensayo se abordará la cuestión de la vivienda."
              - pattern: "Asimismo, conviene tener en cuenta el factor económico."
              - pattern: "En definitiva, las medidas resultan insuficientes."
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: translate }
          - id: evidence-citation
            title: Evidence & Citation
            description: Support claims with data and report what others say.
            vocabulary: ["según", "de acuerdo con", "tal y como señala", "los datos", "las cifras", "respaldar", "afirmar", "sostener"]
            grammar:
              - pattern: "Tal y como señala el autor, el problema es estructural."
              - pattern: "Según las cifras oficiales, el paro ha descendido."
              - pattern: "Varios expertos sostienen que la medida no será eficaz."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: error_correct }
              - { type: listen_type }
          - id: counterarguments
            title: Counterarguments
            description: Anticipate objections and refute them.
            vocabulary: ["se podría objetar que", "cabe argumentar", "refutar", "no es menos cierto que", "ahora bien", "lejos de", "en realidad", "carecer de fundamento"]
            grammar:
              - pattern: "Se podría objetar que la medida es costosa; ahora bien, a largo plazo resulta rentable."
              - pattern: "Lejos de solucionar el problema, lo ha agravado."
              - pattern: "Este argumento carece de fundamento."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: translate }
          - id: presenting-case
            title: Presenting a Case
            description: Present an argument aloud clearly and persuasively.
            vocabulary: ["me gustaría exponer", "como pueden ver", "quisiera subrayar", "permítanme", "en otras palabras", "para terminar", "agradezco su atención", "el turno de preguntas"]
            grammar:
              - pattern: "Permítanme que les explique por qué esta propuesta es necesaria."
              - pattern: "Quisiera subrayar un aspecto fundamental."
              - pattern: "Para terminar, les agradezco su atención."
            activities:
              - { type: learn }
              - { type: sentence_complete, count: 2 }
              - { type: speak }
              - type: dialogue
                scenario: defending_a_proposal
                goal: Present your proposal to a committee and answer their critical questions convincingly.

    checkpoint:
      title: C1 Checkpoint
      required_score: 80
      activities:
        - { type: word_select, count: 3 }
        - { type: fill_blank, count: 3 }
        - { type: error_correct, count: 2 }
        - { type: listen_select, count: 3 }
        - { type: translate, count: 3 }
        - { type: dialogue }

  C2:
    title: Proficiency
    description: >
      Understand with ease virtually everything heard or read, summarise and reconstruct arguments from different sources, and express yourself spontaneously, fluently and precisely, distinguishing finer shades of meaning even in the most complex situations.

    units:
      - id: register-nuance
        title: Register & Nuance
        description: Choose the exact register and shade of meaning for every speaker and situation.
        icon: 🎚️
        steps:
          - id: tu-usted-vos
            title: Tú, Usted, Vos
            description: Handle forms of address, voseo and shifts in formality.
            vocabulary: [tutear, "tratar de usted", vosear, "el voseo", "el ustedeo", "romper el hielo", "guardar las formas", "ponerse estirado"]
            grammar:
              - pattern: "¿Nos tuteamos o prefiere que le siga tratando de usted?"
              - pattern: "Vos sabés perfectamente lo que quiero decir."
              - pattern: "En Colombia hay quien le dice usted hasta a su perro."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: translate }
          - id: connotation
            title: Connotation & Shades of Meaning
            description: Tell near-synonyms apart by their connotation and register.
            vocabulary: [delgado, flaco, esbelto, escuálido, tacaño, ahorrador, terco, perseverante, "un tanto", "más bien"]
            grammar:
              - pattern: "No es tacaño, es más bien ahorrador."
              - pattern: "Llamarlo terco sería injusto; diría que es perseverante."
              - pattern: "Esbelto suena a elogio; escuálido, a preocupación."
            activities:
              - { type: learn, count: 2 }
              - { type: word_select, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: fill_blank }
          - id: euphemism
            title: Euphemism & Understatement
            description: Soften bad news with euphemism, litotes and mitigation.
            vocabulary: ["pasar a mejor vida", "faltar a la verdad", "ajuste de plantilla", "persona mayor", "no está nada mal", "dejar que desear", "entrado en carnes", "invidente"]
            grammar:
              - pattern: "Su abuelo pasó a mejor vida el invierno pasado."
              - pattern: "El ministro faltó a la verdad en su comparecencia."
              - pattern: "El servicio dejó bastante que desear, por decirlo suavemente."
            activities:
              - { type: learn, count: 2 }
              - { type: match }
              - { type: fill_blank, count: 2 }
              - { type: translate, count: 2 }
          - id: regional-varieties
            title: Regional Varieties
            description: Recognise varieties from Spain, Mexico, the Río de la Plata and the Caribbean and adjust your tone.
            vocabulary: [vale, guay, chido, "¿mande?", che, boludo, chévere, guagua, "el seseo", "el yeísmo"]
            grammar:
              - pattern: "En Madrid es guay, en México es chido y en Caracas es chévere."
              - pattern: "Che, ¿vos venís mañana o no?"
              - pattern: "En Cuba la guagua es el autobús, pero en Chile es un bebé."
            activities:
              - { type: learn, count: 2 }
              - { type: listen_select, count: 2 }
              - { type: multiple_choice }
              - type: dialogue
                scenario: regional_tone_adjustment
                goal: Talk with speakers from different countries and adapt your vocabulary and tone to each one.

      - id: modality-stance
        title: Modality & Stance
        description: Express obligation, probability and your own stance with precision.
        icon: ⚖️
        steps:
          - id: deber-modality
            title: Deber vs Deber De
            description: Distinguish obligation from conjecture and other modal nuances.
            vocabulary: [deber, "deber de", "haber de", "tener que", "hay que", "estar obligado a", "cabe suponer", "no queda otra"]
            grammar:
              - pattern: "Debes llegar puntual; el tribunal no espera."
              - pattern: "Deben de ser las diez, porque ya ha cerrado la panadería."
              - pattern: "Has de saber que aquí nadie regala nada."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: fill_blank }
          - id: stance-adverbials
            title: Stance Adverbials
            description: Signal your stance with adverbs and set phrases.
            vocabulary: [evidentemente, "al parecer", "a todas luces", "por lo visto", "a decir verdad", "sin lugar a dudas", supuestamente, "dicho sea de paso"]
            grammar:
              - pattern: "A todas luces, la reforma ha sido un fracaso."
              - pattern: "Por lo visto, el alcalde no piensa dimitir."
              - pattern: "A decir verdad, nunca me convenció del todo."
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: translate }
          - id: certainty-doubt
            title: Certainty & Doubt
            description: Grade certainty with the indicative, the subjunctive and hedging.
            vocabulary: ["a lo mejor", quizá, "es posible que", "no cabe duda de que", "me consta que", "dudo mucho que", "lo más probable es que", "vete a saber"]
            grammar:
              - pattern: "Me consta que lo sabía desde el principio."
              - pattern: "Dudo mucho que acepten sin rechistar."
              - pattern: "Quizá tenga razón, quizá no; vete a saber."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: listen_type }
          - id: attitude-conversation
            title: Attitude in Conversation
            description: Show agreement, scepticism and reservations without sounding blunt.
            vocabulary: ["ni de broma", "ya te digo", "no te creas", "hasta cierto punto", "eso habría que verlo", "dónde va a parar", "no es por nada, pero", "ojo con"]
            grammar:
              - pattern: "Hasta cierto punto tienes razón, pero eso habría que verlo."
              - pattern: "No es por nada, pero ya te lo advertí."
              - pattern: "¿Mejor que la de mi madre? ¡Dónde va a parar!"
            activities:
              - { type: learn, count: 2 }
              - { type: listen_select, count: 2 }
              - { type: sentence_complete }
              - type: dialogue
                scenario: sceptical_colleague
                goal: Discuss a risky proposal with a colleague, showing scepticism and partial agreement tactfully.

      - id: figurative-language
        title: Figurative Language
        description: Understand and use metaphor, opaque idioms and proverbs like a native speaker.
        icon: 🎭
        steps:
          - id: metaphor-simile
            title: Metaphor & Simile
            description: Build and decode comparisons and everyday metaphors.
            vocabulary: ["más terco que una mula", "como pez en el agua", "como agua de mayo", "más sordo que una tapia", "un mar de dudas", "la flor de la vida", "el ocaso", "una lluvia de críticas"]
            grammar:
              - pattern: "En la cocina se mueve como pez en el agua."
              - pattern: "Aquel dinero nos vino como agua de mayo."
              - pattern: "Tras la rueda de prensa cayó sobre él una lluvia de críticas."
            activities:
              - { type: learn, count: 2 }
              - { type: match }
              - { type: sentence_complete, count: 2 }
              - { type: translate }
          - id: opaque-idioms
            title: Opaque Idioms
            description: Master idioms whose meaning cannot be guessed from their words.
            vocabulary: ["tomar el pelo", "estar en la luna de Valencia", "irse por los cerros de Úbeda", "a buenas horas, mangas verdes", "ser la leche", "dar calabazas", "tirar la casa por la ventana", "estar hasta las narices"]
            grammar:
              - pattern: "No me tomes el pelo, que no estoy para bromas."
              - pattern: "Le pregunté por el dinero y se fue por los cerros de Úbeda."
              - pattern: "¿Ahora me lo dices? ¡A buenas horas, mangas verdes!"
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct }
          - id: refranes
            title: Refranes
            description: Recognise, complete and apply traditional Spanish proverbs.
            vocabulary: ["a caballo regalado no le mires el diente", "en casa del herrero, cuchillo de palo", "no hay mal que por bien no venga", "más vale pájaro en mano que ciento volando", "a quien madruga, Dios le ayuda", "dime con quién andas y te diré quién eres", "camarón que se duerme se lo lleva la corriente", "el refranero"]
            grammar:
              - pattern: "Como dice el refrán, no hay mal que por bien no venga."
              - pattern: "Es fontanero y tiene el grifo roto: en casa del herrero, cuchillo de palo."
              - pattern: "Acepta la oferta, que más vale pájaro en mano que ciento volando."
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: listen_type }
          - id: figurative-narration
            title: Narrating Figuratively
            description: Tell a story enriched with images, idioms and proverbs.
            vocabulary: ["érase una vez", "de buenas a primeras", "en un abrir y cerrar de ojos", "la gota que colmó el vaso", "a trancas y barrancas", "con el corazón en un puño", "a la postre", "quedarse de piedra"]
            grammar:
              - pattern: "Aquel comentario fue la gota que colmó el vaso."
              - pattern: "Terminamos la carrera a trancas y barrancas."
              - pattern: "Esperamos la noticia con el corazón en un puño."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: translate, count: 2 }
              - type: dialogue
                scenario: anecdote_at_dinner
                goal: Tell a friend a dramatic personal anecdote using vivid idioms and at least one proverb.

      - id: rhetoric-persuasion
        title: Rhetoric & Persuasion
        description: Persuade with rhetorical devices, structure and carefully chosen words.
        icon: 🎤
        steps:
          - id: rhetorical-devices
            title: Rhetorical Devices
            description: Identify and use anaphora, antithesis, rhetorical questions and hyperbole.
            vocabulary: ["la anáfora", "la antítesis", "la pregunta retórica", "la hipérbole", "el paralelismo", "la gradación", "la ironía", "el clímax"]
            grammar:
              - pattern: "¿Acaso no merecemos todos una segunda oportunidad?"
              - pattern: "Hemos venido a escuchar, hemos venido a aprender, hemos venido a cambiar."
              - pattern: "Es tan poco lo que pedimos y tanto lo que está en juego."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: translate }
          - id: persuasive-structures
            title: Persuasive Structures
            description: Concede, counter-argue and build towards a conclusion.
            vocabulary: ["si bien", "aun cuando", "no obstante", "ahora bien", "cabe objetar que", "es más", "en definitiva", "por si fuera poco"]
            grammar:
              - pattern: "Si bien el plan es ambicioso, no es en absoluto inviable."
              - pattern: "Ahora bien, cabe objetar que los costes se han disparado."
              - pattern: "Es caro, es lento y, por si fuera poco, contamina."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: error_correct }
          - id: loaded-language
            title: Emotive & Loaded Language
            description: Detect bias and emotional charge in the media and political discourse.
            vocabulary: [régimen, gobierno, "recorte", "ajuste", "okupa", "activista", "desaceleración", "crisis", "daños colaterales", "polémico"]
            grammar:
              - pattern: "Unos lo llaman recorte; otros, ajuste necesario."
              - pattern: "El titular habla de régimen, no de gobierno, y eso no es casual."
              - pattern: "Decir desaceleración en vez de crisis es una forma de maquillar los datos."
            activities:
              - { type: learn, count: 2 }
              - { type: word_select, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: translate }
          - id: speech-delivery
            title: Writing & Delivering a Speech
            description: Open, structure and close a speech that moves an audience.
            vocabulary: ["señoras y señores", "permítanme", "quisiera empezar", "no me cansaré de repetir", "para terminar", "muchas gracias por su atención", "el discurso", "la audiencia"]
            grammar:
              - pattern: "Permítanme empezar con una anécdota."
              - pattern: "No me cansaré de repetir que la educación es la clave."
              - pattern: "Para terminar, quisiera dar las gracias a quienes lo han hecho posible."
            activities:
              - { type: learn }
              - { type: sentence_complete, count: 2 }
              - { type: speak, count: 2 }
              - type: dialogue
                scenario: wedding_toast_speech
                goal: Deliver a short persuasive speech and respond to questions and objections from the audience.

      - id: humour-irony
        title: Humour, Irony & Wordplay
        description: Catch and produce irony, sarcasm, puns and culture-specific humour.
        icon: 😏
        steps:
          - id: irony-sarcasm
            title: Irony & Sarcasm
            description: Spot ironic intonation and sarcastic formulas.
            vocabulary: ["¡qué bien!", "¡lo que faltaba!", "¡hombre, claro!", "¡vaya por Dios!", "no, si encima", "menudo", "¡qué gracioso!", "con retintín"]
            grammar:
              - pattern: "¡Lo que faltaba! Ahora se ha ido la luz."
              - pattern: "No, si encima tendré que darte las gracias."
              - pattern: "¡Menudo día llevo! Y aún son las diez."
            activities:
              - { type: learn, count: 2 }
              - { type: listen_select, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: listen_type }
          - id: puns-double-meanings
            title: Puns & Double Meanings
            description: Understand puns based on homophones, polysemy and doble sentido.
            vocabulary: ["el doble sentido", "el juego de palabras", "el calambur", "el chiste", "pillar el chiste", "la polisemia", "el albur", "la ocurrencia"]
            grammar:
              - pattern: "—¿Qué le dice una iguana a su hermana gemela? —Somos iguanitas."
              - pattern: "Tardé un rato en pillar el chiste."
              - pattern: "En México el albur es un arte de doble sentido."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: word_bank }
              - { type: translate }
          - id: humour-across-world
            title: Humour Across the Hispanic World
            description: Compare humour traditions, from Spanish deadpan to Argentine and Caribbean jokes.
            vocabulary: ["el humor negro", "la retranca", "la guasa", "la chispa", "el choteo", "el cachondeo", "tener salero", "el humorista"]
            grammar:
              - pattern: "Los gallegos son famosos por su retranca."
              - pattern: "En Cuba el choteo sirve para desdramatizarlo todo."
              - pattern: "Tiene mucha chispa contando chistes."
            activities:
              - { type: learn, count: 2 }
              - { type: match }
              - { type: fill_blank, count: 2 }
              - { type: sentence_complete }
          - id: funny-story
            title: Telling a Funny Story
            description: Time a joke, build suspense and deliver the punchline.
            vocabulary: ["resulta que", "total, que", "y va y me dice", "te vas a reír", "partirse de risa", "el remate", "quedarse con alguien", "meter la pata"]
            grammar:
              - pattern: "Resulta que iba yo tan tranquilo y va y me dice..."
              - pattern: "Total, que metí la pata hasta el fondo."
              - pattern: "Nos partimos de risa cuando nos enteramos."
            activities:
              - { type: learn }
              - { type: word_bank, count: 2 }
              - { type: speak }
              - type: dialogue
                scenario: embarrassing_story_bar
                goal: Tell an embarrassing funny story with good timing and react to your friend's teasing.

      - id: academic-writing
        title: Academic & Formal Writing
        description: Write precise, cohesive academic texts and formal correspondence.
        icon: 🎓
        steps:
          - id: academic-register
            title: Academic Register
            description: Use impersonal constructions, nominalisation and hedging typical of academic Spanish.
            vocabulary: ["cabe señalar", "se constata", "el presente trabajo", "a tenor de", "en lo que respecta a", "la hipótesis", "el planteamiento", "se desprende de"]
            grammar:
              - pattern: "Cabe señalar que los datos son provisionales."
              - pattern: "De los resultados se desprende una clara correlación."
              - pattern: "El presente trabajo pretende arrojar luz sobre la cuestión."
            activities:
              - { type: learn, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: translate }
          - id: cohesion
            title: Cohesion in Long Texts
            description: Link paragraphs with connectors, anaphora and textual organisers.
            vocabulary: ["en primer lugar", "por otra parte", "dicho esto", "en este sentido", "a este respecto", "lo anterior", "el mencionado", "en suma"]
            grammar:
              - pattern: "Dicho esto, conviene matizar algunos aspectos."
              - pattern: "En este sentido, el mencionado estudio resulta revelador."
              - pattern: "En suma, lo anterior confirma nuestra hipótesis inicial."
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: multiple_choice }
          - id: summarising-paraphrasing
            title: Summarising & Paraphrasing
            description: Condense and reformulate sources without copying them.
            vocabulary: ["a grandes rasgos", "en síntesis", "según el autor", "el autor sostiene que", "dicho de otro modo", "en otras palabras", "parafrasear", "la cita"]
            grammar:
              - pattern: "A grandes rasgos, el autor sostiene que la memoria es selectiva."
              - pattern: "Dicho de otro modo, recordamos lo que nos conviene."
              - pattern: "Según la autora, la crisis no fue tanto económica como moral."
            activities:
              - { type: learn, count: 2 }
              - { type: listen_type, count: 2 }
              - { type: translate, count: 2 }
              - { type: sentence_complete }
          - id: formal-correspondence
            title: Formal Correspondence
            description: Write formal letters and emails with the right openings and closings.
            vocabulary: ["Estimado señor", "Estimada señora", "Muy señor mío", "Por medio de la presente", "Le saluda atentamente", "Quedo a la espera de", "Sin otro particular", "Adjunto le remito"]
            grammar:
              - pattern: "Por medio de la presente le comunico mi decisión de renunciar al cargo."
              - pattern: "Sin otro particular, le saluda atentamente."
              - pattern: "Quedo a la espera de sus noticias."
            activities:
              - { type: learn, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: fill_blank }

      - id: literature-style
        title: Literature & Style
        description: Read literary Spanish closely and discuss voice, tone and style.
        icon: 📚
        steps:
          - id: literary-vocabulary
            title: Literary Vocabulary
            description: Learn words of literary register and the vocabulary of literary analysis.
            vocabulary: [crepúsculo, sosiego, efímero, inefable, umbral, "el narrador", "el desenlace", "el realismo mágico", "el personaje", "la trama"]
            grammar:
              - pattern: "El crepúsculo teñía de cobre los tejados."
              - pattern: "Fue una dicha efímera, casi inefable."
              - pattern: "El desenlace de la novela deja al lector en el umbral de la duda."
            activities:
              - { type: learn, count: 2 }
              - { type: match }
              - { type: word_select, count: 2 }
              - { type: translate }
          - id: narrative-voice
            title: Narrative Voice & Tone
            description: Recognise narrative voice and archaic forms such as the futuro de subjuntivo and pretérito anterior.
            vocabulary: ["el narrador omnisciente", "el monólogo interior", "el estilo indirecto libre", "el futuro de subjuntivo", "el pretérito anterior", "hubiere", "fuere", "hubo terminado"]
            grammar:
              - pattern: "Apenas hubo terminado de hablar, se levantó y salió."
              - pattern: "El que infringiere esta norma será sancionado."
              - pattern: "Adonde fueres, haz lo que vieres."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: error_correct }
              - { type: listen_type }
          - id: stylistic-variation
            title: Stylistic Variation
            description: Rewrite the same content in different styles and registers.
            vocabulary: ["la prosa", "el estilo llano", "barroco", "conciso", "recargado", "coloquial", "lacónico", "el hipérbaton"]
            grammar:
              - pattern: "Del salón en el ángulo oscuro, silenciosa y cubierta de polvo, veíase el arpa."
              - pattern: "Lo bueno, si breve, dos veces bueno."
              - pattern: "Su prosa es lacónica, casi telegráfica."
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: translate }
          - id: discussing-book
            title: Discussing a Book
            description: Argue an interpretation of a novel and recommend or pan it.
            vocabulary: ["engancharse", "el ritmo narrativo", "flojo", "redondo", "inverosímil", "la obra maestra", "dejar huella", "leer entre líneas"]
            grammar:
              - pattern: "Me enganchó desde la primera página."
              - pattern: "El final me pareció algo inverosímil, la verdad."
              - pattern: "Hay que leer entre líneas para entender al protagonista."
            activities:
              - { type: learn }
              - { type: listen_select, count: 2 }
              - { type: sentence_complete }
              - type: dialogue
                scenario: book_club_debate
                goal: Defend your interpretation of a novel at a book club and respond to a member who disliked it.

      - id: ideas-philosophy
        title: Ideas & Philosophy
        description: Discuss abstract ideas, reason rigorously and explore hypotheticals.
        icon: 🤔
        steps:
          - id: abstract-concepts
            title: Abstract Concepts
            description: Talk about abstract notions such as freedom, justice and identity.
            vocabulary: ["la libertad", "la justicia", "el albedrío", "la conciencia", "la ética", "lo absoluto", "lo relativo", "el ser"]
            grammar:
              - pattern: "Lo justo no siempre coincide con lo legal."
              - pattern: "¿Existe de verdad el libre albedrío?"
              - pattern: "Lo relativo de la verdad no la hace menos necesaria."
            activities:
              - { type: learn, count: 2 }
              - { type: word_select, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: translate }
          - id: logic-fallacies
            title: Logic & Fallacies
            description: Name and rebut common fallacies in arguments.
            vocabulary: ["la falacia", "el hombre de paja", "ad hominem", "la falsa dicotomía", "la pendiente resbaladiza", "la premisa", "la conclusión", "no se sigue que"]
            grammar:
              - pattern: "De ahí no se sigue que todos sean culpables."
              - pattern: "Eso es un ataque ad hominem, no un argumento."
              - pattern: "Me planteas una falsa dicotomía: hay más opciones."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: sentence_complete }
          - id: thought-experiments
            title: Thought Experiments
            description: Explore hypotheticals with complex conditional and concessive clauses.
            vocabulary: ["supongamos que", "imaginemos que", "de ser así", "en el supuesto de que", "aun suponiendo que", "a no ser que", "el dilema", "el experimento mental"]
            grammar:
              - pattern: "Supongamos que pudieras borrar un recuerdo: ¿lo harías?"
              - pattern: "De haberlo sabido, habría actuado de otro modo."
              - pattern: "Aun suponiendo que tuvieras razón, el dilema seguiría en pie."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: translate, count: 2 }
              - { type: listen_type }
          - id: philosophical-discussion
            title: A Philosophical Discussion
            description: Sustain a reasoned debate on a big question.
            vocabulary: ["a mi juicio", "en el fondo", "lo que subyace", "matizar", "rebatir", "en última instancia", "la paradoja", "pienso, luego existo"]
            grammar:
              - pattern: "A mi juicio, en el fondo se trata de una cuestión ética."
              - pattern: "Permíteme que matice tu argumento."
              - pattern: "En última instancia, lo que subyace es el miedo a la muerte."
            activities:
              - { type: learn }
              - { type: word_bank, count: 2 }
              - { type: sentence_complete }
              - type: dialogue
                scenario: free_will_debate
                goal: Debate whether free will exists, rebutting arguments and pointing out fallacies.

      - id: culture-identity
        title: Culture, Language & Identity
        description: Reflect on language change, identity and communication across cultures.
        icon: 🌎
        steps:
          - id: language-change
            title: Language Change & Spanglish
            description: Discuss anglicisms, Spanglish, language norms and the RAE.
            vocabulary: ["el anglicismo", "el préstamo", "el Spanglish", "la RAE", "la norma", "el purismo", "el extranjerismo", "el lenguaje inclusivo"]
            grammar:
              - pattern: "Voy a parquear la troca y te llamo pa'trás."
              - pattern: "La RAE desaconseja el uso innecesario de extranjerismos."
              - pattern: "La lengua la hacen los hablantes, no las academias."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: translate }
          - id: identity-belonging
            title: Identity & Belonging
            description: Talk about roots, migration and multiple identities.
            vocabulary: ["las raíces", "el arraigo", "el desarraigo", "la diáspora", "sentirse de", "ni de aquí ni de allá", "la morriña", "la añoranza"]
            grammar:
              - pattern: "Me siento tan de aquí como de allá."
              - pattern: "La morriña se me pasa en cuanto huelo el pulpo a feira."
              - pattern: "Crecer entre dos culturas me hizo sentir ni de aquí ni de allá."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: listen_type }
          - id: cross-cultural
            title: Cross-Cultural Communication
            description: Navigate misunderstandings, directness and politeness across cultures.
            vocabulary: ["el malentendido", "meter la pata", "la sobremesa", "la impuntualidad", "la hora latina", "el choque cultural", "ser directo", "andarse con rodeos"]
            grammar:
              - pattern: "Aquí la sobremesa puede durar más que la comida."
              - pattern: "Sin andarse con rodeos, le dijo que no."
              - pattern: "Lo que para unos es franqueza, para otros es mala educación."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: word_bank }
              - { type: translate }
          - id: tradition-modernity
            title: Tradition & Modernity
            description: Debate how traditions survive, change or disappear.
            vocabulary: ["la tradición", "el folclore", "las fiestas patronales", "el Día de Muertos", "la tauromaquia", "renovarse o morir", "a la antigua", "la globalización"]
            grammar:
              - pattern: "Renovarse o morir, dicen, pero no a cualquier precio."
              - pattern: "El Día de Muertos se ha convertido en un fenómeno global."
              - pattern: "Hay tradiciones que conviene conservar y otras que no."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: listen_select }
              - type: dialogue
                scenario: tradition_debate
                goal: Discuss with a local whether a controversial tradition should be preserved, adapted or abandoned.

      - id: mastery-mediation
        title: Mastery & Mediation
        description: Mediate between people and texts, and stay in control of any conversation.
        icon: 🏆
        steps:
          - id: interpreting-reformulating
            title: Interpreting & Reformulating
            description: Relay and reformulate what others say for a different audience.
            vocabulary: ["lo que quiere decir es", "si lo he entendido bien", "en pocas palabras", "reformular", "traducir a lenguaje llano", "matizar", "el intérprete", "la mediación"]
            grammar:
              - pattern: "Si lo he entendido bien, lo que quiere decir es que no hay presupuesto."
              - pattern: "En pocas palabras, el contrato les obliga a pagar por adelantado."
              - pattern: "¿Me permite que lo traduzca a lenguaje llano?"
            activities:
              - { type: learn, count: 2 }
              - { type: listen_type, count: 2 }
              - { type: translate, count: 2 }
              - { type: sentence_complete }
          - id: difficult-conversations
            title: Difficult Conversations
            description: Give criticism, deliver bad news and de-escalate conflict.
            vocabulary: ["no quisiera que me malinterpretaras", "entiendo tu postura", "pongámonos en su lugar", "limar asperezas", "echar balones fuera", "dar la cara", "a toro pasado", "lo cortés no quita lo valiente"]
            grammar:
              - pattern: "No quisiera que me malinterpretaras, pero esto no puede seguir así."
              - pattern: "Entiendo tu postura; aun así, alguien tiene que dar la cara."
              - pattern: "Lo cortés no quita lo valiente."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: error_correct }
              - { type: speak }
          - id: thinking-on-feet
            title: Thinking on Your Feet
            description: Buy time, recover from slips and improvise answers smoothly.
            vocabulary: ["buena pregunta", "a ver cómo lo digo", "por así decirlo", "mejor dicho", "dicho sea de paso", "salir del paso", "improvisar", "quedarse en blanco"]
            grammar:
              - pattern: "Buena pregunta; a ver cómo lo digo."
              - pattern: "Fue un error, mejor dicho, una decisión precipitada."
              - pattern: "Me quedé en blanco, pero conseguí salir del paso."
            activities:
              - { type: learn, count: 2 }
              - { type: listen_select, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: speak }
          - id: chairing-moderating
            title: Chairing & Moderating
            description: Open, steer and close a meeting or debate fairly.
            vocabulary: ["damos comienzo a", "tiene la palabra", "le ruego que sea breve", "ceñirse al tema", "el orden del día", "si me permiten", "a modo de conclusión", "se levanta la sesión"]
            grammar:
              - pattern: "Tiene la palabra la señora Ruiz; le ruego que sea breve."
              - pattern: "Ciñámonos al orden del día, si me permiten."
              - pattern: "A modo de conclusión, se levanta la sesión."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: word_bank }
              - type: dialogue
                scenario: moderating_heated_debate
                goal: Moderate a heated panel debate, keeping speakers on topic and summarising the conclusions.

