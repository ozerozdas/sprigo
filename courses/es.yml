            vocabulary: [he, has, ha, hemos, han, visitado, comido, vivido]
            grammar:
              - pattern: "He visitado Perú dos veces."
              - pattern: "¿Has comido paella?"
              - pattern: "Nunca hemos vivido en el extranjero."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 3 }
              - { type: word_bank }
