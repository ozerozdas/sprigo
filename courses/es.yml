      - id: childhood
        title: When I Was a Child
        description: Describe habits and situations in the past with the imperfect.
        icon: 🧸
        steps:
          - id: imperfecto-regular
            title: The Imperfect (Regular)
            description: The imperfecto of -ar (-aba) and -er/-ir (-ía) verbs.
            vocabulary: ["cuando era niño", "de pequeño", jugaba, vivía, comía, tenía, "todos los veranos"]
            grammar:
              - pattern: "De pequeño jugaba en la calle."
              - pattern: "Vivíamos en un pueblo pequeño."
              - pattern: "¿Qué comías de niño?"
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 3 }
              - { type: word_bank }
              - { type: listen_select }
          - id: imperfecto-irregular
            title: Was, Went, Saw
            description: "The only three irregular imperfects: ser, ir and ver."
            vocabulary: [era, eras, éramos, iba, íbamos, veía, veíamos]
            grammar:
              - pattern: "Cuando era niña, iba al colegio en bici."
              - pattern: "Veíamos dibujos animados todas las tardes."
            activities:
              - { type: learn, count: 2 }
              - { type: match }
              - { type: error_correct, count: 2 }
              - { type: listen_type }
          - id: soler
            title: Used To
            description: Past habits with soler + infinitive and the imperfect.
            vocabulary: [soler, solía, "normalmente", "antes", "ya no", "todavía"]
