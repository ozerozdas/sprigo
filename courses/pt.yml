# Portuguese course (European Portuguese: pt-PT usage, e.g. "autocarro", "comboio", "telemóvel",
# "acordo-me"). Hierarchy: levels (CEFR) > units > steps > activities.
# Activities name only a type (+ optional count and hints like scenario/goal); the AI writes the content
# from the step's title, description, vocabulary, grammar and the level. Types: see src/course.ts.
name: Portuguese
native_name: Português
iso: pt
flag: 🇵🇹

# Step and unit ids are ASCII-only transliterations (regex in src/course.ts); they key user
# progress and must never be renamed once shipped.
levels:
  A1:
    title: Beginner
    description: >
      Understand and use familiar everyday expressions and very basic phrases
      about yourself, your family and your surroundings.

    units:
      - id: saudacoes
        title: Greetings & Introductions
        description: Meet people and introduce yourself.
        icon: 👋
        steps:
          - id: pt-basic-greetings
            title: Basic Greetings
            description: Common greetings and farewells for different times of day.
            vocabulary: [olá, "bom dia", "boa tarde", "boa noite", adeus, "até logo", "até amanhã", "até já"]
            grammar:
              - pattern: "Bom dia!"
              - pattern: "Olá! Como estás?"
              - pattern: "Adeus! Até amanhã."
            activities:
              - { type: learn, count: 3 }
              - { type: word_select, count: 2 }
              - { type: match }
              - { type: listen_select, count: 2 }
              - { type: speak }
          - id: pt-introduce-yourself
            title: Introduce Yourself
            description: Tell someone your name and ask theirs.
            vocabulary: ["chamo-me", nome, apelido, sou, prazer, "de onde", português, portuguesa]
            grammar:
              - pattern: "Como te chamas?"
              - pattern: "Chamo-me {name}. O meu nome é {name}."
              - pattern: "Muito prazer."
              - pattern: "De onde és? Sou português."
            activities:
              - { type: learn, count: 2 }
              - { type: translate, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: word_bank, count: 2 }
              - type: dialogue
                scenario: meeting_someone
                goal: Greet the person, introduce yourself, say where you are from and ask their name.
          - id: pt-how-are-you
            title: How Are You?
            description: Ask and answer how someone is, using tu informally and o senhor / a senhora politely.
            vocabulary: [bem, "muito bem", cansado, cansada, obrigado, obrigada, "e tu?", "e a senhora?"]
            grammar:
              - pattern: "Como estás?"
              - pattern: "Como está?"
              - pattern: "Estou bem, obrigado. E tu?"
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: listen_type }
              - type: dialogue
                scenario: friend_on_the_street
          - id: pt-polite-words
            title: Please & Thank You
            description: Be polite in everyday situations, from casual to formal.
            vocabulary: ["por favor", obrigado, "de nada", desculpe, "com licença", "não faz mal"]
            grammar:
              - pattern: "Por favor."
              - pattern: "Muito obrigado!"
              - pattern: "Desculpe, onde é a estação?"
            activities:
              - { type: learn, count: 2 }
              - { type: word_select, count: 2 }
              - { type: match }
              - { type: sentence_complete, count: 2 }
              - { type: listen_select }

      - id: alfabeto-sons
        title: Alphabet & Sounds
        description: Spell your name and learn the sounds of Portuguese.
        icon: 🔤
        steps:
          - id: pt-spelling
            title: Spelling Your Name
            description: Spell names out letter by letter.
            vocabulary: [nome, apelido, letra, alfabeto, "escreve-se", "como se escreve", "o teu nome"]
            grammar:
              - pattern: "Como se escreve o teu nome?"
              - pattern: "Escreve-se A-N-A."
              - pattern: "O meu apelido é…"
            activities:
              - { type: learn, count: 3 }
              - { type: match }
              - { type: listen_select, count: 2 }
              - { type: speak }
          - id: pt-sounds
            title: Nasal Sounds & Digraphs
            description: The sounds ão, nh and lh, and the letter ç.
            vocabulary: [pão, banho, filho, ação, noite, leite, estação, maçã]
            grammar:
              - pattern: "«Pão» tem ão."
              - pattern: "«Banho» tem nh, «filho» tem lh."
              - pattern: "«Ação» tem ç."
              - pattern: "«Noite» tem oi, «leite» tem ei."
            activities:
              - { type: learn, count: 2 }
              - { type: image_select, count: 2 }
              - { type: match }
              - { type: multiple_choice, count: 2 }
              - { type: speak }
          - id: pt-question-words
            title: First Question Words
            description: Who, what, where, when, how — ask your first questions.
            vocabulary: [quem, "o que", onde, quando, como, porquê, quanto, quantos]
            grammar:
              - pattern: "Quem é?"
              - pattern: "O que é isto?"
              - pattern: "Onde moras?"
              - pattern: "Quantos anos tens?"
            activities:
              - { type: learn, count: 2 }
              - { type: word_select, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: listen_type }
          - id: pt-reading
            title: Reading Simple Words
            description: Read short words out loud using Portuguese sounds.
            vocabulary: [leite, pão, noite, café, estação, amigo, família]
            grammar:
              - pattern: "«Estação» tem ç e ão."
              - pattern: "«Café» tem acento na última sílaba."
              - pattern: "Lê em voz alta: leite, pão, noite."
            activities:
              - { type: learn, count: 2 }
              - { type: listen_type, count: 2 }
              - { type: image_select, count: 2 }
              - { type: word_select }

      - id: numeros-cores
        title: Numbers & Colors
        description: Count, say your age and name colors.
        icon: 🔢
        steps:
          - id: pt-numbers-1-10
            title: Numbers 1–10
            vocabulary: [um, dois, três, quatro, cinco, seis, sete, oito, nove, dez]
            grammar:
              - pattern: "um, dois, três…"
              - pattern: "um livro — dois livros"
              - pattern: "uma maçã — duas maçãs"
            activities:
              - { type: learn, count: 3 }
              - { type: match }
              - { type: listen_select, count: 2 }
              - { type: listen_type }
          - id: pt-numbers-11-100
            title: Numbers 11–100
            vocabulary: [onze, doze, treze, catorze, vinte, "vinte e um", trinta, cinquenta, cem]
            grammar:
              - pattern: "vinte e cinco"
              - pattern: "O meu número é…"
            activities:
              - { type: learn, count: 2 }
              - { type: word_select, count: 2 }
              - { type: listen_type, count: 2 }
              - { type: match }
          - id: pt-how-old
            title: How Old Are You?
            description: Say your age with ter (not "ser").
            vocabulary: [anos, "quantos anos", tenho, tens, tem, temos, têm]
            grammar:
              - pattern: "Quantos anos tens?"
              - pattern: "Tenho vinte anos."
              - pattern: "O meu irmão tem sete anos."
            activities:
              - { type: learn }
              - { type: word_bank, count: 2 }
              - { type: translate, count: 2 }
              - { type: error_correct }
          - id: pt-colors
            title: Colors & Agreement
            description: Colors and how the adjective agrees with the noun.
            vocabulary: [vermelho, preto, branco, verde, azul, amarelo, "a cor"]
            grammar:
              - pattern: "O carro é vermelho."
              - pattern: "A saia é preta."
              - pattern: "De que cor é?"
            activities:
              - { type: learn, count: 2 }
              - { type: image_select, count: 2 }
              - { type: word_select, count: 2 }
              - { type: fill_blank }

      - id: paises-linguas
        title: Countries, Languages & Occupations
        description: Say where you are from, what languages you speak and what you do.
        icon: 🌍
        steps:
          - id: pt-countries
            title: Countries
            description: Name countries and say where you live.
            vocabulary: [Portugal, Espanha, França, Alemanha, Brasil, cidade, país, Lisboa]
            grammar:
              - pattern: "De onde és?"
              - pattern: "Sou de Portugal."
              - pattern: "Moro em Lisboa."
            activities:
              - { type: learn, count: 3 }
              - { type: match }
              - { type: word_select, count: 2 }
              - { type: listen_select }
          - id: pt-nationalities
            title: Nationalities
            description: Nationality adjectives change with the person's gender.
            vocabulary: [português, portuguesa, espanhol, espanhola, americano, americana, alemão, alemã]
            grammar:
              - pattern: "Ele é português, ela é portuguesa."
              - pattern: "Sou americano."
              - pattern: "Ele é alemão, ela é alemã."
            activities:
              - { type: learn, count: 2 }
              - { type: translate, count: 2 }
              - { type: fill_blank, count: 2 }
              - type: error_correct
                hint: Match the nationality to the person’s gender.
          - id: pt-languages
            title: Languages
            description: Languages you speak and how to ask about a word.
            vocabulary: [língua, falo, falas, português, inglês, francês, alemão, "um pouco"]
            grammar:
              - pattern: "Que línguas falas?"
              - pattern: "Falo um pouco de português."
              - pattern: "Falas inglês?"
              - pattern: "Como se diz «obrigado» em inglês?"
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: listen_type }
              - { type: fill_blank }
          - id: pt-occupations
            title: Occupations
            description: Talk about what people do for a living.
            vocabulary: [estudante, professor, professora, médico, médica, engenheiro, advogado, "o trabalho"]
            grammar:
              - pattern: "Qual é a tua profissão?"
              - pattern: "Sou estudante."
              - pattern: "Ela é médica."
              - pattern: "Trabalho numa escola."
            activities:
              - { type: learn, count: 2 }
              - { type: word_select, count: 2 }
              - { type: translate, count: 2 }
              - { type: match }

      - id: familia-artigos
        title: Family, Articles & Core Verbs
        description: Talk about your family while learning ser, ter and the articles.
        icon: 👨‍👩‍👧
        steps:
          - id: pt-family
            title: Family Members
            vocabulary: [mãe, pai, irmão, irmã, avô, avó, filho, filha, família]
            grammar:
              - pattern: "Tenho um irmão e uma irmã."
              - pattern: "Esta é a minha mãe."
              - pattern: "Têm dois filhos."
            activities:
              - { type: learn, count: 3 }
              - { type: match }
              - { type: word_select, count: 2 }
              - { type: listen_select }
          - id: pt-articles
            title: Articles & Gender
            description: Masculine and feminine nouns, articles and plurals.
            vocabulary: [o, a, os, as, um, uma, "o livro", "a casa"]
            grammar:
              - pattern: "o livro → os livros"
              - pattern: "a casa → as casas"
              - pattern: "um amigo — uma amiga"
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 3 }
              - { type: error_correct, count: 2 }
              - { type: word_bank }
          - id: pt-ser-ter
            title: I Am, I Have
            description: Conjugate ser and ter in the present.
            vocabulary: [sou, és, é, somos, são, tenho, tens, tem, temos, têm]
            grammar:
              - pattern: "Eu sou, tu és, ele/ela é."
              - pattern: "Nós somos, eles/elas são."
              - pattern: "Tenho um cão. Ela tem dois gatos."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 3 }
              - { type: multiple_choice, count: 2 }
              - { type: word_bank }
          - id: pt-friends
            title: Friends & Descriptions
            description: Describe friends and how they feel.
            vocabulary: [amigo, amiga, colega, simpático, triste, feliz, pessoas]
            grammar:
              - pattern: "O meu amigo é simpático."
              - pattern: "Tenho uma amiga simpática."
              - pattern: "Hoje ela está triste."
            activities:
              - { type: learn, count: 2 }
              - { type: image_select, count: 2 }
              - { type: translate, count: 2 }
              - { type: sentence_complete }

      - id: comida-bebidas
        title: Food, Drink & Requests
        description: Order food and drinks and say what you like.
        icon: 🍎
        steps:
          - id: pt-food
            title: Food Basics
            vocabulary: [pão, leite, massa, carne, ovo, maçã, queijo]
            grammar:
              - pattern: "Ao almoço como massa."
              - pattern: "Gosto de pão."
              - pattern: "Não gosto de carne."
              - pattern: "um ovo — dois ovos"
            activities:
              - { type: learn, count: 3 }
              - { type: image_select, count: 2 }
              - { type: match }
              - { type: listen_select }
          - id: pt-drinks
            title: Drinks
            description: Order a drink politely.
            vocabulary: [água, café, chá, vinho, cerveja, sumo, copo]
            grammar:
              - pattern: "Uma água, por favor."
              - pattern: "Queria um café com leite."
              - pattern: "Um chá, por favor."
            activities:
              - { type: learn, count: 2 }
              - { type: word_select, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: listen_type }
          - id: pt-want-can
            title: I Want / I Can
            description: Say what you want and what you can do with querer and poder.
            vocabulary: [quero, queres, quer, posso, queria, "posso pagar", cartão]
            grammar:
              - pattern: "Queria um café, por favor."
              - pattern: "Posso pagar com cartão?"
              - pattern: "Quero sair agora."
            activities:
              - { type: learn, count: 2 }
              - { type: translate, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: sentence_complete, count: 2 }
          - id: pt-at-the-cafe
            title: At the Café
            description: A short visit to a café, ordering and paying.
            vocabulary: [café, menu, empregado, conta, sobremesa, "muito bom", "muito boa"]
            grammar:
              - pattern: "O que deseja?"
              - pattern: "Um café com leite, por favor."
              - pattern: "A conta, por favor."
              - pattern: "Obrigado, estava muito bom."
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: listen_select }
              - type: dialogue
                scenario: cafe_order
                goal: Order a drink and a snack, then ask for the bill.

      - id: tempo-dias
        title: Time, Days & Weather
        description: Tell the time, talk about days, seasons and the weather.
        icon: ⏰
        steps:
          - id: pt-time
            title: Telling Time
            description: Ask and say the time.
            vocabulary: [hora, minuto, relógio, "a que horas", hoje, amanhã, ontem]
            grammar:
              - pattern: "Que horas são?"
              - pattern: "São três horas."
              - pattern: "É uma hora."
              - pattern: "A que horas? Às seis."
            activities:
              - { type: learn, count: 2 }
              - { type: listen_type, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: fill_blank }
          - id: pt-days
            title: Days of the Week
            vocabulary: ["segunda-feira", "terça-feira", "quarta-feira", "quinta-feira", "sexta-feira", sábado, domingo]
            grammar:
              - pattern: "Na segunda-feira vou trabalhar."
              - pattern: "No sábado tenho tempo."
              - pattern: "Ao domingo não trabalho."
            activities:
              - { type: learn, count: 3 }
              - { type: multiple_choice, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: listen_select }
          - id: pt-seasons-weather
            title: Seasons & Weather
            description: The four seasons and everyday weather talk.
            vocabulary: [primavera, verão, outono, inverno, chove, neva, "está frio", "está calor"]
            grammar:
              - pattern: "Hoje está calor."
              - pattern: "No inverno está frio e neva."
              - pattern: "Lá fora chove."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: listen_select }
          - id: pt-habits
            title: Everyday Habits
            description: Simple present sentences about your routine.
            vocabulary: ["acordo-me", trabalho, estudo, leio, durmo, "de manhã", "à noite"]
            grammar:
              - pattern: "De manhã acordo-me às sete."
              - pattern: "À noite leio."
              - pattern: "Trabalho de segunda a sexta."
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: translate, count: 2 }
              - { type: speak }

      - id: cidade-transportes
        title: Around Town
        description: Find your way, use transport and ask prices.
        icon: 🏙️
        steps:
          - id: pt-places
            title: Places in Town
            description: Name city places and ask where they are.
            vocabulary: [praça, parque, estação, escola, hospital, teatro, centro]
            grammar:
              - pattern: "Onde é a praça?"
              - pattern: "A praça é no centro."
              - pattern: "O hospital é perto."
            activities:
              - { type: learn, count: 3 }
              - { type: image_select, count: 2 }
              - { type: match }
              - { type: listen_select }
          - id: pt-directions
            title: Directions
            description: Give and follow simple directions.
            vocabulary: ["em frente", "à esquerda", "à direita", aqui, ali, perto, longe]
            grammar:
              - pattern: "Vai em frente, depois à esquerda."
              - pattern: "É perto?"
              - pattern: "É longe daqui."
            activities:
              - { type: learn, count: 2 }
              - { type: translate, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: listen_select }
          - id: pt-transport
            title: Transport
            description: Buses, trains, taxis and how you travel.
            vocabulary: [autocarro, elétrico, táxi, comboio, carro, bicicleta, bilhete]
            grammar:
              - pattern: "Vou de autocarro."
              - pattern: "O bilhete custa três euros."
              - pattern: "Vou de táxi."
            activities:
              - { type: learn, count: 2 }
              - { type: image_select, count: 2 }
              - { type: word_select, count: 2 }
              - { type: listen_type }
          - id: pt-prices
            title: Prices & Money
            description: Ask what things cost and talk about money.
            vocabulary: [euro, dinheiro, custa, caro, barato]
            grammar:
              - pattern: "Quanto custa?"
              - pattern: "Custa dez euros."
              - pattern: "É muito caro."
              - pattern: "É barato."
            activities:
              - { type: learn, count: 2 }
              - { type: word_select, count: 2 }
              - { type: translate, count: 2 }
              - type: dialogue
                scenario: buying_ticket
                goal: Ask how much the ticket to the center is and buy it.

      - id: casa-objetos
        title: Home & Objects
        description: Describe your home and say where things are.
        icon: 🏠
        steps:
          - id: pt-rooms
            title: Rooms & Home
            vocabulary: [apartamento, casa, quarto, cozinha, "casa de banho", hall, varanda]
            grammar:
              - pattern: "Moro num apartamento pequeno."
              - pattern: "O apartamento tem dois quartos."
              - pattern: "A cozinha é pequena."
            activities:
              - { type: learn, count: 3 }
              - { type: image_select, count: 2 }
              - { type: match }
              - { type: listen_select }
          - id: pt-furniture
            title: Furniture & Objects
            vocabulary: [cama, mesa, cadeira, armário, sofá, almofada, porta]
            grammar:
              - pattern: "A almofada está na cama."
              - pattern: "A cadeira está ao lado da mesa."
              - pattern: "A porta é grande."
            activities:
              - { type: learn, count: 2 }
              - { type: image_select, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: sentence_complete, count: 2 }
          - id: pt-prepositions
            title: Where Things Are
            description: Locate objects with em, debaixo de and ao lado de.
            vocabulary: [em, "em cima de", "debaixo de", "ao lado de", "dentro de", "atrás de", aqui]
            grammar:
              - pattern: "O gato está na cama."
              - pattern: "O livro está debaixo da mesa."
              - pattern: "A chave está no armário."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 3 }
              - { type: word_select, count: 2 }
              - { type: listen_select }
          - id: pt-everyday-things
            title: Everyday Things
            description: Common household objects and where they are.
            vocabulary: [janela, chave, telemóvel, televisão, candeeiro, panela, parede]
            grammar:
              - pattern: "O telemóvel está na mesa."
              - pattern: "O candeeiro está ao lado da janela."
              - pattern: "A chave está na porta."
            activities:
              - { type: learn, count: 2 }
              - { type: image_select, count: 2 }
              - { type: translate, count: 2 }
              - { type: word_select }

      - id: ontem-amanha
        title: Yesterday & Tomorrow
        description: Talk about yesterday and your plans for tomorrow.
        icon: 📅
        steps:
          - id: pt-where-i-was
            title: Where I Was
            description: Say where you were with estive, estiveste, esteve.
            vocabulary: [ontem, estive, estiveste, esteve, "na praia", "no trabalho", "em casa"]
            grammar:
              - pattern: "Ontem estive em casa."
              - pattern: "Onde estiveste?"
              - pattern: "Ele esteve no trabalho."
            activities:
              - { type: learn, count: 2 }
              - { type: translate, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: listen_select }
          - id: pt-what-i-did
            title: What I Did
            description: A few very common past forms you can reuse everywhere.
            vocabulary: [fiz, fui, vi, comi, falei, "com os amigos", "muito bem"]
            grammar:
              - pattern: "Falei com os amigos."
              - pattern: "Comi no restaurante."
              - pattern: "O que fizeste? — Fui à praia."
            activities:
              - { type: learn, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: listen_select }
          - id: pt-plans
            title: Tomorrow's Plans
            description: Present tense for plans, querer for wishes.
            vocabulary: [amanhã, "depois de amanhã", universidade, filme, cedo, quero, "tenho de"]
            grammar:
              - pattern: "Amanhã vou à universidade."
              - pattern: "Quero ver o filme."
              - pattern: "Tenho de sair cedo."
            activities:
              - { type: learn, count: 2 }
              - { type: translate, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: word_bank, count: 2 }
          - id: pt-weekend
            title: Last Weekend
            description: Put it together in a short conversation about the past.
            vocabulary: ["o fim de semana passado", "na montanha", caminhada, maravilhoso, fotografias, "muito bonito"]
            grammar:
              - pattern: "No fim de semana passado estive na montanha."
              - pattern: "Foi maravilhoso."
              - pattern: "Tirei muitas fotografias."
            activities:
              - { type: learn, count: 2 }
              - { type: translate, count: 2 }
              - { type: error_correct }
              - type: dialogue
                scenario: weekend_catchup
                goal: Tell a friend what you did last weekend and ask what they did.

    checkpoint:
      title: A1 Checkpoint
      required_score: 80
      activities:
