      - id: nl-b1-studie
        title: Studying & Training
        description: The Dutch education system, the inburgering route and infinitive constructions with and without te.
        icon: 🎓
        steps:
          - id: nl-b1-onderwijssysteem
            title: The Dutch Education System
            description: Understand the difference between mbo, hbo and wo and talk about diplomas and internships.
            vocabulary: ["het mbo", "het hbo", "het wo", "de opleiding", "het diploma", "de studiefinanciering", "de stage", "de universiteit"]
            grammar:
              - pattern: "Na het vmbo ging mijn dochter naar het mbo."
              - pattern: "Een hbo-opleiding duurt meestal vier jaar."
              - pattern: "Wetenschappelijk onderwijs volg je aan een universiteit."
              - pattern: "Ik wil mijn buitenlandse diploma laten waarderen."
            activities:
              - { type: learn, count: 2 }
              - { type: match }
              - { type: multiple_choice }
              - { type: listen_select }
              - { type: translate }
          - id: nl-b1-te-infinitief
            title: Infinitives with te
            description: Use te + infinitive after verbs like proberen, beginnen, vergeten, hopen and van plan zijn.
            vocabulary: ["proberen te", "van plan zijn om te", "besluiten te", "hopen te", "vergeten te", "beginnen te", "het examen", "zich inschrijven"]
            grammar:
              - pattern: "Ik probeer elke dag een uur Nederlands te studeren."
              - pattern: "Ik ben van plan om volgend jaar een hbo-opleiding te beginnen."
              - pattern: "Ze is vergeten zich in te schrijven voor het examen."
              - pattern: "Ik hoop dit jaar mijn inburgeringsexamen te halen."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: word_bank }
              - { type: error_correct }
          - id: nl-b1-staan-blijven-laten
            title: Staan te, Blijven and Laten
            description: "Describe ongoing actions with zitten/staan/liggen te, and use blijven and laten with a bare infinitive."
            vocabulary: ["staan te wachten", "zitten te leren", "liggen te slapen", "blijven praten", "laten zien", "laten nakijken", "het huiswerk", "de docent"]
            grammar:
              - pattern: "Ik zat de hele avond voor mijn examen te leren."
              - pattern: "We stonden twintig minuten op de bus te wachten."
              - pattern: "Hij bleef maar praten tijdens de les."
              - pattern: "Ik laat mijn brief door de docent nakijken."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete }
              - { type: error_correct }
              - { type: listen_type }
              - { type: translate }
          - id: nl-b1-inburgeringscursus
            title: Your Inburgering Route
            description: Talk with the gemeente about your learning route, exams and exemptions.
            vocabulary: ["de inburgeringsplicht", "de leerroute", "het taalniveau", "het examenonderdeel", "de taalschool", "de klantmanager", "de vrijstelling"]
            grammar:
              - pattern: "Ik moet voor alle examenonderdelen slagen om aan mijn inburgeringsplicht te voldoen."
              - pattern: "Volgens mijn klantmanager is de B1-route het beste voor mij."
              - pattern: "Ik vraag me af of ik een vrijstelling kan krijgen."
            activities:
              - { type: learn }
              - { type: multiple_choice }
              - { type: story }
              - { type: speak }
              - type: roleplay
                scenario: meeting_the_gemeente_klantmanager
                goal: Discuss your leerroute with the klantmanager at the gemeente, explain your education and goals, and ask how long you have to finish the exams.

      - id: nl-b1-wonen
        title: Housing Problems & Complaints
        description: Report repairs, use the passive voice and write a formal complaint to the woningcorporatie.
        icon: 🏠
        steps:
          - id: nl-b1-passief-worden
            title: The Passive with worden
            description: "Say what is being done with worden + participle, and who does it with door."
            vocabulary: ["de woningcorporatie", "de huurder", "de verhuurder", "de reparatie", "de lekkage", "de monteur", repareren, vervangen]
            grammar:
              - pattern: "De cv-ketel wordt morgen gerepareerd."
              - pattern: "Het lek in het dak werd pas na drie weken gerepareerd."
              - pattern: "De kozijnen worden door de woningcorporatie vervangen."
              - pattern: "Wanneer wordt de lift eindelijk gerepareerd?"
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: match }
              - { type: translate }
          - id: nl-b1-passief-zijn
            title: The Passive with zijn and er
            description: "Use zijn + participle for a finished result and er + worden for an action without a subject."
            vocabulary: ["de schimmel", "de vochtplek", "de huurverhoging", "de geluidsoverlast", "het huurcontract", "de buurman", "het portiek"]
            grammar:
              - pattern: "De verwarming is nog steeds niet gerepareerd."
              - pattern: "De brief is gisteren door de verhuurder verstuurd."
              - pattern: "Er wordt 's nachts veel lawaai gemaakt in het portiek."
              - pattern: "Er is nog niets aan de schimmel gedaan."
            activities:
              - { type: learn }
              - { type: fill_blank }
              - { type: error_correct, count: 2 }
              - { type: listen_select }
              - { type: sentence_complete }
          - id: nl-b1-formele-email
            title: Writing a Formal Email
            description: "Open, structure and close a formal email with Geachte…, u and Met vriendelijke groet."
            vocabulary: ["Geachte heer/mevrouw", "Met vriendelijke groet", "het onderwerp", "de bijlage", "naar aanleiding van", "het verzoek", "bij voorbaat dank"]
            grammar:
              - pattern: "Geachte heer De Vries,"
              - pattern: "Naar aanleiding van uw brief van 3 maart wil ik u het volgende laten weten."
              - pattern: "Ik verzoek u vriendelijk om de reparatie zo snel mogelijk uit te voeren."
              - pattern: "In de bijlage vindt u een foto van de schade."
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank }
              - { type: error_correct }
              - { type: sentence_complete }
              - { type: translate }
          - id: nl-b1-klacht-indienen
            title: Filing a Complaint
            description: Complain politely but firmly about a repair that has not been done and agree on a solution.
            vocabulary: ["een klacht indienen", "de Huurcommissie", "de termijn", "reageren op", "ontevreden", "de oplossing", "een afspraak nakomen"]
            grammar:
              - pattern: "Ik heb al drie keer gebeld, maar er is nog steeds niets gebeurd."
              - pattern: "Als het probleem niet binnen twee weken wordt opgelost, stap ik naar de Huurcommissie."
              - pattern: "Kunt u mij laten weten wanneer de monteur komt?"
            activities:
              - { type: learn }
              - { type: multiple_choice }
              - { type: story }
              - { type: speak }
              - type: roleplay
                scenario: complaint_to_housing_corporation
                goal: Phone the woningcorporatie about mould and a leak you reported weeks ago, stay polite but firm, and get a concrete date for the repair.

      - id: nl-b1-zorg
        title: The Healthcare System
        description: Health insurance, the eigen risico, referrals and relative clauses.
        icon: 🏥
        steps:
          - id: nl-b1-zorgverzekering
            title: Health Insurance
            description: "Understand the basisverzekering, the eigen risico and extra cover, using relative clauses with die and dat."
            vocabulary: ["de zorgverzekering", "de basisverzekering", "de aanvullende verzekering", "het eigen risico", "de premie", "de zorgverzekeraar", vergoeden, "de zorgtoeslag"]
            grammar:
              - pattern: "Iedereen die in Nederland woont of werkt, moet een basisverzekering hebben."
              - pattern: "Het eigen risico is het bedrag dat je zelf moet betalen."
              - pattern: "Ik zoek een aanvullende verzekering die de tandarts vergoedt."
              - pattern: "De huisarts valt niet onder het eigen risico."
            activities:
              - { type: learn, count: 2 }
              - { type: match }
              - { type: fill_blank }
              - { type: multiple_choice }
              - { type: translate }
          - id: nl-b1-verwijzing
            title: Referral to a Specialist
            description: "Talk about referrals and waiting lists with relative clauses using waar + preposition and met wie."
            vocabulary: ["de verwijzing", "de specialist", "het ziekenhuis", "de wachtlijst", "de doktersassistent", "het consult", "de huisartsenpost", doorverwijzen]
            grammar:
              - pattern: "Zonder verwijzing van de huisarts kun je niet naar de specialist."
              - pattern: "Het ziekenhuis waar ik naartoe ben verwezen, heeft een lange wachtlijst."
              - pattern: "De arts met wie ik sprak, was erg vriendelijk."
              - pattern: "Het formulier waarmee je je aanmeldt, staat op de website."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: error_correct }
              - { type: listen_select }
              - { type: translate }
          - id: nl-b1-relatief-wat-wie
            title: Relative wat and wie
            description: "Use wat after alles, iets, het enige and whole clauses, and wie for 'whoever'."
            vocabulary: ["de apotheek", "het recept", "de bijwerking", "de dosering", "het medicijn", voorschrijven, "de bijsluiter", innemen]
            grammar:
              - pattern: "Alles wat de dokter zei, heb ik opgeschreven."
              - pattern: "Het enige wat helpt, is rust."
              - pattern: "Wie koorts heeft, kan beter thuisblijven."
              - pattern: "Ik moet twee keer per dag een tablet innemen, wat best lastig is."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete }
              - { type: error_correct }
              - { type: match }
              - { type: speak }
          - id: nl-b1-gesprek-huisarts
            title: Explaining Symptoms to the GP
            description: Describe symptoms and their duration clearly and ask the right questions about tests and costs.
            vocabulary: ["de klacht", "de pijn", "last hebben van", "het onderzoek", "de uitslag", "de triage", "zich zorgen maken over", sinds]
            grammar:
              - pattern: "Ik heb al twee weken last van mijn rug."
              - pattern: "De pijn die ik 's nachts heb, wordt steeds erger."
              - pattern: "Ik maak me zorgen over de uitslag van het onderzoek."
            activities:
              - { type: learn }
              - { type: listen_type }
              - { type: story }
              - { type: multiple_choice }
              - type: video_call
                scenario: video_consult_with_gp
                goal: In a video consultation, describe your symptoms and how long you have had them, ask whether you need a referral and whether it falls under the eigen risico.

      - id: nl-b1-geldzaken
        title: Money & Administration
        description: Tax returns, allowances and banking, with verb clusters in subclauses.
        icon: 💶
        steps:
          - id: nl-b1-belastingaangifte
            title: The Tax Return
            description: "Talk about filing your tax return and use verb clusters such as had moeten doen in subclauses."
            vocabulary: ["de belastingaangifte", "de Belastingdienst", "de DigiD", "het inkomen", "de aftrekpost", "de teruggave", "de aanslag", invullen]
            grammar:
