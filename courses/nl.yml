              - pattern: "Bij een contract dat aan de deur is afgesloten, heb je veertien dagen bedenktijd."
              - pattern: "Ik wil graag weten wat de terugleverkosten voor mijn zonnepanelen zijn."
              - pattern: "Er wordt mij een hoger maandbedrag in rekening gebracht dan afgesproken."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: match }
              - { type: listen_type }
              - { type: translate }
              - type: dialogue
                scenario: door_to_door_energy_seller
                goal: A salesperson at the door offers a new energy contract; ask critical questions about the terms and politely decline to sign on the spot.
          - id: nl-b2-geschillencommissie
            title: Taking a Dispute Further
            description: "Write a formal notice of default (ingebrekestelling) and escalate to the Geschillencommissie with formal mocht-clauses."
            vocabulary: ["de Geschillencommissie", "het geschil", "de ingebrekestelling", "de schadevergoeding", "de redelijke termijn", "de garantie", bindend, "de webwinkel"]
            grammar:
              - pattern: "Hierbij stel ik u in gebreke en geef ik u veertien dagen om het probleem op te lossen."
              - pattern: "Mocht u niet reageren, dan leg ik het geschil voor aan de Geschillencommissie."
              - pattern: "Het product voldoet niet aan wat ik er redelijkerwijs van mocht verwachten."
              - pattern: "De uitspraak van de commissie is bindend voor beide partijen."
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: sentence_complete }
              - { type: translate, count: 2 }
              - { type: listen_select }
              - { type: multiple_choice }

      - id: nl-b2-media
        title: Media & Argument
        description: Read columns, write argumentative texts and letters to the editor, and debate a statement (Programma II).
        icon: 📰
        steps:
          - id: nl-b2-column
            title: Reading a Column
            description: "Recognise tone, irony and exaggeration in a newspaper column and find the writer's real point."
            vocabulary: ["de column", "de columnist", "de ironie", "de toon", "de strekking", overdrijven, "met een knipoog", "de vergelijking"]
            grammar:
              - pattern: "De columnist bedoelt het ironisch: eigenlijk vindt ze het een slecht plan."
              - pattern: "Wat is de strekking van deze column?"
              - pattern: "Met deze vergelijking wil de schrijver laten zien hoe absurd de regel is."
              - pattern: "Je zou bijna denken dat de trein nooit op tijd rijdt."
            activities:
              - { type: learn, count: 2 }
              - { type: story }
              - { type: multiple_choice, count: 3 }
              - { type: match }
              - { type: translate }
              - { type: listen_select }
              - { type: fill_blank, count: 2 }
          - id: nl-b2-betoog
            title: The Argumentative Text
            description: "Build a betoog: a clear stelling, supported arguments, a refuted counter-argument and a conclusion."
            vocabulary: ["de stelling", "het argument", "het tegenargument", "het betoog", onderbouwen, weerleggen, "de bron", "op grond van"]
            grammar:
              - pattern: "Ik ben van mening dat de overheid meer moet investeren in sociale huurwoningen."
              - pattern: "Een belangrijk argument hiervoor is dat de wachtlijsten steeds langer worden."
              - pattern: "Tegenstanders voeren aan dat dit te duur is; dat argument gaat echter niet op."
              - pattern: "Op grond van deze argumenten concludeer ik dat het plan moet worden uitgevoerd."
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: translate }
              - { type: listen_type }
              - { type: match }
          - id: nl-b2-ingezonden-brief
            title: A Letter to the Editor
            description: "React in writing to a newspaper article: refer to it, state your view, back it up and end with a call to action."
            vocabulary: ["de ingezonden brief", "de redactie", "naar aanleiding van", "de bewering", volstrekt, onterecht, "ter harte nemen", "aandacht besteden aan"]
            grammar:
              - pattern: "Naar aanleiding van uw artikel van 12 maart over de woningnood wil ik graag reageren."
              - pattern: "Het verbaast mij dat de schrijver geen aandacht besteedt aan de positie van starters."
              - pattern: "Ik ben het volstrekt oneens met de bewering dat jongeren lui zijn."
              - pattern: "Ik hoop dat de gemeente deze kritiek ter harte neemt."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: multiple_choice }
              - { type: translate, count: 2 }
              - { type: listen_select }
              - { type: word_bank }
          - id: nl-b2-debat
            title: Debating a Statement
            description: "Defend a position live: interrupt politely, concede a point, ask for evidence and keep the floor."
            vocabulary: ["het debat", "de tegenstander", "uitpraten", "inbrengen tegen", "een terecht punt", "de onderbouwing", "het eens zijn", "het oneens zijn"]
            grammar:
              - pattern: "Mag ik even uitpraten?"
              - pattern: "Daar wil ik tegen inbrengen dat de kosten veel hoger zijn."
              - pattern: "Dat is een terecht punt, maar het neemt niet weg dat het probleem blijft bestaan."
              - pattern: "Kunt u dat met cijfers onderbouwen?"
            activities:
              - { type: learn, count: 2 }
              - { type: listen_type, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: sentence_complete }
              - { type: translate }
              - { type: listen_select }
              - type: roleplay
                scenario: debate_on_a_statement
                goal: "Debate the statement 'Auto's moeten uit de binnenstad worden geweerd': take a side, give two arguments, concede one point and respond to a counter-argument."

      - id: nl-b2-identiteit
        title: History & Identity
        description: Go deeper into the war and the Holocaust, the colonial past, the fight against water and the constitution.
        icon: 🏛️
        steps:
          - id: nl-b2-oorlog-holocaust
            title: The War and the Holocaust
            description: "Talk about the occupation, the persecution of Jews, resistance and remembrance, mostly in the past passive."
            vocabulary: ["de Holocaust", "de deportatie", "het verzet", "de onderduiker", "de Februaristaking", "de herdenking", "het antisemitisme", "de bevrijding"]
            grammar:
              - pattern: "Ruim honderdduizend Joden werden vanuit Nederland gedeporteerd en vermoord."
              - pattern: "Anne Frank zat ruim twee jaar met haar familie ondergedoken in het Achterhuis."
              - pattern: "In februari 1941 legden duizenden Amsterdammers het werk neer uit protest tegen de Jodenvervolging."
              - pattern: "Het is belangrijk dat we blijven herdenken, zodat zoiets nooit meer gebeurt."
            activities:
              - { type: learn, count: 2 }
              - { type: story }
              - { type: multiple_choice, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: match }
              - { type: listen_type }
              - { type: translate, count: 2 }
          - id: nl-b2-koloniaal-verleden
            title: The Colonial Past and Keti Koti
            description: "Discuss the VOC and WIC, the slave trade, the abolition of slavery and how the Netherlands remembers it today."
            vocabulary: ["de VOC", "de slavenhandel", "het slavernijverleden", "de afschaffing", "Keti Koti", "de excuses", "de nazaten", "tot slaaf gemaakt"]
            grammar:
              - pattern: "Op 1 juli wordt met Keti Koti de afschaffing van de slavernij herdacht en gevierd."
              - pattern: "Hoewel de slavernij in 1863 werd afgeschaft, moesten veel tot slaaf gemaakten nog tien jaar doorwerken."
              - pattern: "In 2022 bood de premier namens de regering excuses aan voor het slavernijverleden."
              - pattern: "Lange tijd werd dit deel van de geschiedenis nauwelijks op school behandeld."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: listen_select, count: 2 }
              - { type: translate }
              - { type: word_bank }
              - { type: speak }
          - id: nl-b2-water
            title: Living Below Sea Level
            description: "Explain polders, waterschappen and the Afsluitdijk, and discuss climate adaptation with zullen + passive."
            vocabulary: ["het waterschap", "de polder", "het gemaal", "de stormvloedkering", "de zeespiegelstijging", inpolderen, droogleggen, "de Afsluitdijk"]
            grammar:
              - pattern: "Een groot deel van Nederland ligt onder de zeespiegel."
              - pattern: "De Afsluitdijk werd in 1932 voltooid en maakte van de Zuiderzee het IJsselmeer."
              - pattern: "Als de zeespiegel blijft stijgen, zullen de dijken verder verhoogd moeten worden."
              - pattern: "Het waterschap is verantwoordelijk voor de dijken en de waterkwaliteit."
            activities:
              - { type: learn, count: 2 }
              - { type: match }
              - { type: fill_blank, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: listen_type }
              - { type: translate }
              - { type: error_correct }
              - { type: story }
          - id: nl-b2-grondwet
            title: The Constitution and Equality
            description: "Discuss article 1, freedom of expression, self-determination and the role of the king under ministerial responsibility."
            vocabulary: ["de Grondwet", "artikel 1", "de gelijke behandeling", "de vrijheid van meningsuiting", "de zelfbeschikking", "de ministeriële verantwoordelijkheid", "de Troonrede", onschendbaar]
            grammar:
              - pattern: "Artikel 1 van de Grondwet verbiedt discriminatie op welke grond dan ook."
              - pattern: "Iedereen mag zelf bepalen met wie hij of zij trouwt."
              - pattern: "De koning is onschendbaar; de ministers zijn verantwoordelijk."
              - pattern: "Op Prinsjesdag leest de koning de Troonrede voor."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: error_correct }
              - { type: translate, count: 2 }
              - { type: listen_select }
              - type: dialogue
                scenario: discussing_freedom_of_speech
                goal: Discuss with a friend where freedom of expression ends, referring to article 1 and giving an example from the news.

    checkpoint:
      title: B2 Checkpoint
      required_score: 80
      activities:
        - { type: word_select, count: 3 }
        - { type: fill_blank, count: 3 }
        - { type: error_correct, count: 3 }
        - { type: listen_select, count: 2 }
        - { type: translate, count: 3 }
        - { type: story }
        - type: roleplay
          scenario: argued_discussion
          goal: Discuss a social issue (housing, work from home or energy) with a critical colleague, state and defend your position with arguments, concede a point and conclude.

  C1:
    title: Advanced
    description: >
      Use Dutch flexibly and precisely in professional and academic life: chair meetings, negotiate,
      write memos, minutes and objections, follow legal, scientific and economic debate, and catch
      idiom, irony and regional variation. This is the level of the CNaVT Educatief Professioneel (EDUP)
      and near-native professional use.

    units:
      - id: nl-c1-woordvolgorde
        title: Advanced Word Order
        description: Control verb clusters, the middle field and fronting, and tell separable from inseparable verbs by stress.
        icon: 🔀
        steps:
          - id: nl-c1-werkwoordclusters
            title: Verb Clusters
            description: "Stack modals and auxiliaries in subclauses and conditionals (had kunnen weten, heeft moeten inleveren)."
            vocabulary: [achteraf, voorzien, nalaten, inzien, vermijden, "het misverstand", "de inschatting", "de valkuil"]
            grammar:
              - pattern: "Ik had het kunnen weten als ik de mail beter had gelezen."
              - pattern: "Ik denk dat hij het rapport al had moeten inleveren."
              - pattern: "Ze zegt dat ze de vergadering niet heeft kunnen bijwonen."
              - pattern: "Achteraf gezien hadden we die valkuil kunnen voorzien."
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: sentence_complete }
              - { type: translate }
              - { type: listen_type }
              - { type: multiple_choice }
              - { type: speak }
          - id: nl-c1-middenveld
            title: The Middle Field & Negation
            description: "Place niet, adverbs and modal words like immers and overigens correctly in the middle of the sentence."
            vocabulary: [overigens, immers, namelijk, "in elk geval", nauwelijks, allerminst, geenszins, wellicht]
            grammar:
              - pattern: "Hij heeft het rapport gisteren niet gelezen."
              - pattern: "Ik heb dat boek niet aan hem gegeven, maar aan haar."
              - pattern: "Zij heeft immers nooit om die functie gevraagd."
              - pattern: "Dat was overigens geenszins de bedoeling."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: word_bank }
              - { type: match }
              - { type: listen_select }
              - { type: translate }
              - { type: story }
          - id: nl-c1-vooropplaatsing
            title: Fronting for Emphasis
            description: "Put the object, a contrast or a framing phrase first to set the topic or add emphasis."
            vocabulary: [benadrukken, "het contrast", "de nadruk", juist, uitgerekend, "nota bene", zelfs, "wat dat betreft"]
            grammar:
              - pattern: "Dat rapport heb ik nooit gezien."
              - pattern: "Uitgerekend vandaag moest de server uitvallen."
              - pattern: "Wat dat betreft heeft ze gelijk."
              - pattern: "Hem had ik niet verwacht, haar wel."
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: multiple_choice }
              - { type: listen_type }
              - { type: translate }
              - { type: error_correct }
              - type: dialogue
                scenario: correcting_a_colleague
                goal: Politely correct a colleague's wrong assumptions in a project update, fronting the element you want to contrast.
          - id: nl-c1-scheidbaar
            title: Separable or Not?
            description: "Hear and use the stress difference between separable and inseparable verbs (vóórkomen vs voorkómen)."
            vocabulary: [voorkómen, vóórkomen, ondergaan, doorzien, overwegen, onderhouden, omschrijven, "het voorvoegsel"]
            grammar:
              - pattern: "We moeten voorkómen dat dit nog eens gebeurt."
              - pattern: "Zulke fouten komen helaas vaak voor."
              - pattern: "De zon gaat om negen uur onder; de patiënt ondergaat morgen een operatie."
              - pattern: "Hij heeft het plan meteen doorzien."
            activities:
              - { type: learn, count: 2 }
              - { type: listen_select, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: fill_blank }
              - { type: error_correct }
              - { type: match }
              - { type: translate }
              - { type: speak }

      - id: nl-c1-woordvorming
        title: Word Formation & Nominal Style
        description: Build and unpack words with prefixes, suffixes and compounds, and switch between verbal and nominal style.
        icon: 🧩
        steps:
          - id: nl-c1-voorvoegsels
            title: "Prefixes: be-, ver-, ont-"
            description: "See how be-, ver- and ont- change a verb's meaning and make it transitive, causative or reversed."
            vocabulary: [bespreken, beantwoorden, verduidelijken, verbeteren, ontlasten, ontmoedigen, ontkrachten, bewerken]
            grammar:
              - pattern: "Kunt u uw standpunt nader verduidelijken?"
              - pattern: "De nieuwe regeling moet de huisartsen ontlasten."
              - pattern: "Wij zullen uw vraag zo snel mogelijk beantwoorden."
              - pattern: "Dat argument is inmiddels volledig ontkracht."
            activities:
              - { type: learn, count: 2 }
              - { type: match, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: multiple_choice }
              - { type: translate }
              - { type: listen_type }
              - { type: error_correct }
              - { type: story }
          - id: nl-c1-achtervoegsels
            title: "Suffixes: -baar, -ling, -heid, -ing"
            description: "Form adjectives and nouns with -baar, -ling, -heid, -ing and -schap and choose the right article."
            vocabulary: [haalbaar, betaalbaar, "de nieuweling", "de betrouwbaarheid", "de beschikbaarheid", "het leiderschap", "de verzekering", "de duurzaamheid"]
            grammar:
              - pattern: "Is dit plan financieel haalbaar?"
              - pattern: "De beschikbaarheid van betaalbare woningen neemt af."
              - pattern: "Als nieuweling moest ik nog veel leren."
              - pattern: "Betrouwbaarheid is voor ons het belangrijkste criterium."
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: fill_blank }
              - { type: match }
              - { type: listen_select }
              - { type: translate }
              - { type: speak }
          - id: nl-c1-samenstellingen
            title: Compounds
            description: "Build long compounds, choose the linking -s- or -en-, and find the head word that gives the article."
            vocabulary: ["de arbeidsmarkt", "het pannenkoekenrestaurant", "de zorgverzekering", "de verblijfsvergunning", "het overheidsbeleid", "de klantenservice", "de woningnood", "de tussenklank"]
            grammar:
              - pattern: "De verblijfsvergunning moet tijdig worden verlengd."
              - pattern: "Het overheidsbeleid op het gebied van woningbouw schiet tekort."
              - pattern: "We gingen met de kinderen naar een pannenkoekenrestaurant."
              - pattern: "De klantenservice was urenlang onbereikbaar."
            activities:
              - { type: learn, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: listen_type }
              - { type: match }
              - { type: multiple_choice }
              - { type: translate }
              - { type: story }
          - id: nl-c1-nominalisering
            title: From Verb to Noun
            description: "Rewrite verbal sentences in the nominal style of reports and official letters, and back again."
            vocabulary: ["de invoering", "het besluit", "de uitvoering", "de toename", "de afname", "het onderzoek", "de beoordeling", "naar aanleiding van"]
            grammar:
              - pattern: "Na de invoering van de nieuwe regels nam het aantal klachten toe."
              - pattern: "Het besluit tot sluiting van de vestiging is definitief."
              - pattern: "De uitvoering van het plan wordt uitgesteld."
              - pattern: "Naar aanleiding van uw verzoek is een onderzoek ingesteld."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: error_correct }
              - { type: translate }
              - { type: listen_select }
              - { type: multiple_choice }
              - { type: speak }

      - id: nl-c1-register
        title: Register & Tone
        description: Read officialese and rewrite it in plain B1 Dutch, write a bezwaarschrift, and pitch your tone in speech and writing.
        icon: 🎩
        steps:
          - id: nl-c1-ambtelijk
            title: Officialese vs Plain Language
            description: "Decode ambtelijke taal (teneinde, inzake, dienen te) and say the same thing in plain language."
            vocabulary: ["ten behoeve van", inzake, "dienen te", teneinde, conform, "de beschikking", "in behandeling nemen", "het taalniveau B1"]
            grammar:
              - pattern: "U dient het formulier vóór 1 maart te retourneren."
              - pattern: "Teneinde uw aanvraag in behandeling te kunnen nemen, verzoeken wij u een kopie van uw identiteitsbewijs mee te sturen."
              - pattern: "In gewone taal: stuur ons een kopie van uw paspoort, dan kunnen we uw aanvraag behandelen."
              - pattern: "Inzake uw verzoek van 3 mei delen wij u het volgende mee."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: match }
              - { type: translate }
              - { type: error_correct }
              - { type: listen_select }
              - { type: story }
          - id: nl-c1-bezwaarschrift
            title: Writing an Objection
            description: "Write a bezwaarschrift against a decision by the gemeente, Belastingdienst or IND: reference, grounds and request."
            vocabulary: ["het bezwaarschrift", "bezwaar maken", "de bezwaartermijn", "de belanghebbende", "de motivering", "de dagtekening", "het kenmerk", "de hoorzitting"]
            grammar:
              - pattern: "Hierbij maak ik bezwaar tegen het besluit van 12 maart 2026, kenmerk 2026-0451."
              - pattern: "Ik ben het niet eens met dit besluit, omdat mijn inkomen onjuist is vastgesteld."
              - pattern: "De bezwaartermijn bedraagt zes weken na de dagtekening van het besluit."
              - pattern: "Graag word ik in de gelegenheid gesteld mijn bezwaar mondeling toe te lichten."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: error_correct }
              - { type: sentence_complete }
              - { type: translate }
              - { type: listen_type }
              - type: roleplay
                scenario: objection_hearing
                goal: At a hoorzitting, explain why the gemeente's decision on your parking permit is wrong and what you ask them to do instead.
          - id: nl-c1-toon
            title: Finding the Right Tone
            description: "Choose between u and je, soften requests and complaints, and open and close emails at the right level."
            vocabulary: ["met vriendelijke groet", "hartelijke groet", "zou u zo vriendelijk willen zijn", tutoyeren, geachte, beste, "het taalgebruik", "de aanhef"]
            grammar:
              - pattern: "Zou u zo vriendelijk willen zijn mij uiterlijk vrijdag te laten weten of dit lukt?"
              - pattern: "Mag ik je tutoyeren, of zeg ik liever u?"
              - pattern: "Ik begrijp uw frustratie, en ik doe mijn best om dit snel op te lossen."
              - pattern: "Excuus voor de late reactie; het was een drukke week."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: fill_blank }
              - { type: listen_select }
              - { type: translate }
              - { type: match }
              - type: dialogue
                scenario: first_contact_with_a_new_client
                goal: Open a call with a new client formally, notice when they switch to je, and follow their lead naturally.
          - id: nl-c1-spreek-schrijftaal
            title: Spoken vs Written Dutch
            description: "Move between written connectors (echter, derhalve, zodoende) and their spoken equivalents."
            vocabulary: [derhalve, echter, zodoende, gaandeweg, "hoe dan ook", "nou ja", "maar goed", dus]
            grammar:
              - pattern: "Het project is echter vertraagd, maar ja, dat loopt dus wat uit."
              - pattern: "Derhalve wordt de deadline verschoven naar 1 juni."
              - pattern: "Nou ja, hoe dan ook, we zien wel."
              - pattern: "Zodoende hebben wij besloten de samenwerking te beëindigen."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: listen_type, count: 2 }
              - { type: word_bank }
              - { type: multiple_choice }
              - { type: translate }
              - { type: error_correct }
              - { type: speak }

      - id: nl-c1-professioneel
        title: Professional Communication
        description: Chair a meeting, negotiate a deal, de-escalate a conflict and probe with precise follow-up questions.
        icon: 🤝
        steps:
          - id: nl-c1-voorzitten
            title: Chairing a Meeting
            description: "Open, steer and close a meeting: give the floor, keep to the agenda, summarise and assign actions."
            vocabulary: ["de agenda", "het agendapunt", "de rondvraag", "het woord geven", samenvattend, "ter besluitvorming", "de actiepunten", afronden]
            grammar:
              - pattern: "Ik stel voor dat we naar het volgende agendapunt gaan."
              - pattern: "Mag ik Karin even het woord geven?"
              - pattern: "Samenvattend: we zijn het eens over het budget, maar niet over de planning."
              - pattern: "Is er nog iets voor de rondvraag? Dan sluit ik de vergadering."
