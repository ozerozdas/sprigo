              - pattern: "Ik wist niet dat ik aangifte had moeten doen."
              - pattern: "Ze zegt dat ze haar aangifte al heeft ingevuld."
              - pattern: "Ik denk dat ik geld terug zal krijgen."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct }
              - { type: translate }
          - id: nl-b1-toeslagen
            title: Allowances
            description: "Understand toeslagen and advance payments, and link ideas with zodat and tenzij."
            vocabulary: ["de toeslag", "de huurtoeslag", "de zorgtoeslag", "de kinderopvangtoeslag", "het voorschot", terugbetalen, "de wijziging", doorgeven]
            grammar:
              - pattern: "Geef wijzigingen in je inkomen snel door, zodat je later niets hoeft terug te betalen."
              - pattern: "Je krijgt geen zorgtoeslag, tenzij je inkomen laag genoeg is."
              - pattern: "Ik had de wijziging eerder moeten doorgeven."
              - pattern: "Het voorschot wordt elke maand op je rekening gestort."
            activities:
              - { type: learn }
              - { type: match }
              - { type: sentence_complete, count: 2 }
              - { type: multiple_choice }
              - { type: listen_select }
          - id: nl-b1-bankzaken
            title: Banking and Bills
            description: Handle transfers, direct debits and a blocked debit card.
            vocabulary: ["de bankrekening", "de pinpas", "de automatische incasso", "het rekeningnummer", "de rekening", "de aanmaning", overmaken, terugboeken]
            grammar:
              - pattern: "Ik heb het bedrag gisteren overgemaakt."
              - pattern: "Ik had niet gezien dat de rekening nog niet betaald was."
              - pattern: "Ik heb mijn pinpas laten blokkeren, omdat ik hem kwijt was."
              - pattern: "Je kunt een incasso binnen acht weken laten terugboeken."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank }
              - { type: error_correct }
              - { type: word_bank }
              - { type: translate }
          - id: nl-b1-betalingsregeling
            title: Payment Problems
            description: Explain a payment problem and arrange to pay in instalments.
            vocabulary: ["de betalingsregeling", "de schuldhulpverlening", "het budget", "de vaste lasten", "de achterstand", afbetalen, "de schuld", bezuinigen]
            grammar:
              - pattern: "Kan ik een betalingsregeling treffen?"
              - pattern: "Ik zou het bedrag graag in drie termijnen willen afbetalen."
              - pattern: "Hoewel ik weinig verdien, lukt het me om elke maand iets te sparen."
              - pattern: "Bovendien heb ik mijn abonnementen opgezegd om te bezuinigen."
            activities:
              - { type: learn }
              - { type: multiple_choice }
              - { type: story }
              - { type: speak }
              - type: roleplay
                scenario: payment_arrangement_call
                goal: Call the energy company about a late bill, explain why you could not pay on time and agree on a payment plan in monthly instalments.

      - id: nl-b1-samenleving
        title: Dutch Society
        description: Politics, norms and values for the KNM exam, and every use of er.
        icon: 🏛️
        steps:
          - id: nl-b1-politiek
            title: Parliament and Elections
            description: "Learn how the Tweede Kamer, the gemeenteraad and elections work, with existential and passive er."
            vocabulary: ["de Tweede Kamer", "de Eerste Kamer", "de gemeenteraad", "de verkiezingen", "de politieke partij", "de minister-president", "het kabinet", stemmen]
            grammar:
