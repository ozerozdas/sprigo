            description: "Put daar first for emphasis and split pronominal adverbs: daar ben ik het niet mee eens, waar heb je het over?"
            vocabulary: ["het eens zijn met", "zin hebben in", "denken aan", "praten over", "bang zijn voor", "houden van", "waar … over", "daar … mee"]
            grammar:
              - pattern: "Daar ben ik het helemaal niet mee eens."
              - pattern: "Daar heb ik nooit aan gedacht."
              - pattern: "Waar heb je het eigenlijk over?"
              - pattern: "Daar heb ik nu even geen zin in."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: listen_select, count: 2 }
              - { type: error_correct }
              - { type: translate }
              - type: dialogue
                scenario: disagreeing_with_a_friend
                goal: A friend proposes a weekend plan you dislike; push back with daar-constructions and suggest an alternative.
          - id: nl-b2-vaste-voorzetsels
            title: Nouns and Adjectives with Fixed Prepositions
            description: "Learn combinations like trots op, behoefte aan, verantwoordelijk voor, benieuwd naar, and replace the object with er-."
            vocabulary: ["trots op", "behoefte aan", "verantwoordelijk voor", "benieuwd naar", "interesse in", "tevreden met", "afhankelijk van", "gewend aan"]
            grammar:
