              - pattern: "Als ik dichter bij mijn werk woonde, zou ik elke dag fietsen."
              - pattern: "In het donker moet je verlichting op je fiets hebben."
              - pattern: "Wij zouden graag meer fietsenstallingen bij het station zien."
            activities:
              - { type: learn, count: 2 }
              - { type: match }
              - { type: fill_blank }
              - { type: listen_select }
              - { type: translate }
          - id: nl-b1-irrealis
            title: If Only
            description: "Talk about unreal situations in the present and past: als ik … had, zou ik …; als ik … had gedaan, zou …"
            vocabulary: ["de zonnepanelen", "de warmtepomp", "het energielabel", isoleren, "de energierekening", besparen, "de subsidie", "het gas"]
            grammar:
              - pattern: "Als ik een eigen huis had, zou ik zonnepanelen nemen."
              - pattern: "Als we het huis beter hadden geïsoleerd, zou de energierekening lager zijn geweest."
              - pattern: "Als ik jou was, zou ik subsidie aanvragen."
              - pattern: "Had ik dat maar eerder geweten!"
            activities:
              - { type: learn }
              - { type: sentence_complete, count: 2 }
              - { type: error_correct }
              - { type: word_bank }
              - { type: speak }
          - id: nl-b1-afval-scheiden
            title: Separating Waste
            description: Understand how waste is collected and recycled in your gemeente.
            vocabulary: ["het afval", "het plastic", "het gft", "de glasbak", "het statiegeld", "de container", scheiden, hergebruiken]
            grammar:
              - pattern: "Afval wordt in onze gemeente gescheiden opgehaald."
              - pattern: "Op blikjes zit tegenwoordig ook statiegeld."
              - pattern: "Weet je of dit bij het plastic mag?"
              - pattern: "Er wordt steeds meer afval gerecycled."
            activities:
              - { type: learn }
              - { type: image_select }
              - { type: fill_blank }
              - { type: error_correct }
              - { type: story }
          - id: nl-b1-klimaatdebat
            title: The Climate Debate
            description: Weigh up climate measures and say what the government and citizens should do.
            vocabulary: ["het klimaat", "de klimaatverandering", "de uitstoot", "de overheid", "de maatregel", "de zeespiegel", "de dijk", verantwoordelijk]
            grammar:
              - pattern: "De overheid zou meer moeten doen tegen klimaatverandering."
              - pattern: "Als de zeespiegel blijft stijgen, moeten de dijken nog hoger worden gemaakt."
              - pattern: "Ik vind dat iedereen er een steentje aan moet bijdragen."
            activities:
              - { type: learn }
              - { type: listen_select }
              - { type: multiple_choice }
              - { type: speak }
              - type: roleplay
                scenario: debating_a_car_free_centre
                goal: With a colleague, discuss whether the gemeente should make the city centre car-free, give arguments for and against using zou/zouden, and reach a nuanced conclusion.

      - id: nl-b1-sociaal-leven
        title: Social Life & Relationships
        description: Birthdays, invitations and cancellations, relationships, and choosing the right register in writing.
        icon: 🎉
        steps:
          - id: nl-b1-verjaardag
            title: The Dutch Birthday Party
            description: Know what to expect at a Dutch verjaardag and congratulate everyone the right way.
            vocabulary: ["de verjaardag", "de jarige", feliciteren, gefeliciteerd, "de kring", "het cadeau", "het feestje", "de taart"]
            grammar:
              - pattern: "Gefeliciteerd met je verjaardag!"
              - pattern: "Gefeliciteerd met je zus!"
              - pattern: "Iedereen zat in een kring en kreeg eerst koffie met taart."
              - pattern: "Hij had niet verwacht dat er zoveel mensen zouden komen."
            activities:
              - { type: learn, count: 2 }
              - { type: match }
              - { type: multiple_choice }
              - { type: listen_select }
              - { type: translate }
          - id: nl-b1-uitnodigen-afzeggen
            title: Inviting and Cancelling
            description: Invite people, accept, cancel politely and suggest a new date.
            vocabulary: [uitnodigen, "de uitnodiging", afzeggen, verzetten, toezeggen, "het etentje", jammer, inhalen]
            grammar:
              - pattern: "Heb je zin om zaterdag bij ons te komen eten?"
              - pattern: "Sorry, ik moet helaas afzeggen, want mijn zoon is ziek."
              - pattern: "Zullen we het etentje naar volgende week verzetten?"
              - pattern: "Ik had het je eerder moeten laten weten."
            activities:
              - { type: learn }
              - { type: fill_blank }
              - { type: error_correct }
              - { type: word_bank }
              - { type: speak }
          - id: nl-b1-register
            title: Formal and Informal Writing
            description: "Choose between je and u, Hoi, Beste and Geachte, and Groetjes or Met vriendelijke groet."
            vocabulary: [Hoi, Beste, Geachte, Groetjes, "Met vriendelijke groet", hierbij, u, jij]
            grammar:
              - pattern: "Hoi Sanne, leuk dat je zaterdag komt! Groetjes, Ahmed"
              - pattern: "Beste collega's, hierbij nodig ik jullie uit voor de afscheidsborrel van Peter."
              - pattern: "Geachte mevrouw Jansen, hierbij bevestig ik onze afspraak van 12 mei."
              - pattern: "Kunt u mij laten weten of dit schikt? Met vriendelijke groet, A. Haddad"
            activities:
              - { type: learn }
              - { type: match }
              - { type: error_correct }
              - { type: sentence_complete }
              - { type: translate }
          - id: nl-b1-relaties
            title: Relationships
            description: Talk about partners, in-laws and friendships, combining relative clauses and conditionals.
            vocabulary: ["de relatie", samenwonen, trouwen, "het geregistreerd partnerschap", "de schoonfamilie", "de vriendschap", "het contact", "uit elkaar gaan"]
            grammar:
              - pattern: "We wonen sinds vorig jaar samen."
              - pattern: "Mijn schoonouders, die in Groningen wonen, zien we niet zo vaak."
              - pattern: "Als we hadden geweten hoe duur een bruiloft is, zouden we het kleiner hebben gevierd."
              - pattern: "Ik vind het belangrijk om contact te houden met mijn familie in het buitenland."
            activities:
              - { type: learn }
              - { type: story }
              - { type: listen_type }
              - { type: multiple_choice }
              - type: video_call
                scenario: video_call_with_a_dutch_friend
                goal: Video-call a Dutch friend, congratulate them on moving in with their partner, apologise for cancelling last week's dinner and suggest a new date.

    checkpoint:
      title: B1 Checkpoint
