              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: match }
              - { type: translate }
              - { type: listen_type }
          - id: nl-b2-daar-nadruk
