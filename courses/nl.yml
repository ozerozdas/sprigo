              - { type: fill_blank, count: 3 }
              - { type: translate }
              - { type: sentence_complete }
              - { type: listen_type }
              - { type: error_correct }
          - id: nl-b2-mening-er
            title: Opinions with Er and Daar
            description: "Take a stand with ertegen/ervoor zijn, ervan overtuigd zijn, eraan twijfelen and daar valt veel voor te zeggen."
            vocabulary: ["ertegen zijn", "ervoor zijn", "twijfelen aan", "zeker van", "daar valt iets voor te zeggen", "het punt", "haalbaar", "de huurstijging"]
            grammar:
              - pattern: "Ik ben ertegen dat de huren nog verder stijgen."
              - pattern: "Ik ben er niet zo zeker van dat dit plan werkt."
