              - pattern: "Het voorschot wordt elke maand op je rekening gestort."
            activities:
              - { type: learn }
              - { type: match }
              - { type: sentence_complete, count: 2 }
              - { type: multiple_choice }
              - { type: listen_select }
              - { type: error_correct, count: 2 }
              - { type: translate, count: 2 }
              - { type: fill_blank }
          - id: nl-b1-bankzaken
            title: Banking and Bills
            description: Handle transfers, direct debits and a blocked debit card.
            vocabulary: ["de bankrekening", "de pinpas", "de automatische incasso", "het rekeningnummer", "de rekening", "de aanmaning", overmaken, terugboeken]
            grammar:
              - pattern: "Ik heb het bedrag gisteren overgemaakt."
              - pattern: "Ik had niet gezien dat de rekening nog niet betaald was."
              - pattern: "Ik heb mijn pinpas laten blokkeren, omdat ik hem kwijt was."
              - pattern: "Je kunt een incasso binnen acht weken laten terugboeken."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank }
              - { type: error_correct }
              - { type: word_bank }
              - { type: translate }
              - { type: listen_type, count: 2 }
              - { type: sentence_complete, count: 2 }
          - id: nl-b1-betalingsregeling
            title: Payment Problems
            description: Explain a payment problem and arrange to pay in instalments.
            vocabulary: ["de betalingsregeling", "de schuldhulpverlening", "het budget", "de vaste lasten", "de achterstand", afbetalen, "de schuld", bezuinigen]
            grammar:
              - pattern: "Kan ik een betalingsregeling treffen?"
              - pattern: "Ik zou het bedrag graag in drie termijnen willen afbetalen."
              - pattern: "Hoewel ik weinig verdien, lukt het me om elke maand iets te sparen."
              - pattern: "Bovendien heb ik mijn abonnementen opgezegd om te bezuinigen."
            activities:
              - { type: learn }
              - { type: multiple_choice }
              - { type: story }
              - { type: speak }
              - type: roleplay
                scenario: payment_arrangement_call
                goal: Call the energy company about a late bill, explain why you could not pay on time and agree on a payment plan in monthly instalments.
              - { type: error_correct, count: 2 }
              - { type: translate, count: 2 }
              - { type: fill_blank, count: 2 }

      - id: nl-b1-samenleving
        title: Dutch Society
        description: Politics, norms and values for the KNM exam, and every use of er.
        icon: 🏛️
        steps:
          - id: nl-b1-politiek
            title: Parliament and Elections
            description: "Learn how the Tweede Kamer, the gemeenteraad and elections work, with existential and passive er."
            vocabulary: ["de Tweede Kamer", "de Eerste Kamer", "de gemeenteraad", "de verkiezingen", "de politieke partij", "de minister-president", "het kabinet", stemmen]
            grammar:
              - pattern: "Er zijn in Nederland veel politieke partijen."
              - pattern: "De Tweede Kamer wordt in principe elke vier jaar gekozen."
              - pattern: "Bij de gemeenteraadsverkiezingen mogen ook veel inwoners zonder Nederlandse nationaliteit stemmen."
              - pattern: "Er wordt in de Tweede Kamer veel gedebatteerd over wonen."
            activities:
              - { type: learn, count: 2 }
              - { type: match }
              - { type: multiple_choice }
              - { type: listen_select }
              - { type: translate }
              - { type: error_correct, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: listen_type }
          - id: nl-b1-geschiedenis
            title: History, Water & the Monarchy
            description: "Key moments in Dutch history for the KNM exam: the fight against water, the Second World War and the Holocaust, the colonial past, and the King's role."
            vocabulary: ["de Tweede Wereldoorlog", "de bezetting", "de Jodenvervolging", "het koloniale verleden", "de slavernij", "de koning", "de Deltawerken", "de dijk"]
            grammar:
              - pattern: "Van 1940 tot 1945 werd Nederland bezet door Duitsland."
              - pattern: "Op 4 mei herdenken we de slachtoffers van de oorlog."
              - pattern: "Na de watersnoodramp van 1953 zijn de Deltawerken gebouwd."
              - pattern: "De koning heeft geen politieke macht; de ministers zijn verantwoordelijk."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 3 }
              - { type: fill_blank, count: 2 }
              - { type: listen_select, count: 2 }
              - { type: translate }
              - { type: story }
          - id: nl-b1-normen-waarden
            title: Norms and Values
            description: Discuss directness, appointments, equality and freedom of speech in Dutch society.
            vocabulary: ["de normen en waarden", "de gelijkheid", "de vrijheid van meningsuiting", direct, "de afspraak", "op tijd", "de Grondwet", "de discriminatie"]
            grammar:
              - pattern: "Nederlanders zeggen vaak direct wat ze ervan vinden."
              - pattern: "Het is hier gebruikelijk dat je een afspraak maakt voordat je langskomt."
              - pattern: "Volgens artikel 1 van de Grondwet mag niemand gediscrimineerd worden."
              - pattern: "Als je te laat komt, wordt dat niet altijd gewaardeerd."
            activities:
              - { type: learn }
              - { type: story }
              - { type: multiple_choice }
              - { type: sentence_complete }
              - { type: translate }
              - { type: error_correct, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: listen_type, count: 2 }
          - id: nl-b1-er-overzicht
            title: Er in All Its Uses
            description: "Recognise and combine existential, place, partitive, prepositional and passive er in local politics."
            vocabulary: ["de inspraakavond", "de buurtvereniging", "het bestemmingsplan", "de wethouder", "de burgemeester", "het voorstel", meepraten, "de bewoner"]
            grammar:
              - pattern: "Er staat een fiets voor de deur."
              - pattern: "Koekjes? Nee, dank je, ik heb er al drie gehad."
              - pattern: "Veel bewoners zijn er niet tevreden over."
              - pattern: "Er wordt op de inspraakavond over het voorstel gestemd."
            activities:
              - { type: learn }
              - { type: fill_blank }
              - { type: error_correct }
              - { type: listen_type }
              - type: roleplay
                scenario: neighbourhood_inspraakavond
                goal: At an inspraakavond of the gemeente, give your opinion about a plan for a new apartment block in your street and ask the wethouder a question about it.
              - { type: translate, count: 2 }
              - { type: sentence_complete, count: 2 }

      - id: nl-b1-nieuws
        title: News & Opinions
        description: Report what others said, ask indirect questions and give opinions with nuance.
        icon: 📰
        steps:
          - id: nl-b1-indirecte-rede
            title: Reporting the News
            description: "Report what someone said with dat + subclause, shifting the tense where needed."
            vocabulary: ["het nieuws", "de krant", "het artikel", "de kop", "het journaal", "de bron", "het onderzoek", volgens]
            grammar:
              - pattern: "Volgens het journaal komt er morgen een storm."
              - pattern: "De minister zei dat de belastingen omhoog zouden gaan."
              - pattern: "In de krant staat dat de huizenprijzen weer zijn gestegen."
              - pattern: "Hij vertelde dat hij het artikel al had gelezen."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank }
              - { type: listen_select }
              - { type: error_correct }
              - { type: translate }
              - { type: listen_type, count: 2 }
              - { type: sentence_complete, count: 2 }
          - id: nl-b1-indirecte-vragen
            title: Indirect Questions
            description: "Ask politely and wonder aloud with of, wat, waarom and wanneer + subclause word order."
            vocabulary: ["zich afvragen", "de vraag", "het antwoord", "de reden", duidelijk, onduidelijk, navragen, "de staking"]
            grammar:
              - pattern: "Weet jij of de staking morgen doorgaat?"
              - pattern: "Ik vraag me af waarom de treinen zo vaak vertraging hebben."
              - pattern: "Kunt u mij vertellen wat de nieuwe regels precies zijn?"
              - pattern: "Het is nog onduidelijk wanneer het besluit wordt genomen."
            activities:
              - { type: learn }
              - { type: word_bank, count: 2 }
              - { type: sentence_complete }
              - { type: error_correct }
              - { type: speak }
              - { type: translate, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: listen_type }
          - id: nl-b1-mening-geven
            title: Giving Opinions with Nuance
            description: "Agree, disagree and weigh arguments with hoewel, bovendien, echter, toch and daarom."
            vocabulary: ["volgens mij", "het eens zijn met", "het oneens zijn met", "aan de ene kant", "aan de andere kant", "het argument", "het standpunt", overtuigd]
            grammar:
              - pattern: "Hoewel ik het niet helemaal met je eens ben, begrijp ik je standpunt."
              - pattern: "Het plan is duur en bovendien lost het niets op. Daarom ben ik ertegen."
              - pattern: "De regering wil bezuinigen; de oppositie is het daar echter niet mee eens."
              - pattern: "Het is een duur plan, maar toch ben ik ervoor."
            activities:
              - { type: learn, count: 2 }
              - { type: match }
              - { type: sentence_complete }
              - { type: error_correct }
              - { type: translate }
              - { type: fill_blank, count: 2 }
              - { type: listen_type, count: 2 }
          - id: nl-b1-nieuws-bespreken
            title: Discussing a News Item
            description: "Summarise an article using nouns made from verbs (de verhoging, het invoeren) and discuss it."
            vocabulary: ["de discussie", "de verhoging", "de invoering", "het besluit", "de stijging", "de daling", "de kritiek", "leiden tot"]
            grammar:
              - pattern: "De verhoging van de huren leidt tot veel kritiek."
              - pattern: "Het invoeren van een rookverbod op terrassen zorgt voor veel discussie."
              - pattern: "Na de stijging van de energieprijzen gingen veel mensen zuiniger stoken."
            activities:
              - { type: learn }
              - { type: multiple_choice }
              - { type: story }
              - { type: listen_type }
              - type: video_call
                scenario: discussing_the_news
                goal: Discuss a news item about rising rents with a friend, summarise what the article said, give your opinion with arguments and react with nuance to theirs.
              - { type: error_correct, count: 2 }
              - { type: translate, count: 2 }
              - { type: fill_blank, count: 2 }

      - id: nl-b1-duurzaamheid
        title: Environment & Sustainability
        description: Cycling, energy, waste and climate, with zou/zouden and hypothetical if-clauses.
        icon: 🚲
        steps:
          - id: nl-b1-fietsland
            title: The Cycling Country
            description: "Talk about cycling in the Netherlands and make polite requests and wishes with zou/zouden."
            vocabulary: ["het fietspad", "de fietsenstalling", "de ov-fiets", "de e-bike", "de voorrang", "het verkeer", "de fietsverlichting", "de fietsbel"]
            grammar:
              - pattern: "Zou u uw fiets in de stalling willen zetten?"
              - pattern: "Als ik dichter bij mijn werk woonde, zou ik elke dag fietsen."
              - pattern: "In het donker moet je verlichting op je fiets hebben."
              - pattern: "Wij zouden graag meer fietsenstallingen bij het station zien."
            activities:
              - { type: learn, count: 2 }
              - { type: match }
              - { type: fill_blank }
              - { type: listen_select }
              - { type: translate }
              - { type: error_correct, count: 2 }
              - { type: listen_type, count: 2 }
              - { type: sentence_complete }
          - id: nl-b1-irrealis
            title: If Only
            description: "Talk about unreal situations in the present and past: als ik … had, zou ik …; als ik … had gedaan, zou …"
            vocabulary: ["de zonnepanelen", "de warmtepomp", "het energielabel", isoleren, "de energierekening", besparen, "de subsidie", "het gas"]
            grammar:
              - pattern: "Als ik een eigen huis had, zou ik zonnepanelen nemen."
              - pattern: "Als we het huis beter hadden geïsoleerd, zou de energierekening lager zijn geweest."
              - pattern: "Als ik jou was, zou ik subsidie aanvragen."
              - pattern: "Had ik dat maar eerder geweten!"
            activities:
              - { type: learn }
              - { type: sentence_complete, count: 2 }
              - { type: error_correct }
              - { type: word_bank }
              - { type: speak }
              - { type: translate, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: listen_type }
          - id: nl-b1-energie
            title: Energy Bills & Contracts
            description: Understand an energy contract, pass on meter readings, compare suppliers and save energy at home.
            vocabulary: ["de energieleverancier", "het voorschot", "de jaarafrekening", "de meterstand", "het vaste contract", "het variabele tarief", "de warmtepomp", besparen]
            grammar:
              - pattern: "Kunt u de meterstanden doorgeven?"
              - pattern: "Als ik minder verbruik, krijg ik geld terug bij de jaarafrekening."
              - pattern: "Ik overweeg om over te stappen naar een andere leverancier."
              - pattern: "Door de verwarming een graad lager te zetten, bespaar je veel energie."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: listen_type }
              - type: roleplay
                scenario: calling_the_energy_supplier
                goal: Call your energy supplier because your monthly advance payment went up, ask why, and agree on a lower amount.
              - { type: translate }
          - id: nl-b1-klimaatdebat
            title: The Climate Debate
            description: Weigh up climate measures and say what the government and citizens should do.
            vocabulary: ["het klimaat", "de klimaatverandering", "de uitstoot", "de overheid", "de maatregel", "de zeespiegel", "de dijk", verantwoordelijk]
            grammar:
              - pattern: "De overheid zou meer moeten doen tegen klimaatverandering."
              - pattern: "Als de zeespiegel blijft stijgen, moeten de dijken nog hoger worden gemaakt."
              - pattern: "Ik vind dat iedereen er een steentje aan moet bijdragen."
            activities:
              - { type: learn }
              - { type: listen_select }
              - { type: multiple_choice }
              - { type: speak }
              - type: roleplay
                scenario: debating_a_car_free_centre
                goal: With a colleague, discuss whether the gemeente should make the city centre car-free, give arguments for and against using zou/zouden, and reach a nuanced conclusion.
              - { type: error_correct, count: 2 }
              - { type: translate, count: 2 }
              - { type: fill_blank, count: 2 }

      - id: nl-b1-sociaal-leven
        title: Social Life & Relationships
        description: Birthdays, invitations and cancellations, relationships, and choosing the right register in writing.
        icon: 🎉
        steps:
          - id: nl-b1-partikels
            title: "Softening Words: even, maar, toch, wel, hoor"
            description: "Use the little words that make Dutch sound natural and polite: Kom maar binnen, Mag ik even iets vragen?, Dat is toch logisch, Het komt wel goed, hoor."
            vocabulary: [even, maar, toch, wel, eens, hoor, "hè", gewoon]
            grammar:
              - pattern: "Mag ik even iets vragen?"
              - pattern: "Kom maar binnen, hoor!"
              - pattern: "Je komt toch ook morgen?"
              - pattern: "Probeer het nog eens; het komt wel goed."
            activities:
              - { type: learn, count: 3 }
              - { type: multiple_choice, count: 2 }
              - { type: fill_blank, count: 3 }
              - { type: listen_select, count: 2 }
              - { type: dialogue }
              - { type: speak }
          - id: nl-b1-uitnodigen-afzeggen
            title: Inviting and Cancelling
            description: Invite people, accept, cancel politely and suggest a new date.
            vocabulary: [uitnodigen, "de uitnodiging", afzeggen, verzetten, toezeggen, "het etentje", jammer, inhalen]
            grammar:
              - pattern: "Heb je zin om zaterdag bij ons te komen eten?"
              - pattern: "Sorry, ik moet helaas afzeggen, want mijn zoon is ziek."
              - pattern: "Zullen we het etentje naar volgende week verzetten?"
              - pattern: "Ik had het je eerder moeten laten weten."
            activities:
              - { type: learn }
              - { type: fill_blank }
              - { type: error_correct }
              - { type: word_bank }
              - { type: speak }
              - { type: translate, count: 2 }
              - { type: listen_type, count: 2 }
              - { type: sentence_complete, count: 2 }
          - id: nl-b1-register
            title: Formal and Informal Writing
            description: "Choose between je and u, Hoi, Beste and Geachte, and Groetjes or Met vriendelijke groet."
            vocabulary: [Hoi, Beste, Geachte, Groetjes, "Met vriendelijke groet", hierbij, u, jij]
            grammar:
              - pattern: "Hoi Sanne, leuk dat je zaterdag komt! Groetjes, Ahmed"
              - pattern: "Beste collega's, hierbij nodig ik jullie uit voor de afscheidsborrel van Peter."
              - pattern: "Geachte mevrouw Jansen, hierbij bevestig ik onze afspraak van 12 mei."
              - pattern: "Kunt u mij laten weten of dit schikt? Met vriendelijke groet, A. Haddad"
            activities:
              - { type: learn }
              - { type: match }
              - { type: error_correct }
              - { type: sentence_complete }
              - { type: translate }
              - { type: fill_blank, count: 2 }
              - { type: listen_type, count: 2 }
          - id: nl-b1-relaties
            title: Relationships
            description: Talk about partners, in-laws and friendships, combining relative clauses and conditionals.
            vocabulary: ["de relatie", samenwonen, trouwen, "het geregistreerd partnerschap", "de schoonfamilie", "de vriendschap", "het contact", "uit elkaar gaan"]
            grammar:
              - pattern: "We wonen sinds vorig jaar samen."
              - pattern: "Mijn schoonouders, die in Groningen wonen, zien we niet zo vaak."
              - pattern: "Als we hadden geweten hoe duur een bruiloft is, zouden we het kleiner hebben gevierd."
              - pattern: "Ik vind het belangrijk om contact te houden met mijn familie in het buitenland."
            activities:
              - { type: learn }
              - { type: story }
              - { type: listen_type }
              - { type: multiple_choice }
              - type: video_call
                scenario: video_call_with_a_dutch_friend
                goal: Video-call a Dutch friend, congratulate them on moving in with their partner, apologise for cancelling last week's dinner and suggest a new date.
              - { type: error_correct, count: 2 }
              - { type: translate, count: 2 }
              - { type: fill_blank, count: 2 }

    checkpoint:
      title: B1 Checkpoint
      required_score: 80
      activities:
        - { type: word_select, count: 3 }
        - { type: fill_blank, count: 3 }
        - { type: error_correct, count: 2 }
        - { type: listen_select, count: 2 }
        - { type: translate, count: 3 }
        - { type: story }
        - type: roleplay
          scenario: formal_phone_call
          goal: Phone a government office or landlord about a problem, explain what happened, ask indirect questions and agree on next steps politely.

  B2:
    title: Upper Intermediate
    description: >
      Study, work and argue in Dutch with confidence: weigh pros and cons, write argumentative texts and letters,
      give presentations, negotiate at work and stand up for your rights as a tenant and consumer.
      This is the level of the Staatsexamen NT2 Programma II (hbo/university) and the CNaVT STRT and PROF exams.

    units:
      - id: nl-b2-zou
        title: Zou in Depth
        description: Regrets, polite advice, rumours and what would have happened, with zou, had moeten and verb clusters.
        icon: 🤔
        steps:
          - id: nl-b2-had-moeten
            title: Should Have Done
            description: "Express regret and reproach with had + infinitive + moeten/kunnen/hoeven at the end of the clause."
            vocabulary: [achteraf, "spijt hebben van", "het verwijt", "de kans", "laten liggen", "beter opletten", "achteraf gezien", "dat had je niet hoeven doen"]
            grammar:
              - pattern: "Je had me eerder moeten bellen, dan had ik je kunnen helpen."
              - pattern: "Achteraf gezien hadden we het project anders moeten aanpakken."
              - pattern: "Dat had je echt niet hoeven doen, maar het is heel lief."
              - pattern: "Ik heb spijt dat ik die kans heb laten liggen."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: translate }
              - { type: listen_type }
              - type: dialogue
                scenario: missed_deadline_with_colleague
                goal: A colleague missed a deadline; react with a mild reproach (je had het moeten zeggen) and agree how to avoid it next time.
          - id: nl-b2-zou-advies
            title: Polite Advice with Zou
            description: "Use zou for tactful requests, suggestions and advice: zou je willen, ik zou, zou het niet beter zijn om."
            vocabulary: [verstandig, "de offerte", "het advies", overwegen, "in jouw plaats", "het overleg", tactvol, "de leidinggevende"]
            grammar:
              - pattern: "Zou je iets langzamer willen praten?"
              - pattern: "Als ik jou was, zou ik er nog even een nachtje over slapen."
              - pattern: "Zou het niet verstandiger zijn om eerst een offerte op te vragen?"
              - pattern: "Je zou eens met je leidinggevende moeten overleggen."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: match }
              - { type: translate, count: 2 }
              - { type: listen_select }
              - { type: speak }
          - id: nl-b2-zou-geruchten
            title: Rumours and Unconfirmed Claims
            description: "Read the news like a native: zou signals that a claim is not confirmed (De minister zou … hebben geweten)."
            vocabulary: ["naar verluidt", "de getuige", "de verdachte", "het gerucht", bevestigen, ontkennen, "de bron", "op de hoogte"]
            grammar:
              - pattern: "De minister zou al maanden van de problemen op de hoogte zijn geweest."
              - pattern: "Volgens getuigen zou de verdachte via de achterdeur zijn gevlucht."
              - pattern: "Het bedrijf zou honderd banen willen schrappen, maar dat is nog niet bevestigd."
              - pattern: "Naar verluidt is de overname volgende week rond."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: listen_select, count: 2 }
              - { type: error_correct }
              - { type: story }
              - { type: translate }
          - id: nl-b2-zou-hebben
            title: Would Have and Future in the Past
            description: "Imagine a different past with zou + participle + hebben/zijn, and report promises with zou + infinitive."
            vocabulary: [beloven, "op tijd", halen, missen, "zonder jouw hulp", "wie weet", anders, "in dat geval"]
            grammar:
              - pattern: "Zonder jouw hulp zou ik het examen nooit gehaald hebben."
              - pattern: "Wat zou er gebeurd zijn als we die trein hadden gemist?"
              - pattern: "Ik was gekomen als ik het had geweten."
              - pattern: "Hij had beloofd dat hij zou bellen, maar hij heeft niets van zich laten horen."
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: translate }
              - { type: listen_type }
              - { type: match }

      - id: nl-b2-passief
        title: The Passive in Depth
        description: Passive with modals and in all tenses, impersonal er-passives, and the active alternatives Dutch often prefers.
        icon: ⚙️
        steps:
          - id: nl-b2-passief-modaal
            title: Passive with Modal Verbs
            description: "Combine modals with the passive: moet worden ingeleverd, kan niet worden opgelost, mag niet gerookt worden."
            vocabulary: [inleveren, ondertekenen, oplossen, goedkeuren, publiceren, "de aanvraag", "de termijn", uiterlijk]
            grammar:
              - pattern: "Het formulier moet uiterlijk 1 mei worden ingeleverd."
              - pattern: "Dit probleem kan niet zomaar worden opgelost."
              - pattern: "De aanvraag moet nog door de directeur goedgekeurd worden."
              - pattern: "Het rapport zal volgende week worden gepubliceerd."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: translate }
              - { type: listen_type }
              - { type: match }
          - id: nl-b2-passief-tijden
            title: Passive Past and Perfect
            description: "Choose between werd (a process in the past) and is/was + participle (a finished result)."
            vocabulary: [openen, verbouwen, verkopen, versturen, "het pand", "de verbouwing", "in gebruik nemen", "inmiddels"]
            grammar:
              - pattern: "Het Rijksmuseum werd in 1885 geopend."
              - pattern: "Het pand is inmiddels verkocht."
              - pattern: "Het huis was al verkocht voordat wij een bod konden doen."
              - pattern: "Tijdens de verbouwing werd het station tijdelijk gesloten."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: sentence_complete }
              - { type: listen_select }
              - { type: translate, count: 2 }
              - { type: story }
          - id: nl-b2-er-passief
            title: Er in the Passive
            description: "Use the impersonal er-passive for activities without a subject (er wordt vergaderd) and with indefinite subjects."
            vocabulary: [discussiëren, vergaderen, aanhouden, "het beleid", "de verwachting", "tot laat", bekendmaken, "de maatregel"]
            grammar:
              - pattern: "Er wordt veel over het nieuwe beleid gediscussieerd."
              - pattern: "Er werd tot laat in de avond vergaderd."
              - pattern: "Er zijn gisteren drie verdachten aangehouden."
              - pattern: "Er wordt van je verwacht dat je op tijd bent."
            activities:
              - { type: learn, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: fill_blank }
              - { type: listen_type, count: 2 }
              - { type: translate }
              - { type: match }
          - id: nl-b2-passief-alternatieven
            title: Alternatives to the Passive
            description: "Sound more natural with men, je, laten + infinitive and constructions like valt te / is te + infinitive."
            vocabulary: [men, "laten repareren", "laten weten", "valt te bezien", "valt mee", eenvoudig, "de huizenprijs", vermoeden]
            grammar:
