              - { type: match }
              - { type: fill_blank, count: 2 }
              - { type: listen_select, count: 2 }
              - { type: sentence_complete }
              - { type: translate }
              - type: roleplay
                scenario: chairing_a_team_meeting
                goal: Chair a short team meeting, go through two agenda points, give a colleague the floor and close with action points and the rondvraag.
          - id: nl-b2-feedback
            title: Feedback and Dutch Directness
            description: "Give and receive direct but respectful feedback: start positive, be concrete, use ik-boodschappen."
            vocabulary: ["de feedback", "het verbeterpunt", "het compliment", "concreet", "wat mij betreft", "eerlijk gezegd", "opbouwend", "direct"]
            grammar:
              - pattern: "Ik wil je graag wat feedback geven over je presentatie."
              - pattern: "Wat ik goed vond, is dat je heel duidelijk was."
              - pattern: "Eerlijk gezegd heb ik het idee dat de planning niet haalbaar is."
              - pattern: "Bedankt voor je feedback, daar ga ik mee aan de slag."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: word_bank }
              - { type: translate }
              - { type: listen_type }
              - type: dialogue
                scenario: peer_feedback_session
                goal: Give a colleague constructive feedback on a report, naming one strength and one concrete improvement point.
          - id: nl-b2-netwerken
            title: Networking and Your Pitch
            description: "Introduce yourself professionally in 30 seconds and keep the conversation going at a borrel or event."
            vocabulary: ["de pitch", "het netwerk", "de borrel", "gespecialiseerd in", "de achtergrond", "contact houden", "het visitekaartje", "de branche"]
            grammar:
              - pattern: "Ik werk als data-analist bij een energiebedrijf in Rotterdam."
              - pattern: "Ik ben gespecialiseerd in duurzame bouwprojecten."
              - pattern: "Waar ik naar op zoek ben, is een functie met meer verantwoordelijkheid."
              - pattern: "Zullen we contact houden via LinkedIn?"
            activities:
