              - { type: word_bank }
              - type: dialogue
                scenario: coffee_break_chat
                goal: Chat with a colleague at the coffee machine about a risky career move, and use or react to at least two proverbs naturally.
          - id: nl-c1-understatement
            title: Understatement
            description: "Read Dutch understatement correctly: niet verkeerd and best aardig often mean quite good, valt tegen means bad."
            vocabulary: ["niet verkeerd", "best aardig", "niet onaardig", "het valt mee", "het valt tegen", "even balen", "niet helemaal handig", "om het zacht uit te drukken"]
            grammar:
              - pattern: "Dat salaris is niet verkeerd, hoor."
              - pattern: "Het concert was best aardig, eigenlijk."
              - pattern: "Dat was niet helemaal handig van je."
              - pattern: "De resultaten vallen een beetje tegen, om het zacht uit te drukken."
