      - id: nl-c1-taal-cultuur
        title: Language, Culture & Humour
        description: Follow fast spoken Dutch, understand Flemish and regional variants, navigate Dutch directness, and get the joke in cabaret and columns.
        icon: 🎭
        steps:
          - id: nl-c1-spreektaal
            title: Authentic Speech
            description: "Understand the reduced forms of fast speech: 'k, ie, 't, d'r, m'n, effe."
            vocabulary: ["'k", ie, "'t", "d'r", "m'n", effe, "zo meteen", gewoon]
            grammar:
              - pattern: "Heb je 't al gezien? Ik weet niet of-ie komt."
              - pattern: "'k Heb d'r effe geen zin in."
              - pattern: "Kom je zo meteen nog even langs?"
              - pattern: "Ik doe gewoon m'n best, toch?"
            activities:
              - { type: learn, count: 2 }
              - { type: listen_type, count: 3 }
              - { type: listen_select, count: 2 }
              - { type: multiple_choice }
              - { type: translate }
              - { type: match }
              - { type: story }
          - id: nl-c1-vlaams
            title: Flemish & Regional Dutch
            description: "Recognise Belgian Dutch words and the soft g of the south, and know the Netherlands equivalents."
            vocabulary: [goesting, "de gsm", allee, "het pintje", plezant, ambetant, "de beenhouwer", "zeker en vast"]
            grammar:
              - pattern: "In Vlaanderen zeg je 'gsm', in Nederland 'mobiel'."
              - pattern: "Ik heb goesting in een pintje."
              - pattern: "Allee, dat is toch ambetant!"
              - pattern: "In Limburg en Brabant klinkt de zachte g heel anders dan in Holland."
            activities:
              - { type: learn, count: 2 }
              - { type: match, count: 2 }
              - { type: listen_select, count: 2 }
              - { type: multiple_choice }
              - { type: translate }
              - { type: fill_blank }
              - { type: error_correct }
              - type: dialogue
                scenario: meeting_a_flemish_colleague
                goal: Meet a colleague from the Antwerp office, understand their Flemish expressions and ask about the ones you don't know.
          - id: nl-c1-intercultureel
            title: Directness & the Polder
            description: "Understand Dutch directness, the drive for consensus and draagvlak, and how decisions are made in the polder."
            vocabulary: ["de directheid", "de botheid", "het poldermodel", "het overleg", "de consensus", afstemmen, "het draagvlak", "de hiërarchie"]
            grammar:
              - pattern: "Nederlanders zeggen vaak direct wat ze denken; dat is niet bot bedoeld."
              - pattern: "Eerst moet er draagvlak zijn, en daarvoor is veel overleg nodig."
              - pattern: "We moeten dit nog even afstemmen met de andere afdelingen."
              - pattern: "Het poldermodel draait om consensus tussen werkgevers, werknemers en overheid."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: multiple_choice }
              - { type: listen_type }
              - { type: translate }
              - { type: error_correct }
              - { type: speak }
          - id: nl-c1-cabaret
            title: Cabaret, Columns & Humour
            description: "Get the irony, wordplay and self-mockery in cabaret, the oudejaarsconference and newspaper columns."
            vocabulary: ["de cabaretier", "de oudejaarsconference", "de column", "de ironie", "de woordgrap", "de zelfspot", "de satire", "de clou"]
            grammar:
              - pattern: "Elk jaar kijkt half Nederland op 31 december naar de oudejaarsconference."
              - pattern: "Die column zit vol ironie; je moet tussen de regels door lezen."
              - pattern: "Nederlanders houden van zelfspot en droge humor."
              - pattern: "Ik snapte de woordgrap pas toen iemand hem uitlegde."
            activities:
              - { type: learn, count: 2 }
              - { type: listen_select, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: match }
              - { type: fill_blank }
              - { type: translate }
              - { type: error_correct }
              - { type: story }

