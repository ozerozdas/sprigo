              - pattern: "De Tweede Kamer wordt in principe elke vier jaar gekozen."
              - pattern: "Bij de gemeenteraadsverkiezingen mogen ook veel inwoners zonder Nederlandse nationaliteit stemmen."
              - pattern: "Er wordt in de Tweede Kamer veel gedebatteerd over wonen."
            activities:
              - { type: learn, count: 2 }
              - { type: match }
              - { type: multiple_choice }
              - { type: listen_select }
              - { type: translate }
          - id: nl-b1-er-plaats-hoeveelheid
