      - id: nl-b2-verbanden
        title: Linking Ideas
        description: Connect ideas like a writer with concession, conditions, proportion and weighing words.
        icon: 🔗
        steps:
          - id: nl-b2-toegeving
            title: Concession
            description: "Admit a point and still go on: hoewel, ondanks, desondanks, toch, al + inversion."
            vocabulary: [hoewel, ondanks, desondanks, toch, "al is", "neemt niet weg", weliswaar, "het nadeel"]
            grammar:
              - pattern: "Hoewel het plan duur is, steunt de gemeenteraad het."
              - pattern: "Ondanks de regen zijn we toch gaan fietsen."
              - pattern: "Hij had weinig tijd; desondanks heeft hij het rapport op tijd afgemaakt."
              - pattern: "Het is weliswaar een goed idee, maar het is niet haalbaar."
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: translate }
              - { type: listen_type }
              - { type: match }
          - id: nl-b2-voorwaarden
            title: "Conditions: mits, tenzij, zolang"
            description: "State precise conditions with mits (provided that), tenzij (unless), zolang (as long as) and stel dat."
            vocabulary: [mits, tenzij, zolang, "stel dat", "op voorwaarde dat", "in dat geval", "de voorwaarde", "anders"]
            grammar:
              - pattern: "Je mag het rapport later inleveren, mits je het vooraf meldt."
              - pattern: "We gaan morgen wandelen, tenzij het regent."
              - pattern: "Zolang je de huur betaalt, kan de verhuurder je niet zomaar uit huis zetten."
              - pattern: "Stel dat je ontslagen wordt, wat doe je dan?"
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: translate, count: 2 }
              - { type: listen_select }
              - { type: error_correct }
              - { type: speak }
          - id: nl-b2-hoe-meer
            title: The More, the Better
            description: "Express proportion with hoe … hoe, hoe … des te, naarmate and steeds + comparative."
            vocabulary: ["hoe meer", "des te", naarmate, steeds, toenemen, afnemen, "de kans", gespannen]
            grammar:
              - pattern: "Hoe meer je oefent, hoe beter je wordt."
              - pattern: "Hoe eerder je je aanmeldt, des te groter is de kans op een kamer."
              - pattern: "Naarmate de deadline dichterbij kwam, werd de sfeer gespannener."
              - pattern: "Het wordt steeds moeilijker om een betaalbare woning te vinden."
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: match }
              - { type: translate }
              - { type: listen_type, count: 2 }
              - { type: error_correct }
          - id: nl-b2-enerzijds-anderzijds
            title: Weighing Up and Concluding
            description: "Structure an argument: enerzijds … anderzijds, niet alleen … maar ook, bovendien, daarentegen, kortom."
            vocabulary: [enerzijds, anderzijds, bovendien, daarentegen, kortom, "niet alleen", "het voordeel", "opwegen tegen"]
            grammar:
              - pattern: "Enerzijds is thuiswerken efficiënt, anderzijds mis je het contact met collega's."
              - pattern: "Niet alleen de prijs, maar ook de kwaliteit is belangrijk."
              - pattern: "De trein is duur; de bus is daarentegen veel goedkoper."
              - pattern: "Kortom, de voordelen wegen niet op tegen de nadelen."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: error_correct }
              - { type: translate }
              - { type: listen_select }
              - type: roleplay
                scenario: work_from_home_discussion
                goal: Discuss with your manager whether to work from home three days a week, weighing pros and cons with enerzijds/anderzijds and ending with a conclusion.

      - id: nl-b2-er-voorzetsel
        title: Er + Preposition
        description: Master erover, ervan, erop and daar- forms, fixed prepositions with nouns and adjectives, and opinions with er.
        icon: 🎯
        steps:
          - id: nl-b2-er-vooruit
            title: Er Pointing Forward
            description: "Use er + preposition to announce a dat- or om te-clause: ik reken erop dat, ik ben ervan overtuigd dat."
            vocabulary: ["rekenen op", "overtuigd van", "afhangen van", "nadenken over", "zorgen voor", "zich verheugen op", "klagen over", "wennen aan"]
            grammar:
              - pattern: "Ik reken erop dat je morgen op tijd bent."
              - pattern: "Het hangt ervan af of we subsidie krijgen."
              - pattern: "We hebben erover nagedacht om naar Utrecht te verhuizen."
              - pattern: "Zorg ervoor dat alle documenten vóór vrijdag binnen zijn."
