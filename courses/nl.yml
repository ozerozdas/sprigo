              - { type: fill_blank, count: 2 }
              - { type: multiple_choice }
              - { type: error_correct, count: 2 }
              - { type: translate }
              - { type: listen_type }
              - type: roleplay
                scenario: salary_negotiation
                goal: Negotiate your starting salary with HR, justify a higher amount, react to their counter-offer and agree on secondary terms.

