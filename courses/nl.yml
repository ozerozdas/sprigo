              - { type: speak }

      - id: nl-b2-partikels
        title: Modal Particles in Depth
        description: Sound natural with maar, even, toch, wel, eens, nou, hoor, hè and zeg, and learn how natives stack them.
        icon: 💬
        steps:
          - id: nl-b2-maar-even
            title: "Maar and Even: Softening"
            description: "Even makes a request small and friendly; maar gives permission or encouragement. Know when each fits."
            vocabulary: [even, maar, "gerust", "rustig aan", "ga je gang", "het geeft niet", "wacht even", "kom maar"]
            grammar:
              - pattern: "Wacht maar even, ik kom zo bij je."
              - pattern: "Kun je me even helpen met deze tas?"
              - pattern: "Ga maar zitten, de dokter komt zo."
              - pattern: "Ik bel je straks even terug."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: listen_select, count: 2 }
              - { type: translate }
              - { type: word_bank }
              - type: dialogue
                scenario: neighbour_asks_a_favour
                goal: A neighbour asks you to water her plants; answer warmly using maar and even and arrange when to pick up the key.
          - id: nl-b2-toch-wel
            title: "Toch and Wel: Contrast and Reassurance"
            description: "Toch appeals to shared knowledge or expresses surprise; wel contrasts with a negative or softens a claim."
            vocabulary: [toch, wel, "toch nog", "wel degelijk", "dat dacht ik al", "ik zei het toch", "nou ja", "toch wel"]
            grammar:
              - pattern: "Ik heb het je toch gezegd!"
              - pattern: "Je bent toch niet boos op me?"
              - pattern: "Hij komt wel, maar hij is iets later."
              - pattern: "Ze zei dat ze geen tijd had, maar ze is toch gekomen."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: sentence_complete }
              - { type: listen_type, count: 2 }
              - { type: translate }
              - { type: match }
          - id: nl-b2-eens-nou-hoor
            title: Eens, Nou, Hoor, Hè and Zeg
            description: "Add tone in speech: eens (invitation), nou (impatience or hesitation), hoor (reassurance), hè (tag question), zeg (attention)."
            vocabulary: [eens, nou, hoor, "hè", zeg, "valt mee", "moet je eens kijken", "nou en"]
            grammar:
              - pattern: "Moet je eens kijken wat ik op zolder heb gevonden!"
              - pattern: "Nou, dat valt best mee."
              - pattern: "Het is koud vandaag, hè?"
              - pattern: "Zeg, heb jij mijn sleutels ergens gezien?"
            activities:
              - { type: learn, count: 2 }
              - { type: listen_select, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: translate }
              - { type: match }
              - { type: speak }
          - id: nl-b2-stapelen
            title: Stacking Particles
            description: "Combine particles in the natural order (toch maar, maar eens, eens even, nou maar) and hear how they change the tone."
            vocabulary: ["maar eens", "eens even", "toch maar", "nou maar", "gewoon", "wel even", "doe maar gewoon", "zeg het nou maar"]
            grammar:
              - pattern: "Kom maar eens langs als je tijd hebt."
              - pattern: "Doe toch maar gewoon mee, het is hartstikke gezellig."
              - pattern: "Zeg het nou maar gewoon."
              - pattern: "Dat had je toch wel even kunnen zeggen!"
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: listen_type, count: 2 }
              - { type: multiple_choice }
              - { type: translate }
              - type: roleplay
                scenario: persuading_a_shy_colleague
                goal: Persuade a hesitant colleague to come to the team outing, using stacked particles to sound friendly rather than pushy.

      - id: nl-b2-werkvloer
        title: Working Life in Depth
        description: Run and contribute to meetings, give and receive direct feedback, network and negotiate your salary.
        icon: 💼
        steps:
          - id: nl-b2-vergaderen
            title: Meetings and the Agenda
            description: "Follow a Dutch meeting: agendapunten, notulen, rondvraag and actiepunten, and take the floor politely."
            vocabulary: ["het agendapunt", "de notulen", "de voorzitter", "de rondvraag", "het actiepunt", "een besluit nemen", "het woord geven", "uitstellen"]
            grammar:
              - pattern: "Laten we beginnen met het eerste agendapunt."
              - pattern: "Mag ik hier even op reageren?"
              - pattern: "Wie neemt dit actiepunt op zich?"
              - pattern: "Zullen we dit punt naar de volgende vergadering verschuiven?"
