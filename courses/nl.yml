              - { type: sentence_complete, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: listen_select }
              - { type: translate, count: 2 }
              - { type: match }
              - { type: speak }
          - id: nl-b2-salaris
            title: Negotiating Salary and Terms
            description: "Negotiate salary and secondary terms with arguments, counter-offers and conditions (mits, zou er ruimte zijn)."
            vocabulary: ["het bruto maandsalaris", "de cao", "de salarisschaal", "het vakantiegeld", "de dertiende maand", "het tegenvoorstel", "de secundaire arbeidsvoorwaarden", onderhandelen]
            grammar:
              - pattern: "Gezien mijn ervaring had ik gedacht aan een bruto maandsalaris van 4.200 euro."
              - pattern: "Zou er ruimte zijn om over het salaris te onderhandelen?"
              - pattern: "Als het salaris vastligt, zijn er dan mogelijkheden voor een opleidingsbudget?"
              - pattern: "Ik ga akkoord, mits het contract na een jaar wordt omgezet in een vast contract."
            activities:
