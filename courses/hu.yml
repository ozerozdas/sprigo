            grammar:
              - pattern: "A génszerkesztés komoly etikai kérdéseket vet fel."
              - pattern: "Az állatkísérletek megítélése megosztó."
              - pattern: "A kockázatokat és az előnyöket egyaránt mérlegelni kell."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: listen_select }
          - id: ethical-debate
            title: An Ethical Debate
            vocabulary: [erkölcsileg, elfogadható, megengedhető, határ, visszaélés, szabályoz, felelősség]
            grammar:
              - pattern: "Hol húzzuk meg a határt?"
              - pattern: "Ez erkölcsileg nem elfogadható."
              - pattern: "Szigorúbban kellene szabályozni ezt a területet."
            activities:
              - { type: learn }
              - { type: sentence_complete, count: 2 }
              - { type: listen_type }
              - type: dialogue
