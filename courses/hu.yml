      - id: society-politics-c1
        title: Society & Politics
        description: Talk about the political system, elections, appearances and civic life.
        icon: 🏛️
        steps:
          - id: political-system
            title: The Political System
            vocabulary: [Országgyűlés, kormány, ellenzék, képviselő, miniszterelnök, "köztársasági elnök", párt, választás]
            grammar:
              - pattern: "Az Országgyűlést négyévente választják meg."
              - pattern: "Az ellenzék bírálta a kormány javaslatát."
              - pattern: "Melyik párt nyerte meg a választást?"
            activities:
              - { type: learn, count: 2 }
              - { type: match }
              - { type: fill_blank, count: 2 }
              - { type: listen_select }
          - id: elections-voting
            title: Elections & Voting
            vocabulary: [szavaz, szavazat, választópolgár, részvétel, népszavazás, jelölt, kampány, eredmény]
            grammar:
              - pattern: "A választásokon magas volt a részvétel."
              - pattern: "Kire fogsz szavazni?"
              - pattern: "A kampány során a jelöltek vitát folytattak."
            activities:
              - { type: learn }
              - { type: word_bank, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: translate }
          - id: seems-to-be
            title: Seems To Be (-nak tűnik, bizonyul)
            description: "Appearances with tűnik, látszik and bizonyul + -nak/-nek (jónak tűnik, sikeresnek bizonyult). tűnik and látszik are interchangeable here (jónak tűnik = jónak látszik)."
            vocabulary: [tűnik, látszik, bizonyul, "jónak tűnik", "sikeresnek bizonyult", "elégedettnek látszik", "úgy néz ki"]
            grammar:
              - pattern: "A terv jónak tűnik."
              - pattern: "Az intézkedés sikeresnek bizonyult."
              - pattern: "A miniszter elégedettnek látszott."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: listen_type }
          - id: rights-responsibilities
            title: Rights & Responsibilities
            vocabulary: [állampolgár, jog, kötelesség, Alaptörvény, törvény, "emberi jogok", tüntetés, véleménynyilvánítás]
            grammar:
              - pattern: "Minden állampolgárnak joga van a szabad véleménynyilvánításhoz."
              - pattern: "Ezrek tüntettek a parlament előtt."
              - pattern: "A törvénynek összhangban kell lennie az Alaptörvénnyel."
            activities:
              - { type: learn }
              - { type: sentence_complete, count: 2 }
              - { type: listen_select }
              - type: dialogue
                scenario: local_election_debate
                goal: Debate a local issue such as public transport or housing with a neighbour who disagrees with you.

      - id: idioms-colloquial-c1
        title: Idioms & Colloquial Hungarian
        description: Understand and use everyday slang, common idioms and lively reactions.
        icon: 😎
        steps:
          - id: colloquial-speech
            title: Colloquial Speech (tök jó, király)
            description: "tök = totally, király = awesome, jó fej = a nice, fun person, nem semmi = impressive, para = scary or stressful, gáz = embarrassing or bad, durva = harsh, intense, szuper = super."
            vocabulary: ["tök jó", király, "jó fej", "nem semmi", para, gáz, durva, szuper]
            grammar:
              - pattern: "Tök jó volt a buli!"
              - pattern: "Ez a srác nagyon jó fej."
              - pattern: "Nem semmi, amit csináltál!"
            activities:
              - { type: learn, count: 2 }
              - { type: match }
              - { type: multiple_choice, count: 2 }
              - { type: listen_select }
          - id: everyday-slang
            title: Everyday Slang (kaja, srác, haver)
            vocabulary: [kaja, pia, srác, csaj, haver, lóvé, kocsi, suli]
            grammar:
              - pattern: "Van valami kaja a hűtőben?"
              - pattern: "Ma este jönnek a haverok."
              - pattern: "Holnap nincs suli!"
            activities:
              - { type: learn }
              - { type: match }
              - { type: fill_blank, count: 2 }
              - { type: translate }
          - id: common-idioms
            title: Common Idioms
            description: "ég és föld a különbség = worlds apart (no van), töri a fejét = racks his brain, beadja a derekát = gives in, veszi a lapot = takes the hint, kilóg a lóláb = the hidden motive shows, nagy feneket kerít valaminek = makes a big fuss about it."
            vocabulary: ["ég és föld", "töri a fejét", "beadja a derekát", "veszi a lapot", "kilóg a lóláb", "nagy feneket kerít"]
            grammar:
              - pattern: "Ég és föld a különbség a kettő között."
              - pattern: "Már egy órája ezen töröm a fejem."
              - pattern: "Végül beadta a derekát, és megengedte."
            activities:
              - { type: learn }
              - { type: multiple_choice, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: error_correct }
          - id: reactions-interjections
            title: Reactions (Na ne!, Ugyan már!, Hű!)
            description: "na ne = no way! (disbelief), ugyan már = oh come on (dismissing), hű = wow, naná = you bet, hajrá = go for it, ejnye = tut-tut (mild reproach), jaj = oh no, ouch."
            vocabulary: ["na ne", jaj, hű, naná, "ugyan már", hajrá, ejnye]
            grammar:
              - pattern: "Na ne! Ezt nem hiszem el!"
              - pattern: "Ugyan már, ne butáskodj!"
              - pattern: "Hű, de szép!"
            activities:
              - { type: learn }
              - { type: sentence_complete, count: 2 }
              - { type: listen_type }
              - type: dialogue
                scenario: catching_up_with_a_friend
                goal: Catch up with an old friend over coffee in relaxed, colloquial Hungarian, reacting to their news.

    checkpoint:
      title: C1 Checkpoint
      required_score: 80
      activities:
        - { type: word_select, count: 3 }
        - { type: fill_blank, count: 3 }
