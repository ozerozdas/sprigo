  C2:
    title: Proficiency
    description: >
      Understand with ease virtually everything heard or read, from Petőfi to an official decision, summarise and mediate
      between registers, and express yourself spontaneously and precisely, choosing the right form of address, idiom,
      proverb and stance for every situation.

    units:
      - id: register-politeness-c2
        title: Register & Politeness
        description: Choose between te, Ön, maga and tetszik, use titles and say the right phrase on every occasion.
        icon: 🎩
        steps:
          - id: te-on-maga
            title: Te, Ön, Maga & Tetszik
            description: "Choose between tegezés, Ön and maga, and use tetszik + infinitive to address older people (Hogy tetszik lenni? = How are you?); here tetszik is the respectful you, not like. Csókolom is a respectful hello to older women (and from children to adults), not a kiss."
            vocabulary: [tegez, magáz, önöz, tegeződik, "Hogy tetszik lenni?", "Mit tetszik kérni?", csókolom, bácsi, néni]
            grammar:
              - pattern: "Hogy tetszik lenni, Marika néni?"
              - pattern: "Nyugodtan tegeződjünk!"
              - pattern: "Csókolom, Erzsi néni!"
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: translate }
          - id: titles-address
            title: Titles & Forms of Address
            vocabulary: ["doktor úr", tanárnő, néni, bácsi, uram, asszonyom, hölgyem, "igazgató úr"]
            grammar:
              - pattern: "Doktor úr, kérdezhetek valamit?"
              - pattern: "Elnézést, uram, ez az Ön kabátja?"
              - pattern: "Jani bácsi minden reggel itt kávézik."
            activities:
              - { type: learn }
              - { type: match }
              - { type: fill_blank, count: 2 }
              - { type: listen_type }
          - id: elaborate-politeness
            title: Elaborate Politeness (Parancsoljon, Legyen olyan kedves)
            vocabulary: [parancsoljon, tessék, "Szabad?", "Megengedi?", "legyen olyan kedves", "foglaljon helyet", "kezét csókolom"]
            grammar:
              - pattern: "Parancsoljon, foglaljon helyet!"
              - pattern: "Legyen olyan kedves, és adja át az üzenetemet!"
              - pattern: "Szabad egy táncra?"
              - pattern: "Megengedi, hogy leüljek?"
              - pattern: "Tessék, itt a kávéja!"
            activities:
              - { type: learn }
              - { type: sentence_complete, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: listen_select }
          - id: occasion-phrases
            title: The Right Phrase for Every Occasion
            description: "Egészségére váljék! is the host's reply when thanked for a meal (a toast is Egészségére!); Erőt, egészséget! wishes strength and health; Isten éltessen (to Ön, Isten éltesse) is for birthdays and name days; Fogadja őszinte részvétemet! offers condolences."
            vocabulary: ["Egészségére váljék!", "Fogadja őszinte részvétemet!", "Isten nyugosztalja!", "Erőt, egészséget!", "Isten éltessen!", "Isten éltesse!", "Boldog névnapot!", "Áldott, békés ünnepeket!"]
            grammar:
              - pattern: "Fogadja őszinte részvétemet!"
              - pattern: "Isten éltessen sokáig, erőt, egészséget!"
              - pattern: "Köszönöm az ebédet! – Egészségére váljék!"
            activities:
              - { type: learn }
              - { type: word_select, count: 2 }
              - { type: listen_select }
              - type: dialogue
                scenario: name_day_visit
                goal: Visit an elderly neighbour on her name day, greet her with the right phrases and keep the conversation polite and warm.

      - id: modality-stance-c2
        title: Modality & Stance
        description: Express obligation, propriety, willingness and certainty with precision.
        icon: ⚖️
        steps:
          - id: illik-erdemes
            title: Proper, Worth It, Advisable (illik, nem árt, célszerű)
            vocabulary: [illik, "nem illik", "nem árt", célszerű, ajánlatos, kívánatos, érdemes]
            grammar:
              - pattern: "Nem illik tele szájjal beszélni."
              - pattern: "Nem árt, ha előre szólsz."
              - pattern: "Célszerű időben foglalni."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: translate }
          - id: obliged-willing
            title: Obliged, Forced, Willing (köteles, kénytelen, hajlandó)
            vocabulary: [köteles, kénytelen, hajlandó, képes, jogosult, "módjában áll", tartozik]
            grammar:
              - pattern: "Kénytelen voltam lemondani az utat."
              - pattern: "A bérlő köteles megtéríteni a kárt."
              - pattern: "Nem vagyok hajlandó ezt elfogadni."
            activities:
              - { type: learn }
              - { type: sentence_complete, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: listen_type }
          - id: stance-adverbs
            title: Stance (meglepő módon, kétségkívül)
            vocabulary: [nyilvánvalóan, kétségkívül, "meglepő módon", "érthető módon", "furcsa módon", "szerencsés módon", nyilván]
            grammar:
              - pattern: "Meglepő módon senki sem tiltakozott."
              - pattern: "Érthető módon a lakók felháborodtak."
              - pattern: "Kétségkívül ez volt az év legjobb filmje."
            activities:
              - { type: learn }
              - { type: multiple_choice, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: listen_select }
          - id: degrees-of-certainty
            title: Degrees of Certainty
            vocabulary: [kizárt, elképzelhetetlen, valószínűtlen, "nem kizárt", "könnyen lehet", "szinte biztos", "minden jel arra mutat"]
            grammar:
              - pattern: "Minden jel arra mutat, hogy a terv sikerülni fog."
              - pattern: "Nem kizárt, hogy későbbre halasztják."
              - pattern: "Szinte biztos, hogy ő nyer."
            activities:
              - { type: learn }
              - { type: sentence_complete, count: 2 }
              - { type: listen_type }
              - type: dialogue
                scenario: weighing_the_odds
                goal: Weigh up with a colleague how likely the possible outcomes of a negotiation are and what you are obliged or willing to do.

      - id: idioms-szolasok-c2
        title: Idioms (szólások)
        description: Use idioms built on animals, the body and food in natural conversation.
        icon: 🐎
        steps:
          - id: animal-idioms
            title: Animal Idioms
            description: "bakot lő = make a blunder; lóvá tesz = fool someone; egyik kutya, másik eb = six of one, half a dozen of the other; kígyót-békát kiabál valakire = rail at someone; farkasszemet néz valakivel = stare someone down; itt van a kutya elásva = that's the crux of it."
            vocabulary: ["bakot lő", "lóvá tesz", "egyik kutya, másik eb", "kígyót-békát kiabál", "farkasszemet néz", "itt van a kutya elásva"]
            grammar:
              - pattern: "Ezzel nagy bakot lőttél."
              - pattern: "Egyik kutya, másik eb: mindkettő ugyanolyan."
              - pattern: "Ne tegyél lóvá!"
            activities:
              - { type: learn, count: 2 }
              - { type: match }
              - { type: multiple_choice, count: 2 }
              - { type: translate }
          - id: body-idioms
            title: Body Idioms
            description: "fáj a foga valamire (-ra/-re) = crave something; a nyelvem hegyén van = it's on the tip of my tongue; elveszti a fejét = lose one's head (panic); orránál fogva vezet = lead someone by the nose; a szívén visel = have at heart; fél szemmel figyel = keep half an eye on."
            vocabulary: ["fáj a foga valamire", "a nyelve hegyén van", "elveszti a fejét", "orránál fogva vezet", "a szívén visel", "fél szemmel figyel"]
            grammar:
              - pattern: "Régóta fáj a foga egy új autóra."
              - pattern: "A nyelvem hegyén van a neve."
              - pattern: "Nem kell rögtön elveszteni a fejed!"
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: listen_select }
          - id: food-idioms
            title: Food Idioms
            description: "nem eszik olyan forrón a kását = it's not as bad as it sounds; kerek perec = flatly, bluntly; kenyérre lehet kenni = (of a person) very good-natured; nem fenékig tejfel = not all a bed of roses; kutyából nem lesz szalonna = a leopard can't change its spots; mézesmázos = sugary, falsely sweet."
            vocabulary: ["nem eszik olyan forrón a kását", "kerek perec", "kenyérre lehet kenni", "nem fenékig tejfel", "kutyából nem lesz szalonna", mézesmázos]
            grammar:
              - pattern: "Nem eszik olyan forrón a kását."
              - pattern: "Kerek perec megmondta, hogy nem jön."
              - pattern: "Olyan kedves, hogy kenyérre lehet kenni."
            activities:
              - { type: learn }
              - { type: sentence_complete, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: listen_type }
          - id: idioms-in-conversation
            title: Idioms in Conversation
            description: "eső után köpönyeg = too late; kilóg a lóláb = the hidden motive shows; kosarat kap = be turned down; elviszi a balhét = take the rap; a fejére nő valakinek = (a person) gets out of hand; ég a talaj a lába alatt = things get too hot for someone."
            vocabulary: ["eső után köpönyeg", "kilóg a lóláb", "kosarat kap", "elviszi a balhét", "a fejére nő", "ég a talaj a lába alatt"]
            grammar:
              - pattern: "Most már eső után köpönyeg."
              - pattern: "Kosarat kapott a lánytól."
              - pattern: "Végül ő vitte el a balhét."
            activities:
              - { type: learn }
              - { type: sentence_complete, count: 2 }
              - { type: listen_select }
              - type: dialogue
                scenario: gossip_with_idioms
                goal: Gossip with a friend about a mutual acquaintance's latest adventure, using idioms naturally.

      - id: proverbs-kozmondasok-c2
        title: Proverbs (közmondások)
        description: Know the proverbs every Hungarian knows, quote them and explain them.
        icon: 📜
        steps:
          - id: common-proverbs
            title: Common Proverbs
            vocabulary: ["Aki korán kel, aranyat lel.", "Lassan járj, tovább érsz.", "Ajándék lónak ne nézd a fogát.", "Addig üsd a vasat, amíg meleg.", "Nem esik messze az alma a fájától."]
            grammar:
              - pattern: "Ahogy a mondás tartja: lassan járj, tovább érsz."
              - pattern: "Nem esik messze az alma a fájától: ő is orvos lett, mint az apja."
            activities:
              - { type: learn, count: 2 }
              - { type: match }
              - { type: fill_blank, count: 2 }
              - { type: listen_select }
          - id: wisdom-proverbs
            title: Proverbs of Wisdom
            vocabulary: ["Ki mint vet, úgy arat.", "Néma gyereknek anyja sem érti a szavát.", "Okos enged, szamár szenved.", "Jobb ma egy veréb, mint holnap egy túzok.", "Aki másnak vermet ás, maga esik bele."]
            grammar:
              - pattern: "Szólj neki bátran: néma gyereknek anyja sem érti a szavát!"
              - pattern: "Jobb ma egy veréb, mint holnap egy túzok, ezért elfogadtam az ajánlatot."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: translate }
          - id: proverbs-in-use
            title: Quoting Proverbs Naturally
            description: Quote half a proverb and let the listener finish it (Hát, aki korán kel…).
            vocabulary: ["ahogy a mondás tartja", "ahogy mondani szokás", "aki korán kel, aranyat lel", "addig üsd a vasat, amíg meleg", "sok kicsi sokra megy", "sok lúd disznót győz"]
            grammar:
              - pattern: "Hát, ahogy mondani szokás: aki korán kel…"
              - pattern: "Addig üsd a vasat, amíg meleg: írj neki még ma!"
              - pattern: "Sok kicsi sokra megy, ezért minden hónapban félreteszek egy keveset."
            activities:
              - { type: learn }
              - { type: sentence_complete, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: listen_type }
          - id: explaining-a-proverb
            title: Explaining a Proverb
            description: "Explain real Hungarian proverbs in Hungarian, naming the proverb (Lassan járj, tovább érsz; Aki korán kel, aranyat lel)."
            vocabulary: ["azt jelenti, hogy", "átvitt értelemben", "szó szerint", tanulság, megfelelő, magyarázat]
            grammar:
              - pattern: "Ez a közmondás azt jelenti, hogy aki kitartó, az célba ér."
              - pattern: "Szó szerint lefordítva nincs sok értelme."
              - pattern: "Mi ennek a közmondásnak az angol megfelelője?"
              - pattern: "A „Lassan járj, tovább érsz” azt jelenti, hogy a türelem kifizetődik."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: listen_select }
              - type: dialogue
                scenario: explaining_proverbs
                goal: Explain a Hungarian proverb to a foreign friend, find its equivalent in their language and use it in a real situation.

      - id: rhetoric-c2
        title: Rhetoric & Persuasion
        description: Open a speech, use rhetorical devices and recognise the most famous Hungarian lines.
        icon: 🎤
        steps:
          - id: opening-a-speech
            title: Opening a Speech
            description: "Open a speech formally. köszönt is indefinite with mindenkit (köszöntök mindenkit) and definite with Önöket or a vendégeket (köszöntöm a vendégeket)."
            vocabulary: ["Tisztelt Hölgyeim és Uraim!", "Kedves Barátaim!", megtiszteltetés, "engedjék meg", köszönt, egybegyűltek]
            grammar:
              - pattern: "Tisztelt Hölgyeim és Uraim! Nagy megtiszteltetés számomra, hogy itt lehetek."
              - pattern: "Engedjék meg, hogy néhány szóban bemutassam a tervünket."
              - pattern: "Szeretettel köszöntök mindenkit."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: listen_select }
          - id: rhetorical-devices
            title: Rhetorical Devices (minél … annál)
            vocabulary: ["költői kérdés", ismétlés, fokozás, ellentét, "minél … annál", "nemcsak … hanem … is"]
            grammar:
              - pattern: "Minél többet tanulunk, annál többet értünk."
              - pattern: "Nemcsak a mi jövőnkről, hanem gyermekeink jövőjéről is szó van."
              - pattern: "Meddig várunk még?"
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: translate }
          - id: famous-lines
            title: Lines Every Hungarian Knows
            description: Petőfi's Nemzeti dal, Kölcsey's Himnusz and Vörösmarty's Szózat, and how their lines live on in everyday speech.
            vocabulary: ["Nemzeti dal", Himnusz, Szózat, Petőfi, Kölcsey, Vörösmarty, "Itt az idő, most vagy soha!", "Talpra magyar!"]
            grammar:
              - pattern: "Talpra magyar, hí a haza! Itt az idő, most vagy soha!"
              - pattern: "Rabok legyünk, vagy szabadok? Ez a kérdés, válasszatok!"
              - pattern: "Isten, áldd meg a magyart jó kedvvel, bőséggel!"
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: listen_type }
              - { type: listen_select }
          - id: persuasive-speech
            title: A Persuasive Speech
            vocabulary: ["fel kell tennünk a kérdést", "itt az ideje", "nem engedhetjük meg", "közös felelősségünk", "arra kérem Önöket", "ne feledjük"]
            grammar:
              - pattern: "Itt az ideje, hogy cselekedjünk."
              - pattern: "Nem engedhetjük meg magunknak, hogy tétlenül nézzük."
              - pattern: "Arra kérem Önöket, hogy támogassák a javaslatot."
            activities:
              - { type: learn }
              - { type: sentence_complete, count: 2 }
              - { type: listen_select }
              - type: dialogue
                scenario: rehearsing_a_speech
                goal: Rehearse a short persuasive speech for a town meeting with a friend who interrupts with objections.

      - id: humour-wordplay-c2
        title: Humour, Irony & Wordplay
        description: Catch irony, enjoy King Matthias tales, tongue twisters and Móricka jokes.
        icon: 😄
        steps:
          - id: irony-sarcasm
            title: Irony & Sarcasm (na persze, hogyne)
            description: "na persze and hogyne literally mean of course; said sarcastically they mean yeah, right. még mit nem = no way."
            vocabulary: ["na persze", "még mit nem", hogyne, csodás, irónia, gúnyos, "már csak ez hiányzott"]
            grammar:
              - pattern: "Na persze, és én vagyok a kínai császár."
              - pattern: "Hogyne, majd pont te fogsz segíteni!"
              - pattern: "Csodás, már csak ez hiányzott!"
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: listen_type }
          - id: king-matthias-tales
            title: King Matthias Tales (Mátyás király)
            description: "Folk tales of King Matthias, the just king who travelled in disguise. Meghalt Mátyás király, oda az igazság = King Matthias is dead, justice is gone (igazság = justice here)."
            vocabulary: ["Mátyás király", igazságos, álruha, furfangos, "az okos lány", "kolozsvári bíró", mese]
            grammar:
              - pattern: "Mátyás király álruhában járta az országot."
              - pattern: "Az okos lány hozott is ajándékot, meg nem is."
              - pattern: "Meghalt Mátyás király, oda az igazság."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: listen_select, count: 2 }
              - { type: translate }
          - id: wordplay-tongue-twisters
            title: Wordplay & Tongue Twisters
            description: "beugrat = to trick someone (a verb; the noun is beugratás); csattanó and poén = punchline; nyelvtörő = tongue twister."
            vocabulary: [szójáték, kétértelmű, poén, csattanó, nyelvtörő, beugrat, "beugratós kérdés"]
            grammar:
              - pattern: "Mit sütsz, kis szűcs? Sós húst sütsz, kis szűcs?"
              - pattern: "Ez a vicc nem rossz, csak gyenge a csattanója."
              - pattern: "Jól beugrattál ezzel a kérdéssel!"
            activities:
              - { type: learn }
              - { type: listen_type, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: error_correct }
          - id: telling-jokes
            title: Telling Jokes (Móricka)
            vocabulary: [Móricka, vicc, elmesél, nevet, kinevet, humorérzék, "ezen jót nevettem"]
            grammar:
              - pattern: "Ismered azt a viccet, amikor Móricka elkésik az iskolából?"
              - pattern: "Ezen jót nevettem!"
              - pattern: "Nincs humorérzéke, semmin sem nevet."
            activities:
              - { type: learn }
              - { type: sentence_complete, count: 2 }
              - { type: listen_select }
              - type: dialogue
                scenario: telling_a_joke
                goal: Tell a friend a joke or a funny story, build up to the punchline and react to theirs with a touch of irony.

      - id: academic-writing-c2
        title: Academic & Formal Writing
        description: Write and discuss academic texts in an impersonal, precise style.
        icon: 🎓
        steps:
          - id: academic-phrases
            title: Academic Phrases
            vocabulary: ["jelen tanulmány", szakirodalom, "a fentiekből következik", "e tekintetben", hipotézis, módszertan, "az eredmények azt mutatják"]
            grammar:
              - pattern: "Jelen tanulmány célja annak vizsgálata, hogyan változik a fiatalok szókincse."
              - pattern: "A fentiekből következik, hogy a hipotézis igazolódott."
              - pattern: "Az eredmények azt mutatják, hogy a módszer hatékony."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: translate }
          - id: citing-sources
            title: Citing & Referring (szerint, alapján)
            vocabulary: [szerint, alapján, hivatkozik, idéz, forrás, lábjegyzet, irodalomjegyzék]
            grammar:
              - pattern: "Kovács (2019) szerint a jelenség ennél összetettebb."
              - pattern: "A felmérés alapján megállapítható, hogy a részvétel csökkent."
              - pattern: "A szerző több korábbi kutatásra is hivatkozik."
            activities:
              - { type: learn }
              - { type: multiple_choice, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: listen_type }
          - id: impersonal-style
            title: Impersonal Style (megállapítható, feltételezhető)
            description: Impersonal statements with -ható/-hető and hogy (megállapítható, hogy…; feltételezhető, hogy…) and figyelembe véve.
            vocabulary: [megállapítható, elmondható, kijelenthető, feltételezhető, "figyelembe véve", "tekintettel arra"]
            grammar:
              - pattern: "Megállapítható, hogy a változás jelentős."
              - pattern: "Feltételezhető, hogy a tendencia folytatódik."
              - pattern: "A korlátokat figyelembe véve az eredmények biztatóak."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: error_correct }
          - id: writing-an-abstract
            title: Writing an Abstract
            vocabulary: [összefoglaló, kivonat, kulcsszavak, dolgozat, tárgyal, bemutat, rávilágít]
            grammar:
              - pattern: "A dolgozat a nyelvújítás hatását tárgyalja."
              - pattern: "A tanulmány rávilágít a kérdés gyakorlati jelentőségére."
              - pattern: "Kulcsszavak: nyelvújítás, szókincs, Kazinczy Ferenc."
            activities:
              - { type: learn }
              - { type: sentence_complete, count: 2 }
              - { type: listen_select }
              - type: dialogue
                scenario: thesis_supervision
                goal: Discuss the structure and main findings of your thesis with your supervisor and defend your methodology.

      - id: literature-style-c2
        title: Literature & Style
        description: Read the classics, recognise archaic forms and analyse a poem.
        icon: ✒️
        steps:
          - id: classic-poets
            title: Classic Poets (Petőfi, Arany, Ady, József Attila)
            description: "versszak = stanza, verssor = line of a poem."
            vocabulary: ["Petőfi Sándor", "Arany János", "Ady Endre", "József Attila", vers, költő, versszak, verssor, rím]
            grammar:
              - pattern: "Petőfi Sándor a magyar irodalom egyik legismertebb költője."
              - pattern: "Arany János Toldija ma is kötelező olvasmány."
              - pattern: "József Attila verseit sokan fejből tudják."
            activities:
              - { type: learn, count: 2 }
              - { type: match }
              - { type: fill_blank, count: 2 }
              - { type: listen_select }
          - id: archaic-forms
            title: Archaic Forms (vala, monda, látván)
            description: "Recognise archaic forms in older texts and say them in modern Hungarian (vala = volt, valék = voltam, monda = mondta, lőn = lett as in became or there was, látván = látva, lévén = being, imigyen = így)."
            vocabulary: [vala, monda, lőn, látván, lévén, imigyen, valék]
            grammar:
              - pattern: "Ez vala a régi magyarok szokása."
              - pattern: "Ezt látván a király elmosolyodott."
              - pattern: "És monda Isten: Legyen világosság!"
            activities:
              - { type: learn }
              - { type: multiple_choice, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: translate }
          - id: literary-style
            title: Literary Style (metafora, hasonlat)
            vocabulary: [metafora, hasonlat, megszemélyesítés, alliteráció, jelző, "költői szórend", hangulat]
            grammar:
              - pattern: "Ősz húrja zsong, jajong, busong a tájon."
              - pattern: "A metafora azonosít, a hasonlat összehasonlít."
              - pattern: "Kosztolányi stílusa könnyed és pontos."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: listen_type }
          - id: analysing-a-poem
            title: Analysing a Poem
            vocabulary: ["a vers témája", "lírai én", mű, üzenet, értelmez, jelképez, elmúlás]
            grammar:
              - pattern: "A vers témája az elmúlás."
              - pattern: "Szerintem a fa a reményt jelképezi."
              - pattern: "Hogyan értelmezed az utolsó versszakot?"
            activities:
              - { type: learn }
              - { type: sentence_complete, count: 2 }
              - { type: listen_select }
              - type: dialogue
                scenario: book_club
                goal: Discuss a Hungarian novel or poem at a book club, interpreting its images and defending your reading.

      - id: language-identity-c2
        title: Language & Identity
        description: Explore the language reform, dialects, word origins and Hungarians beyond the borders.
        icon: 🗺️
        steps:
          - id: language-reform
            title: The Language Reform (nyelvújítás)
            description: "The language reform (around 1770–1830, led by Kazinczy) coined thousands of words (mozdony, cukrászda, kedvenc). Later calques such as számítógép (after computer) are 20th-century."
            vocabulary: [nyelvújítás, Kazinczy, szóalkotás, szókincs, jövevényszó, "idegen szó", tükörszó]
            grammar:
              - pattern: "A nyelvújítás idején több ezer új szó született."
              - pattern: "A mozdony és a cukrászda is a nyelvújítás korából származik."
              - pattern: "A számítógép szó a computer mintájára jött létre."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: translate }
          - id: regional-speech
            title: Regional Speech (ö-zés, tájszavak)
            description: Regional features such as ö-zés around Szeged (mögyök for megyek), Palóc vowels and old words kept in Transylvania.
            vocabulary: [nyelvjárás, tájszó, ö-zés, palóc, erdélyi, csángó, kiejtés]
            grammar:
              - pattern: "Szegeden sokan ö-znek: azt mondják, hogy mögyök."
              - pattern: "A palóc nyelvjárásban az a-t rövid á-hoz hasonlóan ejtik."
              - pattern: "Az erdélyi magyarok sok régi szót megőriztek."
            activities:
              - { type: learn }
              - { type: listen_select, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: error_correct }
          - id: word-origins
            title: Where Words Come From
            vocabulary: [finnugor, uráli, "ótörök eredetű", szláv, latin, német, etimológia]
            grammar:
              - pattern: "A magyar az uráli nyelvcsaládba tartozik."
              - pattern: "Az alma és a búza ótörök eredetű szavak."
              - pattern: "A kéz és a víz finnugor örökség."
            activities:
              - { type: learn }
              - { type: multiple_choice, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: listen_type }
          - id: beyond-the-borders
            title: Hungarians Beyond the Borders
            vocabulary: ["határon túli", kisebbség, anyaország, "kettős állampolgárság", Erdély, Felvidék, Vajdaság, diaszpóra]
            grammar:
              - pattern: "Sok magyar él a határokon túl, például Erdélyben és a Felvidéken."
              - pattern: "Kettős állampolgárságot kapott."
              - pattern: "A diaszpórában élők is ápolják a nyelvet."
            activities:
              - { type: learn }
              - { type: sentence_complete, count: 2 }
              - { type: listen_select }
              - type: dialogue
                scenario: identity_conversation
                goal: Talk with a Hungarian from Transylvania about how language, dialect and borders shape identity.

      - id: mastery-mediation-c2
        title: Mastery & Mediation
        description: Summarise, paraphrase, move between registers and interpret for others.
        icon: 🌉
        steps:
          - id: summarising
            title: Summarising (dióhéjban, a lényeg)
            vocabulary: [összefoglalva, röviden, "a lényeg az, hogy", dióhéjban, "más szóval", vagyis]
            grammar:
              - pattern: "Dióhéjban: a projekt késik, de nincs veszélyben."
              - pattern: "A lényeg az, hogy mindenki elégedett."
              - pattern: "Más szóval: kevesebb pénzből többet kell kihoznunk."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: translate }
          - id: paraphrasing
            title: Paraphrasing (magyarán, azaz)
            description: "fogalmaz = to word something (átfogalmaz, egyszerűbben fogalmazva), not foglal; magyarán = in plain words, bluntly; azaz and értsd = that is; körülír = describe in other words."
            vocabulary: [azaz, értsd, magyarán, "egyszerűbben fogalmazva", átfogalmaz, körülír, szinonima]
            grammar:
              - pattern: "Magyarán: nem kaptuk meg a pénzt."
              - pattern: "Egyszerűbben fogalmazva: túl drága."
              - pattern: "Hogyan fogalmaznád át ezt a mondatot?"
            activities:
              - { type: learn }
              - { type: word_bank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: listen_type }
          - id: between-registers
            title: Between Registers (hivatalos – hétköznapi)
            vocabulary: ["hivatalos nyelv", "hétköznapi nyelv", szaknyelv, közérthető, elmagyaráz, "hivatali zsargon"]
            grammar:
              - pattern: "Elmagyaráznád közérthetően ezt a hivatalos levelet?"
              - pattern: "A szaknyelvet le kell fordítani hétköznapi nyelvre."
              - pattern: "Ez hivatali zsargon, egyszerűen annyit jelent, hogy fizetni kell."
            activities:
              - { type: learn }
              - { type: sentence_complete, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: listen_select }
          - id: interpreting
            title: Interpreting for Someone
            vocabulary: [tolmácsol, tolmács, fordít, közvetít, "azt mondja, hogy", "azt kérdezi", "azt szeretné tudni"]
            grammar:
              - pattern: "Azt kérdezi, hogy mennyibe kerül a javítás."
              - pattern: "Szívesen tolmácsolok, ha szükséges."
              - pattern: "Azt szeretné tudni, hogy holnap is nyitva lesznek-e."
              - pattern: "Azt mondja, hogy erősen fáj a dereka."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: listen_type }
              - type: dialogue
                scenario: interpreting_at_the_doctor
                goal: Interpret between a doctor and a foreign friend, passing on questions and answers accurately and politely.

