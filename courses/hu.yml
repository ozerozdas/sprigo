              - pattern: "A mesterséges intelligencia sok munkahelyet átalakít."
              - pattern: "Az algoritmusok döntéseit nehéz átlátni."
              - pattern: "Kié a felelősség, ha egy önvezető autó balesetet okoz?"
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: translate }
          - id: privacy-data
            title: Privacy & Data
            vocabulary: [adatvédelem, magánszféra, megfigyelés, "személyes adat", hozzájárulás, adatszivárgás, kiszivárog, titkosít]
            grammar:
              - pattern: "A személyes adataimat nem adom ki senkinek."
              - pattern: "A cég a hozzájárulásunk nélkül használta az adatainkat."
              - pattern: "Kiszivárogtak az ügyfelek adatai."
            activities:
              - { type: learn }
              - { type: word_bank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: listen_type }
          - id: medicine-ethics
            title: Medicine & Ethics
